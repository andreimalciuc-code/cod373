<style>

  @media (max-width:1000px){ .lines th.ugh, .lines td.ugc{ display:none; } }

<script>
const SUPABASE_URL='https://vzatmfhkwiojqkowtftg.supabase.co';
const SUPABASE_KEY='sb_publishable_wNj9S8eta39n1Gkq_g-gfA_idl_pbPy';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
const esc=s=>(s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CURSYM={MDL:'MDL',EUR:'€',RON:'lei',USD:'$',UAH:'₴',GBP:'£'}; let CUR='MDL';
const money=n=>new Intl.NumberFormat('ro-RO',{minimumFractionDigits:2,maximumFractionDigits:2}).format(+n||0)+' '+(CURSYM[CUR]||CUR);
const num2=n=>{ const r=Math.round((+n||0)*100)/100; return r%1===0?r:r.toFixed(2); };
/* Semantica pret/TVA — identica cu `app.html` si `deviz.html` (KB#39, D34).
   `invoice_items.unit_price` este INTOTDEAUNA net. Rotunjirea la 2 zecimale se
   face doar la afisare si la valorile scrise inapoi intr-un camp; totalurile
   raman rotunjirea sumei, nu suma rotunjirilor. */
const VATX = {
  r2(n){ return Math.round((+n||0)*100)/100; },
  gross(net, rate){ return (+net||0)*(1+(+rate||0)/100); },
  net(gross, rate){ const r=+rate||0; return r ? (+gross||0)/(1+r/100) : (+gross||0); },
  vat(net, rate){ return (+net||0)*(+rate||0)/100; }
};
// Contractul de pret v2 (D35). Clientul DECLARA explicit ce semantica au
// preturile pe care le trimite, ca serverul sa nu mai ghiceasca din setarea
// firmei. In v356+ campul cu `id="f-<key>"` este INTOTDEAUNA cel fara TVA
// (D34), deci valoarea trimisa e mereu NETA, indiferent de `prices_incl_vat`.
// Se trimite in interiorul JSONB-ului, nu ca parametru nou: semnatura RPC
// ramane neschimbata, deci un tab vechi ramas pe cache nu se rupe.
const PRICE_CONTRACT = { price_contract_version:'2', price_input_mode:'net' };
function withPriceContract(o){ return Object.assign({}, o||{}, PRICE_CONTRACT); }
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2200); }
function param(k){ return new URLSearchParams(location.search).get(k); }
function goBack(){ if(history.length>1) history.back(); else location.href='app.html'; }
function base(){ return location.href.split('?')[0].split('#')[0].replace(/\/[^/]*$/,'/'); }

const STATUS={draft:'Ciornă',sent:'Trimisă',paid:'Plătită',overdue:'Restantă',cancelled:'Anulată'};
/* ►► FIN2/D64 — lifecycle-ul documentului și starea de plată sunt DOUĂ semnale.
   `paid`/`overdue` rămân în hartă doar ca să putem CITI cele 5 facturi istorice;
   ca lifecycle ele se prezintă drept „Trimisă", iar plata se derivă din registru. */
const LIFE={draft:'Ciornă',sent:'Trimisă',cancelled:'Anulată'};
/* `T` e LOCAL în fiecare funcție a acestui fișier, nu global — helperii de stare
   rulează la nivel de modul, deci au nevoie de propriul traducător. */
function TS(x){ return (window.C373t? window.C373t(x) : x); }
const ST_ICON={draft:'✎',sent:'➤',cancelled:'⊘'};
function lifeKey(){ const k=S.inv.status||'draft'; return (k==='paid'||k==='overdue')?'sent':k; }
function lifePillHtml(){ const k=lifeKey(); return '<span class="pill '+k+'">'+(ST_ICON[k]||'')+' '+TS(LIFE[k]||k)+'</span>'; }
/* Starea de plată vine din instantaneul fiscal (invoice_snapshot → payment/outstanding),
   adică din registrul canonic — niciodată dintr-un câmp editabil. */
function payPillHtml(){
  const sn=S._snap; if(!sn||!sn.payment) return '';
  const paid=+(sn.payment.paid_to_date||0), tot=+((sn.stored&&sn.stored.total)||S.inv.total||0);
  const st = paid<=0.005 ? ['○','Neachitată','draft'] : (paid+0.005>=tot ? ['●','Achitată','paid'] : ['◐','Parțial achitată','sent']);
  let h='<span class="pill '+st[2]+'" style="margin-left:.35rem">'+st[0]+' '+TS(st[1])+'</span>';
  const out=Math.round((tot-paid)*100)/100;
  if(S.inv.due_date && out>0.005 && lifeKey()!=='cancelled'
     && String(S.inv.due_date).slice(0,10) < (typeof coToday==='function'?coToday():new Date().toISOString().slice(0,10))){
    h+='<span class="pill overdue" style="margin-left:.35rem">⚠ '+TS('Restantă')+'</span>';
  }
  return h;
}
const ST_ERR={ DOC_CONFLICT:'Documentul a fost modificat în altă parte. Reîncarcă-l.',
  STATUS_FORBIDDEN:'Nu ai dreptul să schimbi starea acestui document.',
  STATUS_DERIVED:'Starea de plată se derivă din încasări, nu se alege manual.',
  INVOICE_HAS_PAYMENTS:'Factura are încasări. Stornează întâi plata.',
  PAYMENT_CONTRACT_REQUIRED:'Factura e achitată; starea se schimbă prin stornarea încasării.',
  STATUS_INVALID:'Stare necunoscută.', DOC_NOT_FOUND:'Documentul nu a fost găsit.' };
function stActions(){
  if(!S.canEdit || !S.id) return '';
  const k=lifeKey(); if(S.inv.status==='paid') return '';
  const btn=(a,l,x)=>'<button class="btn" style="padding:.2rem .55rem;font-size:.75rem;margin-left:.35rem'+(x||'')+'" onclick="stSet(\''+a+'\')">'+TS(l)+'</button>';
  if(k==='draft') return btn('sent','Marchează ca trimisă');
  if(k==='sent')  return btn('cancelled','Anulează factura',';color:#dc2626');
  return '';
}
/* Starea de plată se citește o dată la încărcare și după fiecare încasare.
   Eșecul e NEBLOCANT: fără instantaneu se afișează doar lifecycle-ul, nu o
   presupunere despre bani. */
async function refreshSnap(){
  if(!S.id) { S._snap=null; return; }
  try{ const r=await sb.rpc('invoice_snapshot',{p_invoice:S.id});
       S._snap = r.error ? null : (r.data||null); }
  catch(e){ S._snap=null; }
  const el=$('hd-status'); if(el) el.innerHTML=lifePillHtml()+payPillHtml()+stActions();
}
async function stSet(st){
  if(!S.id){ toast('Salvează documentul întâi.'); return; }
  const {data,error}=await sb.rpc('invoice_set_status',
    {p_invoice_id:S.id, p_status:st, p_expected_updated_at:S._updatedAt||null});
  if(error){ const c=String(error.message||'').split(':')[0].trim();
    toast('⛔ '+(ST_ERR[c]||error.message)); return; }
  S.inv.status=data.status; S._updatedAt=data.updated_at;
  toast('✅ '+TS('Stare actualizată')); render(); refreshSnap();
}
const FIN=['owner','admin','manager','accountant'];
let S={ id:null, role:null, canEdit:false, firm:{}, tenant:null,
        inv:{status:'draft',number:'',client_id:'',title:'',issue_date:new Date().toISOString().slice(0,10),due_date:'',disc_mode:'none',disc_value:0,vat_mode:'line',vat_value:0,materials_mode:'detailed',skonto_off:false,skonto_pct:null,inv_type:'normal',contract_total:null,retention_pct:null,site_id:null,bank_choice:'',amount_paid:null},
        lines:[], groups:[], clients:[], catalog:[], lineThumbs:{} };
function gid(){ return 'g'+Date.now().toString(36)+Math.floor(Math.random()*1000); }
function coDateFmt(){ return (S.firm&&S.firm.automations&&S.firm.automations.date_fmt)||'DD.MM.YYYY'; }
function fmtDate(iso){ if(!iso) return ''; const s=String(iso).slice(0,10); const p=s.split('-'); if(p.length<3) return s; const y=p[0],m=p[1],d=p[2]; const f=coDateFmt(); return f==='YYYY-MM-DD'?s:f==='DD/MM/YYYY'?(d+'/'+m+'/'+y):f==='MM/DD/YYYY'?(m+'/'+d+'/'+y):(d+'.'+m+'.'+y); }
/* ── schiță auto-salvată (factură nouă) ── */
let _dzT=null;
function dkey(){ return 'c373_draft_factura_'+(S.tenant||''); }
function getDraftDz(){ try{ const r=localStorage.getItem(dkey()); return r?JSON.parse(r):null; }catch(e){ return null; } }
function saveDraftDz(){ if(S.id) return; try{ const has=(S.lines||[]).some(l=>(l.name||'').trim()||(+l.unit_price>0)); if(!has){ localStorage.removeItem(dkey()); return; } localStorage.setItem(dkey(), JSON.stringify({t:Date.now(), inv:S.inv, lines:S.lines.map(l=>{ const o=Object.assign({},l); delete o._pxAnchor; return o; }), groups:S.groups})); }catch(e){} }
function clearDraftDz(){ try{ localStorage.removeItem(dkey()); }catch(e){} }
function scheduleDraft(){ if(S.id) return; clearTimeout(_dzT); _dzT=setTimeout(saveDraftDz,600); }

async function boot(){
  const { data:{ session } }=await sb.auth.getSession();
  if(!session){ $('root').innerHTML='<div class="center">🔒 Trebuie să fii autentificat.<br><br><a class="btn primary" href="app.html">Deschide aplicația</a></div>'; return; }
  const mem=await sb.from('memberships').select('tenant_id, role, tenants(name,idno,address,phone,vat_rate,currency,logo_url,automations,bank_accounts)').eq('active',true).limit(1).maybeSingle();
  S.role=mem.data?mem.data.role:null; S.tenant=mem.data?mem.data.tenant_id:null; S.firm=(mem.data&&mem.data.tenants)||{}; S.canEdit=FIN.includes(S.role); CUR=(S.firm.currency||'MDL').toUpperCase();
  if(!S.canEdit){ $('root').innerHTML='<div class="center">🔒 Doar proprietar/administrator/manager/contabil pot emite facturi.</div>'; return; }
  await loadCatalog();
  const id=param('id');
  if(id){ const _b=$('btn-save'); if(_b) _b.disabled=true; await loadInvoice(id); }
  else { S.inv.number=await genNumber(); S._autoNum=S.inv.number; if(param('client')) S.inv.client_id=param('client'); S.lines=[blankLine()];
    const d=new Date(); d.setDate(d.getDate()+14); S.inv.due_date=d.toISOString().slice(0,10);
    S.inv.vat_value=(S.firm.vat_rate!=null?S.firm.vat_rate:20); S.inv.vat_mode=(S.firm.vat_rate?'line':'none');
    if(param('estimate')) await fromEstimate(param('estimate'));
    else { const dr=getDraftDz(); if(dr && dr.lines && dr.lines.length){ if(dr.inv) S.inv=Object.assign(S.inv,dr.inv); S.lines=dr.lines; if(Array.isArray(dr.groups)) S.groups=dr.groups; reorderLinesBySection(); S._restored=true; } }
  }
  if(param('print')){ await pdf(true); return; }
  render();
  signLineThumbs();
  historyInit();
  document.addEventListener('input',scheduleDraft); document.addEventListener('change',scheduleDraft);
  if(S._restored) toast('↩️ Schiță nesalvată restaurată.');
}
async function signLineThumbs(){
  const paths=S.lines.filter(l=>l.photo_url && !S.lineThumbs[l.photo_url]).map(l=>l.photo_url);
  if(!paths.length){ return; }
  try{ const su=await sb.storage.from('docs').createSignedUrls(paths,3600); (su.data||[]).forEach((x,idx)=>{ if(x.signedUrl) S.lineThumbs[paths[idx]]=x.signedUrl; }); }catch(e){}
  renderLines();
}
async function genNumber(){ const yr=new Date().getFullYear(); const pref='FAC-'+yr+'-';
  // Următorul număr = MAX existent din anul curent + 1 (nu „count+1", care se dubla la ștergeri/goluri → eroare unique).
  try{ const { data }=await sb.from('invoices').select('number').like('number',pref+'%').limit(10000);
    let max=0; (data||[]).forEach(r=>{ const m=String(r.number||'').match(/(\d+)\s*$/); if(m){ const n=parseInt(m[1],10)||0; if(n>max) max=n; } });
    return pref+String(max+1).padStart(4,'0'); }catch(e){ return pref+Math.floor(Math.random()*9000+1000); } }
function blankLine(){ return { name:'', qty:1, unit:'buc', unit_price:0, vat_rate:(S.firm.vat_rate!=null?S.firm.vat_rate:20), disc:0, group:'', description:'', photo_url:null }; }

async function loadCatalog(){
  const [cl, svc, nrm, mat]=await Promise.all([
    sb.from('clients').select('id,name').order('name'),
    sb.from('services').select('id,name,unit,price,vat_rate,description,photo_url').eq('active',true),
    sb.from('norms').select('id,name,unit,unit_price'),
    sb.from('materials').select('id,name,unit,last_price,vat_rate,description,photo_url').eq('active',true)
  ]);
  S.clients=cl.data||[];
  S.catalog=[].concat(
    (svc.data||[]).map(x=>({src:'service',id:x.id,icon:'🧰',name:x.name,unit:x.unit||'buc',price:+x.price||0,vat:(x.vat_rate!=null?+x.vat_rate:20),desc:x.description||'',photo:x.photo_url||null})),
    (nrm.data||[]).map(x=>({icon:'📐',name:x.name,unit:x.unit||'m2',price:+x.unit_price||0,vat:20})),
    (mat.data||[]).map(x=>({src:'material',id:x.id,icon:'📦',name:x.name,unit:x.unit||'buc',price:+x.last_price||0,vat:(x.vat_rate!=null?+x.vat_rate:20),desc:x.description||'',photo:x.photo_url||null}))
  );
}
async function loadInvoice(id){
  const e=await sb.from('invoices').select('*').eq('id',id).single();
  if(e.error){ docLoadFailed('Factura nu a putut fi citită.', e.error.message); return; }
  S.id=id; S._updatedAt=e.data.updated_at; setTimeout(refreshSnap,0); S.inv={ status:e.data.status, number:e.data.number||'', client_id:e.data.client_id||'', title:e.data.title||'', site_id:e.data.site_id||null,
    issue_date:e.data.issue_date||new Date().toISOString().slice(0,10), due_date:e.data.due_date||'',
    disc_mode:e.data.disc_mode||'none', disc_value:+e.data.disc_value||0, vat_mode:e.data.vat_mode||'line', vat_value:+e.data.vat_value||0, materials_mode:e.data.materials_mode||'detailed', skonto_off:!!e.data.skonto_off, skonto_pct:(e.data.skonto_pct!=null?+e.data.skonto_pct:null), inv_type:e.data.inv_type||'normal', contract_total:(e.data.contract_total!=null?+e.data.contract_total:null), retention_pct:(e.data.retention_pct!=null?+e.data.retention_pct:null), bank_choice:e.data.bank_choice||'', amount_paid:(e.data.amount_paid!=null?+e.data.amount_paid:null), plan_url:e.data.plan_url||null };
  S.groups=Array.isArray(e.data.groups)?e.data.groups.map(g=>({id:g.id,name:g.name||'',vat:+g.vat||0,disc:+g.disc||0})):[];
  if(S.inv.inv_type!=='normal') loadAbschlaege();
  const it=await sb.from('invoice_items').select('*').eq('invoice_id',id);
  if(it.error){ docLoadFailed('Pozițiile facturii nu au putut fi citite.', it.error.message); return; }
  const mapped=((it.data||[]).sort((a,b)=>(a.position||0)-(b.position||0))).map(x=>({ name:x.name, qty:+x.qty, unit:x.unit, unit_price:+x.unit_price, vat_rate:+x.vat_rate, disc:+x.disc||0, group:x.group_id||'', kind:x.kind||'service', description:x.description||'', photo_url:x.photo_url||null }));

   NICIODATĂ modul documentului: TVA unificat 20% peste un grup la 8% dădea 8%. Cotele
   individuale NU se distrug — rămân în `l.vat_rate` și redevin efective când modul revine

function initLineSort(){

  const before=new Map((S.lines||[]).map(l=>[l, l.group||'']));

      /* ►► FIN-GROUP-PARITY1 — tipărim reducerea DOAR acolo unde motorul o APLICĂ. Pentru o

    } else { gl.forEach(l=>{ rows+=pdfRow(l,++_n); }); }
    const gt=groupTotals(g); rows+='<tr><td colspan="'+(colsN-2)+'" style="text-align:right;color:#6b7793;font-size:11px;padding-right:10px">'+T('Subtotal grup')+(g.disc?(' −'+num2(g.disc)+'%'):'')+(gt.vat>0.005?(' · '+T('TVA:')+' '+money(gt.vat)):'')+'</td><td class="r"><b>'+money(gt.total)+'</b></td><td></td></tr>';
  });
  const doc='<!doctype html><html lang="'+L+'"><head><meta charset="utf-8"><title>'+T('Factură')+' '+esc(S.inv.number||'')+'</title><style>'
    +'body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;color:#0f1c33;padding:32px;max-width:800px;margin:0 auto;font-size:13px}.hd{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #2f6bff;padding-bottom:16px;margin-bottom:20px}.ti{font-size:22px;font-weight:800;color:#2f6bff}.muted{color:#6b7793}.box{display:flex;gap:24px;margin:0 0 20px}.box>div{flex:1;background:#f4f6fb;border-radius:10px;padding:12px 14px}.box h4{font-size:11px;text-transform:uppercase;color:#6b7793;margin:0 0 6px}table{width:100%;border-collapse:collapse;margin-top:8px}th,td{padding:8px 10px;border-bottom:1px solid #e5e9f2;text-align:left}th{background:#0f1c33;color:#fff;font-size:11px;text-transform:uppercase}.r{text-align:right}.tot{margin-top:16px;margin-left:auto;width:280px}.tot div{display:flex;justify-content:space-between;padding:5px 0}.tot .g{font-size:17px;font-weight:800;border-top:2px solid #0f1c33;margin-top:6px;padding-top:8px}.ft{margin-top:30px;color:#6b7793;font-size:11px;border-top:1px solid #e5e9f2;padding-top:12px}@media print{.noprint{display:none}tr{page-break-inside:avoid}}'
    +'</style></head><body><div class="hd"><div>'+logo+'<div style="font-size:18px;font-weight:800">'+esc(brand||f.name||'Firma')+'</div>'+(brand?'<div class="muted" style="font-size:11px">'+T('Marca comercială a')+' '+esc(f.name||'')+'</div>':'')+'<div class="muted">'+(f.idno?esc(idLabel)+': '+esc(f.idno)+'<br>':'')+(function(){var au=f.automations||{};var a=[f.address,[au.zip,au.city].filter(Boolean).join(' ')].filter(Boolean).join(', ');return a?esc(a)+'<br>':'';})()+(f.phone?T('Tel:')+' '+esc(f.phone):'')+'</div></div>'
    +'<div style="text-align:right"><div class="ti">'+(S.inv.inv_type==='abschlag'?'ABSCHLAGSRECHNUNG':S.inv.inv_type==='schluss'?'SCHLUSSRECHNUNG':T('FACTURĂ FISCALĂ'))+'</div><div style="font-weight:700;font-size:15px">'+T('Nr.')+' '+esc(S.inv.number||'—')+'</div><div class="muted">'+T('Emisă:')+' '+esc(fmtDate(S.inv.issue_date))+(S.inv.due_date?'<br>'+T('Scadență:')+' '+esc(fmtDate(S.inv.due_date)):'')+'</div></div></div>'
    /* ►► HOTFIX-FIN-TITLE — titlul introdus de utilizator (`S.inv.title`) se salva, se recitea și
       apărea în listă, dar PDF-ul îl omitea: antetul arăta doar TIPUL documentului și numărul.
       Titlul e o informație distinctă de număr, deci primește propriul rând. `esc()` obligatoriu. */
    +(S.inv.title?'<div style="font-size:16px;font-weight:700;margin:0 0 14px;color:#0f1c33">'+esc(S.inv.title)+'</div>':'')
    +'<div class="box"><div><h4>'+T('Furnizor')+'</h4><b>'+esc(brand||f.name||'')+'</b>'+(brand?'<div style="font-size:10px;color:#6b7793">'+T('Marca comercială a')+' '+esc(f.name||'')+'</div>':'')+'</div><div><h4>'+T('Client')+'</h4><b>'+esc(cl.name||'—')+'</b></div></div>'
    +'<table><thead><tr><th>#</th><th>'+T('Denumire')+'</th><th class="r">'+T('Cant.')+'</th><th>'+T('UM')+'</th><th class="r">'+T('Preț fără TVA')+'</th>'+(showDiscCol?'<th class="r">'+T('Reducere')+'</th>':'')+(showVatCol?'<th class="r">'+T('TVA')+'</th>':'')+(showVatCol?'<th class="r">'+T('Preț cu TVA')+'</th>':'')+'<th class="r">'+(anyVat?T('Total cu TVA'):T('Total'))+'</th><th style="width:108px;text-align:center">'+T('Foto')+'</th></tr></thead><tbody>'+(rows||'<tr><td colspan="'+colsN+'" style="text-align:center;color:#888;padding:18px">'+T('Fără linii.')+'</td></tr>')+'</tbody></table>'
    +'<div class="tot"><div><span>'+T('Subtotal:')+'</span><b>'+money(t.gross)+'</b></div>'
      +(t.disc>0.005?'<div><span>'+T('Reducere:')+'</span><b>−'+money(t.disc)+'</b></div>':'')
      +'<div><span>'+T('TVA:')+(vmode==='total'&&(+S.inv.vat_value)?(' '+num2(S.inv.vat_value)+'%'):'')+'</span><b>'+money(t.vat)+'</b></div>'
      +'<div class="g"><span>'+T('TOTAL:')+'</span><span>'+money(t.total)+'</span></div>'
      +(de?(((S.inv.inv_type==='schluss')?(S._absch||[]).map(function(x){return '<div><span>− '+T('Avans')+' '+esc(x.number||'')+'</span><b>−'+money(x.total)+'</b></div>';}).join(''):'')+(de.ret>0?'<div><span>− '+T('Reținere garanție')+' '+num2(S.inv.retention_pct)+'%</span><b>−'+money(de.ret)+'</b></div>':'')+'<div class="g"><span>'+(S.inv.inv_type==='schluss'?'Restbetrag / '+T('De plată acum'):T('De plată acum'))+':</span><span>'+money(de.payable)+'</span></div>'):'')
      +(function(){ var paid=+S.inv.amount_paid||0; if(!(paid>0.005)) return ''; var baseDue=de?de.payable:t.total; var rest=Math.round((baseDue-paid)*100)/100; return '<div><span>'+T('Achitat / avans încasat:')+'</span><b>−'+money(paid)+'</b></div><div class="g"><span>'+(rest>0.005?T('Rest de plată:'):(rest<-0.005?T('De rambursat:'):T('Achitat integral')))+'</span><span>'+money(Math.abs(rest)<0.005?0:rest)+'</span></div>'; })()
      +'</div>'
    +(()=>{ const pn=prepayNote(t.total); return (pn&&S.inv.status!=='paid')?'<div style="margin-top:12px;margin-left:auto;width:380px;padding:11px 13px;background:#ecfdf5;border:1px solid #a7f3d0;border-radius:9px;font-size:12px;color:#065f46;line-height:1.5">💸 '+T('La achitarea 100% în avans beneficiați de o reducere suplimentară de')+' <b>'+num2(pn.pct)+'%</b> '+T('din suma finală')+' ('+T('economisiți')+' <b>'+money(pn.save)+'</b>). '+T('Total cu avans:')+' <b>'+money(pn.after)+'</b></div>':''; })()
    +(function(){ var bt=bankTextForPdf(); return bt?'<div style="margin-top:14px;font-size:12px;color:#0f1c33"><b>'+T('Date pentru plată:')+'</b><br>'+bt+'</div>':''; })()
    +(legalNote?'<div class="muted" style="margin-top:10px;font-size:11px">'+esc(legalNote)+'</div>':'')
    +companyFooterHtml()
    +'<div class="ft">'+T('Factură generată cu Cod373.')+' '+(S.inv.status==='paid'?T('ACHITATĂ.'):T('Vă rugăm achitați până la scadență.'))+'</div>'
    +'<div class="noprint" style="margin-top:20px;text-align:center"><button onclick="window.print()" style="padding:10px 20px;font-size:14px;cursor:pointer">🖨 '+T('Tipărește / Salvează PDF')+'</button></div>'
    +'<div id="lb" class="noprint" onclick="this.style.display=\'none\'" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);align-items:center;justify-content:center;z-index:9999;cursor:zoom-out"><img id="lbimg" style="max-width:92%;max-height:92%;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.5)"></div>'

  if(inPlace){ document.open(); document.write(doc); document.close(); return; }

/* ════ ISTORIC LOCAL — „↶ Anulează" / „↷ Refă" ════════════════════════════════
   Acoperă DOAR modificările locale nesalvate din editor. Nu atinge niciodată
   metadatele serverului (id/tenant_id/updated_at/e-Factura/estimate_id) și nu
   face niciun apel la Supabase. După o salvare reușită (RPC 0117) istoricul
   repornește din starea canonică ⇒ nu se poate anula peste ultima salvare. */
const HIST_MAX=50, HIST_WAIT=500;
/* Whitelist explicit: doar câmpurile pe care editorul le trimite legitim către
   save_invoice + starea client de care depinde salvarea (markerul auto/manual al
   numărului). NU intră: efactura_status/efactura_id/efactura_sent_at și legătura
   estimate_id (S._fromEstimate) — sunt protejate de server (0117). */
const HIST_DOC=['status','number','client_id','site_id','title','issue_date','due_date','disc_mode','disc_value','vat_mode','vat_value','materials_mode','skonto_off','skonto_pct','inv_type','contract_total','retention_pct','bank_choice','amount_paid','plan_url'];
const HIST_LINE=['name','qty','unit','unit_price','vat_rate','disc','group','kind','description','photo_url','cat_id','_catName','_catPrice','_catUnit','_catDesc','_catPhoto'];
let HIST={ cur:null, past:[], future:[], applying:false, tmr:null, key:null };
function captureHistoryState(){
  const d={}; HIST_DOC.forEach(k=>{ d[k]=(S.inv[k]===undefined?null:S.inv[k]); });
  return JSON.stringify({ doc:d, autoNum:(S._autoNum===undefined?null:S._autoNum),
    lines:(S.lines||[]).map(l=>{ const o={}; HIST_LINE.forEach(k=>{ o[k]=(l[k]===undefined?null:l[k]); }); return o; }),
    groups:(S.groups||[]).map(g=>({id:g.id,name:g.name||'',vat:+g.vat||0,disc:+g.disc||0})) });
}
function applyHistoryState(snap){
  const st=JSON.parse(snap); HIST.applying=true;
  try{
    HIST_DOC.forEach(k=>{ S.inv[k]=st.doc[k]; });          // doar cheile din whitelist
    if(st.autoNum!==null) S._autoNum=st.autoNum;
    S.lines=(st.lines||[]).map(l=>Object.assign({},l));
    S.groups=(st.groups||[]).map(g=>Object.assign({},g));
    render();                                              // randare + totaluri prin funcțiile existente
    saveDraftDz();                                          // schița locală rămâne sincronă (no-op dacă S.id)
  } finally { HIST.applying=false; }
}
function historyButtons(){ const u=$('btn-undo'), r=$('btn-redo'); if(u) u.disabled=!HIST.past.length; if(r) r.disabled=!HIST.future.length; }
function historyCommit(){
  if(HIST.applying) return;
  clearTimeout(HIST.tmr); HIST.tmr=null; HIST.key=null;
  const snap=captureHistoryState();
  if(HIST.cur===null){ HIST.cur=snap; historyButtons(); return; }
  if(snap===HIST.cur) return;                              // stări identice nu se salvează
  HIST.past.push(HIST.cur); if(HIST.past.length>HIST_MAX) HIST.past.shift();
  HIST.cur=snap; HIST.future.length=0; historyButtons();
}
function historyFlush(){ if(HIST.tmr) historyCommit(); }   // finalizează tastarea în așteptare
function historyTouch(el){                                 // tastare: un pas per control, nu per caracter
  if(HIST.applying) return;
  if(HIST.key && HIST.key!==el) historyCommit();           // alt control ⇒ pas logic nou
  HIST.key=el; clearTimeout(HIST.tmr); HIST.tmr=setTimeout(historyCommit,HIST_WAIT);
}
function historyUndo(){ historyFlush(); if(!HIST.past.length) return; HIST.future.push(HIST.cur); HIST.cur=HIST.past.pop(); applyHistoryState(HIST.cur); historyButtons(); }
function historyRedo(){ historyFlush(); if(!HIST.future.length) return; HIST.past.push(HIST.cur); HIST.cur=HIST.future.pop(); applyHistoryState(HIST.cur); historyButtons(); }
function historyReset(){ clearTimeout(HIST.tmr); HIST.tmr=null; HIST.key=null; HIST.past=[]; HIST.future=[]; HIST.cur=captureHistoryState(); historyButtons(); }
function histSkip(el){ return !!(el && el.closest && el.closest('#modal-mount')); } // în modale comite butonul lor de salvare
function historyInit(){
  document.addEventListener('input', e=>{ if(!histSkip(e.target)) historyTouch(e.target); });   // bubble: handlerul inline a mutat deja S
  document.addEventListener('change', e=>{ if(!histSkip(e.target)) historyCommit(); });
  document.addEventListener('blur', e=>{ if(!histSkip(e.target)) historyFlush(); }, true);      // blur nu bulează
  document.addEventListener('keydown', e=>{
    if(!(e.ctrlKey||e.metaKey) || e.altKey) return;
    if(histSkip(e.target)) return;                          // în modale rămâne undo-ul nativ al câmpului
    const k=(e.key||'').toLowerCase();
    if(k==='z' && !e.shiftKey){ if(!HIST.past.length && !HIST.tmr) return; e.preventDefault(); historyUndo(); }
    else if((k==='z' && e.shiftKey) || k==='y'){ if(!HIST.future.length) return; e.preventDefault(); historyRedo(); }
  });
  historyReset();
}
/* Acțiuni structurale (onclick / drag / modale) — un pas logic fiecare.
   Câmpurile cu oninput/onchange NU se ambalează: sunt acoperite de listenerele de mai sus. */
['addLine','addLineG','delLine','newGroup','groupSelection','addSelToGroup','delGroup','catalogNew','pickCatalog','lineRemovePhoto','skontoToggle','rebuildLinesFromDOM','rebuildGroupsFromDOM','saveLineDetails','cfLinkLine','lcSave','attachPlan','saveNewClient'].forEach(function(n){
  const f=window[n]; if(typeof f!=='function') return;
  window[n]=function(){ historyFlush(); const r=f.apply(this,arguments); if(r&&typeof r.then==='function') r.then(historyCommit,historyCommit); else historyCommit(); return r; };
});
boot();
