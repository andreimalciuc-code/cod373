<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cod373 — Factură</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<style>
  :root{ --ink:#0f1c33; --muted:#6b7793; --line:#e6eaf2; --primary:#2f6bff; --bg:#f4f6fb; --red:#dc2626; --green:#16a34a; }
  *{ box-sizing:border-box; } body{ margin:0; font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; color:var(--ink); background:var(--bg); font-size:14px; }
  header{ background:#fff; border-bottom:1px solid var(--line); padding:.7rem 1rem; display:flex; align-items:center; gap:.8rem; flex-wrap:wrap; position:sticky; top:0; z-index:30; }
  header h1{ font-size:1.05rem; margin:0; } .spacer{ flex:1; }
  .pill{ font-size:.72rem; padding:.18rem .6rem; border-radius:999px; font-weight:700; }
  .pill.draft{ background:#eef2ff; color:#3730a3; } .pill.sent{ background:#fef9c3; color:#854d0e; } .pill.paid{ background:#dcfce7; color:#15803d; } .pill.overdue{ background:#fee2e2; color:#b91c1c; } .pill.cancelled{ background:#f1f5f9; color:#64748b; }
  .btn{ border:1px solid var(--line); background:#fff; border-radius:9px; padding:.5rem .8rem; font-size:.85rem; cursor:pointer; color:var(--ink); white-space:nowrap; }
  .btn:hover{ background:#f1f5f9; } .btn.primary{ background:var(--primary); color:#fff; border-color:var(--primary); } .btn.green{ background:var(--green); color:#fff; border-color:var(--green); }
  .wrap{ max-width:1240px; margin:0 auto; padding:1.1rem; display:grid; grid-template-columns:1fr 320px; gap:1.1rem; align-items:start; }
  @media(max-width:880px){ .wrap{ grid-template-columns:1fr; } }
  .panel{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:1.1rem; margin-bottom:1.1rem; }
  .panel h3{ margin:0 0 .8rem; font-size:.95rem; }
  .right{ position:sticky; top:72px; }
  .field{ margin-bottom:.7rem; } label{ display:block; font-size:.78rem; font-weight:600; margin-bottom:.25rem; color:#46506a; }
  input,select,textarea{ width:100%; padding:.5rem .65rem; border:1px solid var(--line); border-radius:9px; font-size:.88rem; font-family:inherit; outline:none; background:#fff; }
  input:focus,select:focus,textarea:focus{ border-color:var(--primary); }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:.6rem; }
  .lines{ width:100%; border-collapse:collapse; }
  .lines th{ text-align:left; font-size:.7rem; text-transform:uppercase; color:var(--muted); padding:.3rem .35rem; border-bottom:1px solid var(--line); }
  .lines td{ padding:.25rem .25rem; vertical-align:top; border-bottom:1px solid #f1f4fa; }
  .lines td input{ padding:.45rem .5rem; } .grip{ cursor:grab; color:#c2cbdb; padding:.4rem .1rem; }
  .ta-wrap{ position:relative; }
  .dd{ position:absolute; z-index:40; left:0; right:0; top:100%; background:#fff; border:1px solid var(--line); border-radius:10px; box-shadow:0 10px 30px rgba(15,28,51,.14); max-height:280px; overflow:auto; margin-top:2px; }
  .dd .it{ padding:.5rem .7rem; cursor:pointer; display:flex; gap:.5rem; align-items:center; font-size:.85rem; border-bottom:1px solid #f4f6fb; }
  .dd .it:hover{ background:#eff4ff; } .dd .it .nm{ flex:1; } .dd .it .pr{ color:var(--muted); font-size:.78rem; white-space:nowrap; } .dd .add{ color:var(--primary); font-weight:700; }
  .sub{ color:var(--muted); font-size:.8rem; }
  .totrow{ display:flex; justify-content:space-between; padding:.35rem 0; }
  .totrow.g{ font-size:1.15rem; font-weight:800; border-top:2px solid var(--ink); margin-top:.4rem; padding-top:.6rem; }
  .delx{ background:none; border:none; color:#c2452f; cursor:pointer; font-size:1.1rem; padding:.3rem; }
  .center{ text-align:center; padding:3rem 1rem; color:var(--muted); }
  .toast{ position:fixed; bottom:1rem; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:.6rem 1rem; border-radius:10px; font-size:.85rem; z-index:80; opacity:0; transition:.2s; } .toast.show{ opacity:1; }
  .ov{ position:fixed; inset:0; background:rgba(15,28,51,.5); display:flex; align-items:center; justify-content:center; z-index:90; padding:1rem; } .modal{ background:#fff; border-radius:14px; width:100%; max-width:420px; padding:1.1rem; } .modal h3{ margin:0 0 .8rem; }
  .addline{ background:none; border:1px dashed var(--line); color:var(--primary); border-radius:9px; padding:.5rem .8rem; cursor:pointer; font-size:.85rem; margin-top:.5rem; }
</style>
</head>
<body>
<header>
  <h1>🧾 Factură</h1>
  <span id="hd-num" class="sub"></span>
  <span id="hd-status"></span>
  <div class="spacer"></div>
  <button class="btn" onclick="goBack()">↩ Înapoi</button>
  <button class="btn" id="btn-pdf" onclick="pdf()">🖨 PDF</button>
  <button class="btn primary" id="btn-save" onclick="save()">💾 Salvează</button>
</header>
<div id="root"><div class="center">Se încarcă…</div></div>
<div id="toast" class="toast"></div>
<div id="modal-mount"></div>

<script>
const SUPABASE_URL='https://vzatmfhkwiojqkowtftg.supabase.co';
const SUPABASE_KEY='sb_publishable_wNj9S8eta39n1Gkq_g-gfA_idl_pbPy';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
const esc=s=>(s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CURSYM={MDL:'MDL',EUR:'€',RON:'lei',USD:'$',UAH:'₴',GBP:'£'}; let CUR='MDL';
const money=n=>new Intl.NumberFormat('ro-RO',{minimumFractionDigits:2,maximumFractionDigits:2}).format(+n||0)+' '+(CURSYM[CUR]||CUR);
const num2=n=>{ const r=Math.round((+n||0)*100)/100; return r%1===0?r:r.toFixed(2); };
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2200); }
function param(k){ return new URLSearchParams(location.search).get(k); }
function goBack(){ if(history.length>1) history.back(); else location.href='app.html'; }
function base(){ return location.href.split('?')[0].split('#')[0].replace(/\/[^/]*$/,'/'); }

const STATUS={draft:'Ciornă',sent:'Trimisă',paid:'Plătită',overdue:'Restantă',cancelled:'Anulată'};
const FIN=['owner','admin','manager','accountant'];
let S={ id:null, role:null, canEdit:false, firm:{}, tenant:null,
        inv:{status:'draft',number:'',client_id:'',issue_date:new Date().toISOString().slice(0,10),due_date:'',disc_mode:'none',disc_value:0,vat_mode:'line',vat_value:0},
        lines:[], clients:[], catalog:[], lineThumbs:{} };
/* ── schiță auto-salvată (factură nouă) ── */
let _dzT=null;
function dkey(){ return 'c373_draft_factura_'+(S.tenant||''); }
function getDraftDz(){ try{ const r=localStorage.getItem(dkey()); return r?JSON.parse(r):null; }catch(e){ return null; } }
function saveDraftDz(){ if(S.id) return; try{ const has=(S.lines||[]).some(l=>(l.name||'').trim()||(+l.unit_price>0)); if(!has){ localStorage.removeItem(dkey()); return; } localStorage.setItem(dkey(), JSON.stringify({t:Date.now(), inv:S.inv, lines:S.lines})); }catch(e){} }
function clearDraftDz(){ try{ localStorage.removeItem(dkey()); }catch(e){} }
function scheduleDraft(){ if(S.id) return; clearTimeout(_dzT); _dzT=setTimeout(saveDraftDz,600); }

async function boot(){
  const { data:{ session } }=await sb.auth.getSession();
  if(!session){ $('root').innerHTML='<div class="center">🔒 Trebuie să fii autentificat.<br><br><a class="btn primary" href="app.html">Deschide aplicația</a></div>'; return; }
  const mem=await sb.from('memberships').select('tenant_id, role, tenants(name,idno,address,phone,vat_rate,currency,logo_url,automations)').eq('active',true).limit(1).maybeSingle();
  S.role=mem.data?mem.data.role:null; S.tenant=mem.data?mem.data.tenant_id:null; S.firm=(mem.data&&mem.data.tenants)||{}; S.canEdit=FIN.includes(S.role); CUR=(S.firm.currency||'MDL').toUpperCase();
  if(!S.canEdit){ $('root').innerHTML='<div class="center">🔒 Doar proprietar/administrator/manager/contabil pot emite facturi.</div>'; return; }
  await loadCatalog();
  const id=param('id');
  if(id){ await loadInvoice(id); }
  else { S.inv.number=await genNumber(); if(param('client')) S.inv.client_id=param('client'); S.lines=[blankLine()];
    const d=new Date(); d.setDate(d.getDate()+14); S.inv.due_date=d.toISOString().slice(0,10);
    S.inv.vat_value=(S.firm.vat_rate!=null?S.firm.vat_rate:20); S.inv.vat_mode=(S.firm.vat_rate?'line':'none');
    if(param('estimate')) await fromEstimate(param('estimate'));
    else { const dr=getDraftDz(); if(dr && dr.lines && dr.lines.length){ if(dr.inv) S.inv=Object.assign(S.inv,dr.inv); S.lines=dr.lines; S._restored=true; } }
  }
  if(param('print')){ await pdf(true); return; }
  render();
  signLineThumbs();
  document.addEventListener('input',scheduleDraft); document.addEventListener('change',scheduleDraft);
  if(S._restored) toast('↩️ Schiță nesalvată restaurată.');
}
async function signLineThumbs(){
  const paths=S.lines.filter(l=>l.photo_url && !S.lineThumbs[l.photo_url]).map(l=>l.photo_url);
  if(!paths.length){ return; }
  try{ const su=await sb.storage.from('docs').createSignedUrls(paths,3600); (su.data||[]).forEach((x,idx)=>{ if(x.signedUrl) S.lineThumbs[paths[idx]]=x.signedUrl; }); }catch(e){}
  renderLines();
}
async function genNumber(){ try{ const { count }=await sb.from('invoices').select('id',{count:'exact',head:true}); return 'FAC-'+new Date().getFullYear()+'-'+String((count||0)+1).padStart(4,'0'); }catch(e){ return 'FAC-'+new Date().getFullYear()+'-'+Math.floor(Math.random()*900+100); } }
function blankLine(){ return { name:'', qty:1, unit:'buc', unit_price:0, vat_rate:(S.firm.vat_rate!=null?S.firm.vat_rate:20), disc:0, description:'', photo_url:null }; }

async function loadCatalog(){
  const [cl, svc, nrm, mat]=await Promise.all([
    sb.from('clients').select('id,name').order('name'),
    sb.from('services').select('id,name,unit,price,vat_rate').eq('active',true),
    sb.from('norms').select('id,name,unit,unit_price'),
    sb.from('materials').select('id,name,unit,last_price,vat_rate').eq('active',true)
  ]);
  S.clients=cl.data||[];
  S.catalog=[].concat(
    (svc.data||[]).map(x=>({icon:'🧰',name:x.name,unit:x.unit||'buc',price:+x.price||0,vat:+x.vat_rate||20})),
    (nrm.data||[]).map(x=>({icon:'📐',name:x.name,unit:x.unit||'m2',price:+x.unit_price||0,vat:20})),
    (mat.data||[]).map(x=>({icon:'📦',name:x.name,unit:x.unit||'buc',price:+x.last_price||0,vat:+x.vat_rate||20}))
  );
}
async function loadInvoice(id){
  const e=await sb.from('invoices').select('*').eq('id',id).single();
  if(e.error){ toast('Eroare: '+e.error.message); return; }
  S.id=id; S.inv={ status:e.data.status, number:e.data.number||'', client_id:e.data.client_id||'', site_id:e.data.site_id||null,
    issue_date:e.data.issue_date||new Date().toISOString().slice(0,10), due_date:e.data.due_date||'',
    disc_mode:e.data.disc_mode||'none', disc_value:+e.data.disc_value||0, vat_mode:e.data.vat_mode||'line', vat_value:+e.data.vat_value||0 };
  const it=await sb.from('invoice_items').select('*').eq('invoice_id',id);
  S.lines=((it.data||[]).sort((a,b)=>(a.position||0)-(b.position||0))).map(x=>({ name:x.name, qty:+x.qty, unit:x.unit, unit_price:+x.unit_price, vat_rate:+x.vat_rate, disc:+x.disc||0, description:x.description||'', photo_url:x.photo_url||null }));
  if(!S.lines.length) S.lines=[blankLine()];
}
async function fromEstimate(eid){
  const e=await sb.from('estimates').select('client_id,disc_mode,disc_value,vat_mode,vat_value').eq('id',eid).single();
  if(e.data&&e.data.client_id) S.inv.client_id=e.data.client_id;
  if(e.data){ S.inv.disc_mode=e.data.disc_mode||'none'; S.inv.disc_value=+e.data.disc_value||0; S.inv.vat_mode=e.data.vat_mode||S.inv.vat_mode; S.inv.vat_value=+e.data.vat_value||S.inv.vat_value; }
  const it=await sb.from('estimate_items').select('*').eq('estimate_id',eid);
  const items=(it.data||[]).sort((a,b)=>(a.position||0)-(b.position||0));
  if(items.length) S.lines=items.map(x=>({ name:x.name, qty:+x.qty, unit:x.unit, unit_price:+x.unit_price, vat_rate:+x.vat_rate, disc:+x.disc||0, description:x.description||'', photo_url:x.photo_url||null }));
  S._fromEstimate=eid;
}

function lineNet(l){ const g=(+l.qty||0)*(+l.unit_price||0); return (S.inv.disc_mode==='line')? g*(1-(+l.disc||0)/100) : g; }
function totals(){
  const dm=S.inv.disc_mode||'none', vm=S.inv.vat_mode||'none';
  let gross=0, sumNet=0;
  S.lines.forEach(l=>{ const g=(+l.qty||0)*(+l.unit_price||0); gross+=g; sumNet+=lineNet(l); });
  const factor=(dm==='total')? (1-(+S.inv.disc_value||0)/100) : 1;
  const base=sumNet*factor; const disc=gross-base; let vat=0;
  if(vm==='line') S.lines.forEach(l=>{ vat+=lineNet(l)*factor*(+l.vat_rate||0)/100; });
  else if(vm==='total') vat=base*(+S.inv.vat_value||0)/100;
  return { gross:gross, sub:base, disc:disc, vat:vat, total:base+vat };
}
function prepayNote(total){
  const au=(S.firm&&S.firm.automations)||{};
  if(au.prepay_show===false) return null;
  const pct=(au.prepay_pct!=null?+au.prepay_pct:3); if(!(pct>0)||!(total>0)) return null;
  const save=Math.round(total*pct/100*100)/100;
  return { pct:pct, save:save, after:Math.round((total-save)*100)/100 };
}

function render(){
  $('hd-num').textContent=S.inv.number||'';
  $('hd-status').innerHTML='<span class="pill '+(S.inv.status||'draft')+'">'+(STATUS[S.inv.status]||'')+'</span>';
  const clientOpts='<option value="">— alege client —</option>'+S.clients.map(c=>'<option value="'+c.id+'" '+(S.inv.client_id===c.id?'selected':'')+'>'+esc(c.name)+'</option>').join('');
  $('root').innerHTML=(S._restored?'<div style="max-width:1240px;margin:0 auto;padding:.5rem 1.1rem 0"><div style="background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:9px;padding:.5rem .8rem;font-size:.84rem;display:flex;justify-content:space-between;align-items:center;gap:.5rem"><span>↩️ Schiță nesalvată restaurată.</span><a onclick="clearDraftDz();location.href=\'factura.html\'" style="cursor:pointer;text-decoration:underline">Începe gol</a></div></div>':'')+'<div class="wrap"><div class="left">'
    +'<div class="panel"><h3>Detalii factură</h3>'
      +'<div class="field"><label>Client</label><div style="display:flex;gap:.4rem"><select id="f-client" style="flex:1" onchange="S.inv.client_id=this.value">'+clientOpts+'</select><button class="btn" onclick="newClient()">＋ nou</button></div></div>'
      +'<div class="row2"><div class="field"><label>Număr factură *</label><input id="f-num" value="'+esc(S.inv.number)+'" oninput="S.inv.number=this.value"/></div>'
      +'<div class="field"><label>Stare</label><select id="f-status" onchange="S.inv.status=this.value;render()">'+Object.keys(STATUS).map(k=>'<option value="'+k+'" '+(S.inv.status===k?'selected':'')+'>'+STATUS[k]+'</option>').join('')+'</select></div></div>'
      +'<div class="row2"><div class="field"><label>Data emiterii</label><input type="date" id="f-issue" value="'+esc(S.inv.issue_date||'')+'" oninput="S.inv.issue_date=this.value"/></div>'
      +'<div class="field"><label>Scadență</label><input type="date" id="f-due" value="'+esc(S.inv.due_date||'')+'" oninput="S.inv.due_date=this.value"/></div></div>'
    +'</div>'
    +'<div class="panel"><h3>Linii factură <span class="sub" style="font-weight:400">— tastează ca să cauți (sau „＋ Adaugă nou" dacă lipsește) · apasă 📝 pe o linie pentru descriere și poză</span></h3>'
      +'<div id="lines-wrap"></div>'
      +'<button class="addline" onclick="addLine()">＋ adaugă linie</button>'
      +'<button class="addline" onclick="catalogNew()" style="margin-left:.4rem">📦 material/serviciu nou în catalog</button>'
      +optBar()
    +'</div></div>'
    +'<div class="right"><div class="panel"><h3>Sumar</h3><div id="sum"></div>'
        +'<button class="btn primary" style="width:100%;margin-top:.8rem" onclick="save()">💾 Salvează factura</button>'
        +'<button class="btn" style="width:100%;margin-top:.5rem" onclick="save(true)">🖨 Salvează & PDF</button>'
        +(S.inv.status!=='paid'?'<button class="btn green" style="width:100%;margin-top:.5rem" onclick="markPaid()">💵 Marchează plătită</button>':'<div class="sub" style="margin-top:.6rem;text-align:center">✅ Factură încasată</div>')
      +'</div>'
      +'<div class="panel"><h3>e-Factura (SFS)</h3><div class="sub">Poți genera XML-ul pentru SFS din lista de Facturi (butonul 🏛️). Integrarea completă cu SFS se activează la cerere.</div></div>'
    +'</div></div>';
  renderLines(); renderSummary();
}
function optBar(){
  const dm=S.inv.disc_mode||'none', vm=S.inv.vat_mode||'none';
  const opt=(cur,val,lab)=>'<option value="'+val+'" '+(cur===val?'selected':'')+'>'+lab+'</option>';
  return '<div style="display:flex;gap:1.2rem;flex-wrap:wrap;align-items:center;margin-top:.8rem;padding-top:.7rem;border-top:1px dashed var(--line);font-size:.82rem">'
    +'<label style="display:flex;align-items:center;gap:.4rem;font-weight:600;color:#46506a">Reducere: <select onchange="setDiscMode(this.value)" style="width:auto">'+opt(dm,'none','Fără')+opt(dm,'line','Pe poziție')+opt(dm,'total','La final')+'</select></label>'
    +(dm==='total'?'<label style="display:flex;align-items:center;gap:.3rem"><input type="number" step="any" value="'+esc(S.inv.disc_value||0)+'" oninput="setDiscVal(this.value)" style="width:78px"/> %</label>':'')
    +'<label style="display:flex;align-items:center;gap:.4rem;font-weight:600;color:#46506a">TVA: <select onchange="setVatMode(this.value)" style="width:auto">'+opt(vm,'none','Fără')+opt(vm,'line','Pe poziție')+opt(vm,'total','Unificat')+'</select></label>'
    +(vm==='total'?'<label style="display:flex;align-items:center;gap:.3rem"><input type="number" step="any" value="'+esc(S.inv.vat_value||0)+'" oninput="setVatVal(this.value)" style="width:78px"/> %</label>':'')
    +'</div>';
}
function setDiscMode(v){ S.inv.disc_mode=v; render(); }
function setVatMode(v){ S.inv.vat_mode=v; render(); }
function setDiscVal(v){ S.inv.disc_value=+v||0; renderSummary(); }
function setVatVal(v){ S.inv.vat_value=+v||0; renderSummary(); }
function renderLines(){
  const showDisc=S.inv.disc_mode==='line', showVat=S.inv.vat_mode==='line';
  const head='<tr><th style="width:18px"></th><th style="width:52px;text-align:center">Poză</th><th>Descriere</th><th style="width:68px">Cant.</th><th style="width:60px">UM</th><th style="width:92px">Preț</th>'
    +(showDisc?'<th style="width:58px">Red.%</th>':'')+(showVat?'<th style="width:58px">TVA%</th>':'')
    +'<th style="width:100px;text-align:right">Total</th><th style="width:24px"></th></tr>';
  const rows=S.lines.map((l,i)=>{ const lt=lineNet(l);
    const thumb=l.photo_url
      ? (S.lineThumbs[l.photo_url]
          ? '<img onclick="lineDetails('+i+')" src="'+S.lineThumbs[l.photo_url]+'" title="Apasă pentru a edita descrierea/poza" style="width:42px;height:42px;object-fit:cover;border-radius:6px;border:1px solid var(--line);cursor:pointer;vertical-align:middle">'
          : '<span onclick="lineDetails('+i+')" style="display:inline-flex;width:42px;height:42px;align-items:center;justify-content:center;border:1px dashed var(--line);border-radius:6px;cursor:pointer">📷</span>')
      : '<button class="delx" onclick="lineDetails('+i+')" title="Adaugă poză / descriere" style="opacity:.4;font-size:1.05rem">📷</button>';
    return '<tr data-i="'+i+'"><td class="grip">≡</td>'
      +'<td style="text-align:center;vertical-align:middle">'+thumb+'</td>'
      +'<td><div class="ta-wrap"><input value="'+esc(l.name)+'" placeholder="Caută sau scrie…" oninput="lineSearch('+i+',this.value)" onfocus="lineSearch('+i+',this.value)" onblur="hideDD('+i+')" autocomplete="off"/><div class="dd" id="dd-'+i+'" style="display:none"></div></div>'
      +(l.description?'<div onclick="lineDetails('+i+')" title="Apasă pentru a edita" style="cursor:pointer;margin-top:5px;font-size:11.5px;color:#6b7793;line-height:1.35;white-space:pre-wrap">'+esc(l.description)+'</div>':'')
      +'</td>'
      +'<td><input id="qy-'+i+'" type="number" step="any" value="'+esc(l.qty)+'" oninput="lineEdit('+i+',\'qty\',this.value)"/></td>'
      +'<td><input value="'+esc(l.unit)+'" oninput="lineEdit('+i+',\'unit\',this.value)"/></td>'
      +'<td><input id="up-'+i+'" type="number" step="any" value="'+esc(l.unit_price)+'" oninput="lineEdit('+i+',\'unit_price\',this.value)"/></td>'

    +'<table><thead><tr><th>#</th><th>'+T('Denumire')+'</th><th class="r">'+T('Cant.')+'</th><th>'+T('UM')+'</th><th class="r">'+T('Preț')+'</th>'+(showDiscCol?'<th class="r">'+T('Reducere')+'</th>':'')+(showVatCol?'<th class="r">'+T('TVA')+'</th>':'')+'<th class="r">'+T('Total')+'</th><th style="width:108px;text-align:center">'+T('Foto')+'</th></tr></thead><tbody>'+(rows||'<tr><td colspan="'+colsN+'" style="text-align:center;color:#888;padding:18px">'+T('Fără linii.')+'</td></tr>')+'</tbody></table>'
    +'<div class="tot"><div><span>'+T('Subtotal:')+'</span><b>'+money(t.gross)+'</b></div>'
      +(t.disc>0.005?'<div><span>'+T('Reducere:')+'</span><b>−'+money(t.disc)+'</b></div>':'')
      +(vmode!=='none'?'<div><span>'+T('TVA:')+(vmode==='total'&&(+S.inv.vat_value)?(' '+num2(S.inv.vat_value)+'%'):'')+'</span><b>'+money(t.vat)+'</b></div>':'')
      +'<div class="g"><span>'+T('TOTAL:')+'</span><span>'+money(t.total)+'</span></div></div>'
    +(()=>{ const pn=prepayNote(t.total); return (pn&&S.inv.status!=='paid')?'<div style="margin-top:12px;margin-left:auto;width:380px;padding:11px 13px;background:#ecfdf5;border:1px solid #a7f3d0;border-radius:9px;font-size:12px;color:#065f46;line-height:1.5">💸 '+T('La achitarea 100% în avans beneficiați de o reducere suplimentară de')+' <b>'+num2(pn.pct)+'%</b> '+T('din suma finală')+' ('+T('economisiți')+' <b>'+money(pn.save)+'</b>). '+T('Total cu avans:')+' <b>'+money(pn.after)+'</b></div>':''; })()
    +'<div class="ft">'+T('Factură generată cu Cod373.')+' '+(S.inv.status==='paid'?T('ACHITATĂ.'):T('Vă rugăm achitați până la scadență.'))+'</div>'
    +'<div class="noprint" style="margin-top:20px;text-align:center"><button onclick="window.print()" style="padding:10px 20px;font-size:14px;cursor:pointer">🖨 '+T('Tipărește / Salvează PDF')+'</button></div>'
    +'<div id="lb" class="noprint" onclick="this.style.display=\'none\'" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);align-items:center;justify-content:center;z-index:9999;cursor:zoom-out"><img id="lbimg" style="max-width:92%;max-height:92%;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.5)"></div>'
    +'<script>function zoom(s){var l=document.getElementById("lb");document.getElementById("lbimg").src=s;l.style.display="flex";}document.addEventListener("keydown",function(e){if(e.key==="Escape"){var l=document.getElementById("lb");if(l)l.style.display="none";}});<\/script>'
    +'</body></html>';
  if(inPlace){ document.open(); document.write(doc); document.close(); return; }
  const w=window.open('','_blank'); if(!w){ toast('Permite ferestrele pop-up.'); return; } w.document.write(doc); w.document.close();
}
boot();
</script>
