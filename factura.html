<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<style>
  :root{ --ink:#0f1c33; --muted:#6b7793; --line:#e6eaf2; --primary:#2f6bff; --bg:#f4f6fb; --red:#dc2626; --green:#16a34a; }
  *{ box-sizing:border-box; } body{ margin:0; font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; color:var(--ink); background:var(--bg); font-size:14px; }
  header{ background:#fff; border-bottom:1px solid var(--line); padding:.7rem 1rem; display:flex; align-items:center; gap:.8rem; flex-wrap:wrap; position:sticky; top:0; z-index:30; }
  header h1{ font-size:1.05rem; margin:0; } .spacer{ flex:1; }
  .pill{ font-size:.72rem; padding:.18rem .6rem; border-radius:999px; font-weight:700; }
  .pill.draft{ background:#eef2ff; color:#3730a3; } .pill.sent{ background:#fef9c3; color:#854d0e; } .pill.paid{ background:#dcfce7; color:#15803d; } .pill.overdue{ background:#fee2e2; color:#b91c1c; } .pill.cancelled{ background:#f1f5f9; color:#64748b; }
  .btn{ border:1px solid var(--line); background:#fff; border-radius:9px; padding:.5rem .8rem; font-size:.85rem; cursor:pointer; color:var(--ink); white-space:nowrap; }
  .btn:hover{ background:#f1f5f9; } .btn.primary{ background:var(--primary); color:#fff; border-color:var(--primary); } .btn.green{ background:var(--green); color:#fff; border-color:var(--green); }
  .wrap{ max-width:1440px; margin:0 auto; padding:1.1rem; display:grid; grid-template-columns:1fr 320px; gap:1.1rem; align-items:start; }
  .lines{ table-layout:fixed; }
  @media(max-width:1200px){ .wrap{ grid-template-columns:1fr; } }
  .panel{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:1.1rem; margin-bottom:1.1rem; }
  .panel h3{ margin:0 0 .8rem; font-size:.95rem; }
  .right{ position:sticky; top:72px; }
  .field{ margin-bottom:.7rem; } label{ display:block; font-size:.78rem; font-weight:600; margin-bottom:.25rem; color:#46506a; }
  input,select,textarea{ width:100%; padding:.5rem .65rem; border:1px solid var(--line); border-radius:9px; font-size:.88rem; font-family:inherit; outline:none; background:#fff; }
  input[type=number]{ -moz-appearance:textfield; }
  input[type=number]::-webkit-outer-spin-button, input[type=number]::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  input:focus,select:focus,textarea:focus{ border-color:var(--primary); }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:.6rem; }
  .lines{ width:100%; border-collapse:collapse; }
  .lines th{ text-align:left; font-size:.7rem; text-transform:uppercase; color:var(--muted); padding:.3rem .35rem; border-bottom:1px solid var(--line); }
  .lines td{ padding:.25rem .25rem; vertical-align:top; border-bottom:1px solid #f1f4fa; }
  .lines td input{ padding:.45rem .5rem; } .grip{ cursor:grab; color:#c2cbdb; padding:.4rem .1rem; }
  .ta-wrap{ position:relative; }
  .lines td textarea.lname{ width:100%; padding:.45rem .5rem; resize:none; overflow:hidden; line-height:1.3; min-height:2.2em; white-space:pre-wrap; word-break:break-word; font-family:inherit; font-size:.88rem; }
  .dd{ position:absolute; z-index:40; left:0; right:0; top:100%; background:#fff; border:1px solid var(--line); border-radius:10px; box-shadow:0 10px 30px rgba(15,28,51,.14); max-height:280px; overflow:auto; margin-top:2px; }
  .dd .it{ padding:.5rem .7rem; cursor:pointer; display:flex; gap:.5rem; align-items:center; font-size:.85rem; border-bottom:1px solid #f4f6fb; }
  .dd .it:hover{ background:#eff4ff; } .dd .it .nm{ flex:1; } .dd .it .pr{ color:var(--muted); font-size:.78rem; white-space:nowrap; } .dd .add{ color:var(--primary); font-weight:700; }
  .sub{ color:var(--muted); font-size:.8rem; }
  .totrow{ display:flex; justify-content:space-between; padding:.35rem 0; }
  .totrow.g{ font-size:1.15rem; font-weight:800; border-top:2px solid var(--ink); margin-top:.4rem; padding-top:.6rem; }
  .delx{ background:none; border:none; color:#c2452f; cursor:pointer; font-size:1.1rem; padding:.3rem; }
  .center{ text-align:center; padding:3rem 1rem; color:var(--muted); }
  .toast{ position:fixed; bottom:1rem; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:.6rem 1rem; border-radius:10px; font-size:.85rem; z-index:80; opacity:0; transition:.2s; } .toast.show{ opacity:1; }
  .ov{ position:fixed; inset:0; background:rgba(15,28,51,.5); display:flex; align-items:center; justify-content:center; z-index:90; padding:1rem; } .modal{ background:#fff; border-radius:14px; width:100%; max-width:420px; padding:1.1rem; } .modal h3{ margin:0 0 .8rem; }
  .addline{ background:none; border:1px dashed var(--line); color:var(--primary); border-radius:9px; padding:.5rem .8rem; cursor:pointer; font-size:.85rem; margin-top:.5rem; }
</style>
</head>
<body>
<header>
  <h1>🧾 Factură</h1>
  <span id="hd-num" class="sub"></span>
  <span id="hd-status"></span>
  <div class="spacer"></div>
  <button class="btn" onclick="goBack()">↩ Înapoi</button>

<div id="root"><div class="center">Se încarcă…</div></div>

<script>
const SUPABASE_URL='https://vzatmfhkwiojqkowtftg.supabase.co';
const SUPABASE_KEY='sb_publishable_wNj9S8eta39n1Gkq_g-gfA_idl_pbPy';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
const esc=s=>(s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CURSYM={MDL:'MDL',EUR:'€',RON:'lei',USD:'$',UAH:'₴',GBP:'£'}; let CUR='MDL';
const money=n=>new Intl.NumberFormat('ro-RO',{minimumFractionDigits:2,maximumFractionDigits:2}).format(+n||0)+' '+(CURSYM[CUR]||CUR);
const num2=n=>{ const r=Math.round((+n||0)*100)/100; return r%1===0?r:r.toFixed(2); };
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2200); }
function param(k){ return new URLSearchParams(location.search).get(k); }
function goBack(){ if(history.length>1) history.back(); else location.href='app.html'; }
function base(){ return location.href.split('?')[0].split('#')[0].replace(/\/[^/]*$/,'/'); }

const STATUS={draft:'Ciornă',sent:'Trimisă',paid:'Plătită',overdue:'Restantă',cancelled:'Anulată'};
const FIN=['owner','admin','manager','accountant'];
let S={ id:null, role:null, canEdit:false, firm:{}, tenant:null,
        inv:{status:'draft',number:'',client_id:'',title:'',issue_date:new Date().toISOString().slice(0,10),due_date:'',disc_mode:'none',disc_value:0,vat_mode:'line',vat_value:0,materials_mode:'detailed',skonto_off:false,skonto_pct:null,inv_type:'normal',contract_total:null,retention_pct:null,site_id:null,bank_choice:''},
        lines:[], groups:[], clients:[], catalog:[], lineThumbs:{} };
function gid(){ return 'g'+Date.now().toString(36)+Math.floor(Math.random()*1000); }
function coDateFmt(){ return (S.firm&&S.firm.automations&&S.firm.automations.date_fmt)||'DD.MM.YYYY'; }
function fmtDate(iso){ if(!iso) return ''; const s=String(iso).slice(0,10); const p=s.split('-'); if(p.length<3) return s; const y=p[0],m=p[1],d=p[2]; const f=coDateFmt(); return f==='YYYY-MM-DD'?s:f==='DD/MM/YYYY'?(d+'/'+m+'/'+y):f==='MM/DD/YYYY'?(m+'/'+d+'/'+y):(d+'.'+m+'.'+y); }
/* ── schiță auto-salvată (factură nouă) ── */
let _dzT=null;
function dkey(){ return 'c373_draft_factura_'+(S.tenant||''); }
function getDraftDz(){ try{ const r=localStorage.getItem(dkey()); return r?JSON.parse(r):null; }catch(e){ return null; } }
function saveDraftDz(){ if(S.id) return; try{ const has=(S.lines||[]).some(l=>(l.name||'').trim()||(+l.unit_price>0)); if(!has){ localStorage.removeItem(dkey()); return; } localStorage.setItem(dkey(), JSON.stringify({t:Date.now(), inv:S.inv, lines:S.lines, groups:S.groups})); }catch(e){} }
function clearDraftDz(){ try{ localStorage.removeItem(dkey()); }catch(e){} }
function scheduleDraft(){ if(S.id) return; clearTimeout(_dzT); _dzT=setTimeout(saveDraftDz,600); }

async function boot(){
  const { data:{ session } }=await sb.auth.getSession();
  if(!session){ $('root').innerHTML='<div class="center">🔒 Trebuie să fii autentificat.<br><br><a class="btn primary" href="app.html">Deschide aplicația</a></div>'; return; }
  const mem=await sb.from('memberships').select('tenant_id, role, tenants(name,idno,address,phone,vat_rate,currency,logo_url,automations,bank_accounts)').eq('active',true).limit(1).maybeSingle();
  S.role=mem.data?mem.data.role:null; S.tenant=mem.data?mem.data.tenant_id:null; S.firm=(mem.data&&mem.data.tenants)||{}; S.canEdit=FIN.includes(S.role); CUR=(S.firm.currency||'MDL').toUpperCase();
  if(!S.canEdit){ $('root').innerHTML='<div class="center">🔒 Doar proprietar/administrator/manager/contabil pot emite facturi.</div>'; return; }
  await loadCatalog();
  const id=param('id');
  if(id){ await loadInvoice(id); }
  else { S.inv.number=await genNumber(); if(param('client')) S.inv.client_id=param('client'); S.lines=[blankLine()];
    const d=new Date(); d.setDate(d.getDate()+14); S.inv.due_date=d.toISOString().slice(0,10);
    S.inv.vat_value=(S.firm.vat_rate!=null?S.firm.vat_rate:20); S.inv.vat_mode=(S.firm.vat_rate?'line':'none');
    if(param('estimate')) await fromEstimate(param('estimate'));
    else { const dr=getDraftDz(); if(dr && dr.lines && dr.lines.length){ if(dr.inv) S.inv=Object.assign(S.inv,dr.inv); S.lines=dr.lines; if(Array.isArray(dr.groups)) S.groups=dr.groups; reorderLinesBySection(); S._restored=true; } }
  }
  if(param('print')){ await pdf(true); return; }
  render();
  signLineThumbs();
  document.addEventListener('input',scheduleDraft); document.addEventListener('change',scheduleDraft);
  if(S._restored) toast('↩️ Schiță nesalvată restaurată.');
}
async function signLineThumbs(){
  const paths=S.lines.filter(l=>l.photo_url && !S.lineThumbs[l.photo_url]).map(l=>l.photo_url);
  if(!paths.length){ return; }
  try{ const su=await sb.storage.from('docs').createSignedUrls(paths,3600); (su.data||[]).forEach((x,idx)=>{ if(x.signedUrl) S.lineThumbs[paths[idx]]=x.signedUrl; }); }catch(e){}
  renderLines();
}
async function genNumber(){ try{ const { count }=await sb.from('invoices').select('id',{count:'exact',head:true}); return 'FAC-'+new Date().getFullYear()+'-'+String((count||0)+1).padStart(4,'0'); }catch(e){ return 'FAC-'+new Date().getFullYear()+'-'+Math.floor(Math.random()*900+100); } }
function blankLine(){ return { name:'', qty:1, unit:'buc', unit_price:0, vat_rate:(S.firm.vat_rate!=null?S.firm.vat_rate:20), disc:0, group:'', description:'', photo_url:null }; }

async function loadCatalog(){
  const [cl, svc, nrm, mat]=await Promise.all([
    sb.from('clients').select('id,name').order('name'),
    sb.from('services').select('id,name,unit,price,vat_rate,description,photo_url').eq('active',true),
    sb.from('norms').select('id,name,unit,unit_price'),
    sb.from('materials').select('id,name,unit,last_price,vat_rate,description,photo_url').eq('active',true)
  ]);
  S.clients=cl.data||[];
  S.catalog=[].concat(
    (svc.data||[]).map(x=>({src:'service',id:x.id,icon:'🧰',name:x.name,unit:x.unit||'buc',price:+x.price||0,vat:+x.vat_rate||20,desc:x.description||'',photo:x.photo_url||null})),
    (nrm.data||[]).map(x=>({icon:'📐',name:x.name,unit:x.unit||'m2',price:+x.unit_price||0,vat:20})),
    (mat.data||[]).map(x=>({src:'material',id:x.id,icon:'📦',name:x.name,unit:x.unit||'buc',price:+x.last_price||0,vat:+x.vat_rate||20,desc:x.description||'',photo:x.photo_url||null}))
  );
}
async function loadInvoice(id){
  const e=await sb.from('invoices').select('*').eq('id',id).single();
  if(e.error){ toast('Eroare: '+e.error.message); return; }
  S.id=id; S.inv={ status:e.data.status, number:e.data.number||'', client_id:e.data.client_id||'', title:e.data.title||'', site_id:e.data.site_id||null,
    issue_date:e.data.issue_date||new Date().toISOString().slice(0,10), due_date:e.data.due_date||'',
    disc_mode:e.data.disc_mode||'none', disc_value:+e.data.disc_value||0, vat_mode:e.data.vat_mode||'line', vat_value:+e.data.vat_value||0, materials_mode:e.data.materials_mode||'detailed', skonto_off:!!e.data.skonto_off, skonto_pct:(e.data.skonto_pct!=null?+e.data.skonto_pct:null), inv_type:e.data.inv_type||'normal', contract_total:(e.data.contract_total!=null?+e.data.contract_total:null), retention_pct:(e.data.retention_pct!=null?+e.data.retention_pct:null), bank_choice:e.data.bank_choice||'' };
  S.groups=Array.isArray(e.data.groups)?e.data.groups.map(g=>({id:g.id,name:g.name||'',vat:+g.vat||0,disc:+g.disc||0})):[];
  if(S.inv.inv_type!=='normal') loadAbschlaege();
  const it=await sb.from('invoice_items').select('*').eq('invoice_id',id);
  const mapped=((it.data||[]).sort((a,b)=>(a.position||0)-(b.position||0))).map(x=>({ name:x.name, qty:+x.qty, unit:x.unit, unit_price:+x.unit_price, vat_rate:+x.vat_rate, disc:+x.disc||0, group:x.group_id||'', kind:x.kind||'service', description:x.description||'', photo_url:x.photo_url||null }));
  // Auto-curățare: elimină liniile EXACT identice (corupere veche dintr-o regulă RLS care bloca ștergerea la salvarea făcută de manager/contabil → liniile se dublau).
  const _seen=new Set(); const _before=mapped.length;
  S.lines=mapped.filter(l=>{ const k=[l.name,l.qty,l.unit,l.unit_price,l.vat_rate,l.disc,l.group,l.description||'',l.photo_url||''].join('¦'); if(_seen.has(k)) return false; _seen.add(k); return true; });
  const _removed=_before-S.lines.length;
  reorderLinesBySection();
  if(!S.lines.length) S.lines=[blankLine()];
  if(_removed>0) setTimeout(function(){ toast('⚠️ Am eliminat '+_removed+' linii dublate (eroare mai veche). Verifică totalul și apasă „Salvează" ca să se corecteze definitiv.'); },500);
}
async function fromEstimate(eid){
  const e=await sb.from('estimates').select('client_id,title,disc_mode,disc_value,vat_mode,vat_value,groups,materials_mode,skonto_off,skonto_pct').eq('id',eid).single();
  if(e.data&&e.data.client_id) S.inv.client_id=e.data.client_id;
  if(e.data){ S.inv.title=e.data.title||''; S.inv.disc_mode=e.data.disc_mode||'none'; S.inv.disc_value=+e.data.disc_value||0; S.inv.vat_mode=e.data.vat_mode||S.inv.vat_mode; S.inv.vat_value=+e.data.vat_value||S.inv.vat_value; S.inv.materials_mode=e.data.materials_mode||'detailed'; S.inv.skonto_off=!!e.data.skonto_off; S.inv.skonto_pct=(e.data.skonto_pct!=null?+e.data.skonto_pct:null); S.groups=Array.isArray(e.data.groups)?e.data.groups.map(g=>({id:g.id,name:g.name||'',vat:+g.vat||0,disc:+g.disc||0})):[]; }
  const it=await sb.from('estimate_items').select('*').eq('estimate_id',eid);
  const items=(it.data||[]).sort((a,b)=>(a.position||0)-(b.position||0));
  if(items.length) S.lines=items.map(x=>({ name:x.name, qty:+x.qty, unit:x.unit, unit_price:+x.unit_price, vat_rate:+x.vat_rate, disc:+x.disc||0, group:x.group_id||'', kind:x.kind||'service', description:x.description||'', photo_url:x.photo_url||null }));
  reorderLinesBySection();
  S._fromEstimate=eid;
}
function reorderLinesBySection(){
  const known=new Set(S.groups.map(g=>g.id));
  S.lines.forEach(l=>{ if(l.group && !known.has(l.group)) l.group=''; });
  let arr=S.lines.filter(l=>!l.group);
  S.groups.forEach(g=>{ arr=arr.concat(S.lines.filter(l=>l.group===g.id)); });
  S.lines=arr;
}
function lineNet(l){ const g=(+l.qty||0)*(+l.unit_price||0); return (!l.group && S.inv.disc_mode==='line')? g*(1-(+l.disc||0)/100) : g; }
/* TVA efectiv pe linie: în grup sau în mod „pe poziție" → cota liniei; altfel 0 (mod unificat/fără = TVA doar la final) */
function lineEffVat(l){ const inGroup=!!l.group; if(inGroup) return +l.vat_rate||0; const vm=S.inv.vat_mode; if(vm==='line') return +l.vat_rate||0; if(vm==='total') return +S.inv.vat_value||0; return 0; }
function lineGross(l){ return lineNet(l)*(1+lineEffVat(l)/100); }
/* Selector TVA pe linie: cotele din țara/firma (Setări) + „—" (fără TVA) */
function vatRates(){ const rs=(S.firm&&S.firm.automations&&S.firm.automations.vat_rates)||[20,8,0]; return rs.map(Number).filter(r=>!isNaN(r)&&r>=0); }
function vatOptsHtml(cur){ cur=Math.round((+cur||0)*100)/100; let rs=vatRates().filter(r=>r>0); if(cur>0&&rs.indexOf(cur)<0) rs.push(cur); rs=Array.from(new Set(rs)).sort((a,b)=>b-a);
  return '<option value="0"'+(cur===0?' selected':'')+'>—</option>'+rs.map(r=>'<option value="'+r+'"'+(r===cur?' selected':'')+'>'+num2(r)+'%</option>').join(''); }
function vatSelectHtml(i,cur){ return '<select id="vt-'+i+'" onchange="lineSetVat('+i+',this.value)" style="width:100%;font-weight:600">'+vatOptsHtml(cur)+'</select>'; }
function lineSetVat(i,v){ const rate=(v===''?0:+v||0); const l=S.lines[i]; if(!l) return;
  if(!l.group && S.inv.vat_mode==='total'){ S.inv.vat_value=rate; S.lines.forEach(x=>{ if(!x.group) x.vat_rate=rate; }); render(); }
  else { l.vat_rate=rate; refreshLineTotal(i); renderSummary(); } }
function groupTotals(grp){ let net=0, vat=0; const f=(1-(+grp.disc||0)/100); S.lines.forEach(l=>{ if(l.group===grp.id){ const g=(+l.qty||0)*(+l.unit_price||0); net+=g; vat+=g*f*(+l.vat_rate||0)/100; } }); const base=net*f; return { net:net, base:base, vat:vat, total:base+vat }; }
function totals(){
  const dm=S.inv.disc_mode||'none', vm=S.inv.vat_mode||'none';
  let gross=0, base=0, disc=0, vat=0;
  const ung=S.lines.filter(l=>!l.group);
  let uGross=0,uNet=0; ung.forEach(l=>{ const g=(+l.qty||0)*(+l.unit_price||0); uGross+=g; uNet+=(dm==='line'? g*(1-(+l.disc||0)/100):g); });
  const uF=(dm==='total')?(1-(+S.inv.disc_value||0)/100):1; const uBase=uNet*uF;
  gross+=uGross; base+=uBase; disc+=(uGross-uBase);
  if(vm==='line') ung.forEach(l=>{ const g=(+l.qty||0)*(+l.unit_price||0); const net=(dm==='line'? g*(1-(+l.disc||0)/100):g)*uF; vat+=net*(+l.vat_rate||0)/100; });
  else if(vm==='total') vat+=uBase*(+S.inv.vat_value||0)/100;
  S.groups.forEach(grp=>{ const gt=groupTotals(grp); gross+=gt.net; base+=gt.base; disc+=(gt.net-gt.base); vat+=gt.vat; });
  return { gross:gross, sub:base, disc:disc, vat:vat, total:base+vat };
}
function prepayNote(total){
  const au=(S.firm&&S.firm.automations)||{};
  if(au.prepay_show===false) return null;
  if(S.inv.skonto_off) return null;
  const pct=(S.inv.skonto_pct!=null && S.inv.skonto_pct!=='') ? +S.inv.skonto_pct : (au.prepay_pct!=null?+au.prepay_pct:3);
  if(!(pct>0)||!(total>0)) return null;
  const save=Math.round(total*pct/100*100)/100;
  return { pct:pct, save:save, after:Math.round((total-save)*100)/100 };
}
function firmBankLines(){ return ((S.firm&&S.firm.bank_accounts)||'').split(/\n+/).map(function(x){return x.trim();}).filter(Boolean); }
function setInvBank(v){ S.inv.bank_choice=v; }
function bankTextForPdf(){ var lines=firmBankLines(); var ch=S.inv.bank_choice||''; if(ch==='__off') return ''; if(ch && lines.indexOf(ch)>-1) return ch; return lines.join('\n'); }
function skontoToggle(off){ S.inv.skonto_off=!!off; render(); }
function skontoPct(v){ S.inv.skonto_pct=(v===''?null:+v); }
/* ── facturare pe stadii (DE): Abschlag / Schluss + reținere garanție ── */
function setInvType(v){ S.inv.inv_type=v; if(v!=='normal') loadAbschlaege(); render(); }
function setInvSite(v){ S.inv.site_id=v||null; if(S.inv.inv_type!=='normal') loadAbschlaege(); renderSummary(); }
function setContractTotal(v){ S.inv.contract_total=(v===''?null:+v); }
function setRetention(v){ S.inv.retention_pct=(v===''?null:+v); renderSummary(); }
function addContractPct(){ const p=parseFloat(prompt('Ce procent din contract facturezi acum? (%)','30')); if(!(p>0)) return;
  const ct=+S.inv.contract_total||0; if(!(ct>0)){ toast('Completează întâi „Valoare contract".'); return; }
  const amt=Math.round(ct*p/100*100)/100; const vr=(S.firm.vat_rate!=null?+S.firm.vat_rate:20);
  S.lines.push(Object.assign(blankLine(),{name:'Abschlag — '+num2(p)+'% din contract',qty:1,unit:'buc',unit_price:amt,vat_rate:vr,kind:'service'}));
  reorderLinesBySection(); renderLines(); toast('Adăugat: '+num2(p)+'% ('+money(amt)+').'); }
async function loadAbschlaege(){ S._absch=[]; if(!S.inv.site_id) return;
  try{ let q=sb.from('invoices').select('id,number,issue_date,total').eq('site_id',S.inv.site_id).eq('inv_type','abschlag'); const r=await q;
    S._absch=((r.data||[]).filter(x=>x.id!==S.id)).map(x=>({number:x.number,date:x.issue_date,total:+x.total||0})); }catch(e){ S._absch=[]; }
  renderSummary(); }
function deTotals(){ const t=totals(); const abs=(S.inv.inv_type==='schluss')?((S._absch||[]).reduce((s,x)=>s+(+x.total||0),0)):0;
  const ret=(S.inv.retention_pct>0)?Math.round(t.total*(+S.inv.retention_pct)/100*100)/100:0;
  return { total:t.total, abs:Math.round(abs*100)/100, ret:ret, payable:Math.round((t.total-abs-ret)*100)/100 }; }
function invTypeLabel(){ return {abschlag:'ABSCHLAGSRECHNUNG (factură parțială)',schluss:'SCHLUSSRECHNUNG (factură finală)'}[S.inv.inv_type]||'FACTURĂ FISCALĂ'; }

function sectionTableHtml(idxs,inGroup,gidv){
  const showDisc=!inGroup&&S.inv.disc_mode==='line', showVat=inGroup?true:(S.inv.vat_mode!=='none');
  const head='<tr><th style="width:24px"></th><th style="width:16px"></th><th style="width:48px;text-align:center">Poză</th><th>Descriere</th><th style="width:84px">Cant.</th><th style="width:84px">UM</th><th style="width:98px">Preț</th>'
    +(showDisc?'<th style="width:68px">Red.%</th>':'')+(showVat?'<th style="width:86px">TVA</th>':'')
    +'<th style="width:120px;text-align:right">'+((inGroup||S.inv.vat_mode!=='none')?'Total cu TVA':'Total')+'</th><th style="width:104px"></th></tr>';
  const rows=idxs.map(i=>lineRowHtml(i,inGroup)).join('') || (inGroup?'<tr class="ph"><td colspan="20" style="color:var(--muted);padding:.5rem .6rem;font-size:.8rem">— gol — trage poziții aici sau apasă „＋ linie" —</td></tr>':'');
  return '<table class="lines"><thead>'+head+'</thead><tbody class="lbody" data-g="'+(gidv||'')+'">'+rows+'</tbody></table>';

function uomOptions(){ return uomList().map(u=>'<option value="'+esc(u)+'"></option>').join(''); }
/* Unități de măsură: lista din bază + Setări (automations.units) + catalog + adăugate în sesiune */
function uomList(){ const base=['buc','set','m','ml','m2','m3','kg','t','l','pachet','rolă','sac','placă','foaie','găleată','tub','oră','zi','punct']; const cu=(S.firm&&S.firm.automations&&S.firm.automations.units)||[]; const cat=(S.catalog||[]).map(c=>c.unit).filter(Boolean); const ex=window._extraUnits||[]; return Array.from(new Set(base.concat(cu).concat(cat).concat(ex))); }
function unitOptsHtml(cur){ cur=(cur||'').trim(); let us=uomList(); if(cur && us.indexOf(cur)<0) us=[cur].concat(us); return us.map(u=>'<option value="'+esc(u)+'"'+(u===cur?' selected':'')+'>'+esc(u)+'</option>').join('')+'<option value="__new">＋ alta…</option>'; }
function unitSelectHtml(i,cur){ return '<select onchange="lineSetUnit('+i+',this.value)" style="width:100%">'+unitOptsHtml(cur)+'</select>'; }
async function persistUnit(u){ try{ const au=Object.assign({}, S.firm.automations||{}); const units=Array.isArray(au.units)?au.units.slice():[]; if(units.indexOf(u)>=0) return; units.push(u); au.units=units; S.firm.automations=au; const tid=(await sb.from('memberships').select('tenant_id').eq('active',true).limit(1).maybeSingle()).data.tenant_id; if(tid) await sb.from('tenants').update({automations:au}).eq('id',tid); }catch(e){} }
function lineSetUnit(i,v){ const l=S.lines[i]; if(!l) return; if(v==='__new'){ const u=(prompt('Unitate de măsură nouă (ex: ml, oră, sac):')||'').trim(); if(!u){ render(); return; } window._extraUnits=window._extraUnits||[]; if(window._extraUnits.indexOf(u)<0) window._extraUnits.push(u); l.unit=u; persistUnit(u); render(); return; } l.unit=v; scheduleDraft(); }
function vatListHtml(){ const rs=(S.firm&&S.firm.automations&&S.firm.automations.vat_rates)||[20,8,0]; return '<datalist id="vat-list">'+rs.map(r=>'<option value="'+esc(r)+'"></option>').join('')+'</datalist>'; }

        +'<label style="font-size:.76rem;color:#46506a;display:flex;align-items:center;gap:.25rem" title="aplică acest TVA tuturor liniilor din grup (poți edita apoi pe fiecare linie)">TVA toate <input type="number" step="any" value="'+esc(g.vat||0)+'" onchange="applyGroupVat(\''+g.id+'\',this.value)" style="width:58px"/>%</label>'

        +'<span id="gtot-'+g.id+'" style="font-size:.84rem;font-weight:800;min-width:90px;text-align:right">'+money(gt.total)+'</span>'

        +'<button class="btn" style="padding:.25rem .5rem;font-size:.78rem" onclick="addSelToGroup(\''+g.id+'\')" title="adaugă pozițiile bifate în acest grup">📑 selecția</button>'

function taGrow(el){ if(!el) return; el.style.height='auto'; el.style.height=(el.scrollHeight)+'px'; }
function lnameSize(){ try{ document.querySelectorAll('.lines textarea.lname').forEach(taGrow); }catch(e){} }
function initLineSort(){
  document.querySelectorAll('#lines-wrap .lbody').forEach(tb=>{ Sortable.create(tb,{ group:'fclines', handle:'.grip', animation:150, onEnd:rebuildLinesFromDOM }); });
  const gw=$('groups-wrap'); if(gw) Sortable.create(gw,{ handle:'.ggrip', animation:150, onEnd:rebuildGroupsFromDOM });
}
function rebuildLinesFromDOM(){
  const nl=[];
  document.querySelectorAll('#lines-wrap .lbody').forEach(tb=>{ const g=tb.getAttribute('data-g')||''; tb.querySelectorAll('tr[data-i]').forEach(tr=>{ const oi=+tr.getAttribute('data-i'); const l=S.lines[oi]; if(l){ l.group=g; nl.push(l); } }); });
  if(nl.length===S.lines.length) S.lines=nl;
  renderLines(); renderSummary();
}
function rebuildGroupsFromDOM(){
  const order=[]; document.querySelectorAll('#groups-wrap .lgroup').forEach(d=>{ const g=S.groups.find(x=>x.id===d.getAttribute('data-g')); if(g) order.push(g); });
  if(order.length===S.groups.length) S.groups=order;
  reorderLinesBySection(); renderLines(); renderSummary();
}
function newGroup(){ S.groups.push({id:gid(),name:'Grup '+(S.groups.length+1),vat:(S.firm.vat_rate!=null?+S.firm.vat_rate:20),disc:0}); renderLines(); renderSummary(); }
function groupSelection(){ const sel=S.lines.filter(l=>l._sel); if(!sel.length){ toast('Bifează întâi pozițiile.'); return; } const id=gid(); S.groups.push({id:id,name:'Grup '+(S.groups.length+1),vat:(S.firm.vat_rate!=null?+S.firm.vat_rate:20),disc:0}); sel.forEach(l=>{ l.group=id; l._sel=false; }); reorderLinesBySection(); renderLines(); renderSummary(); toast('🗂️ Grup creat din '+sel.length+' poziții.'); }
function addSelToGroup(id){ const sel=S.lines.filter(l=>l._sel); if(!sel.length){ toast('Bifează întâi pozițiile.'); return; } sel.forEach(l=>{ l.group=id; l._sel=false; }); reorderLinesBySection(); renderLines(); renderSummary(); }
function setGroupName(id,v){ const g=S.groups.find(x=>x.id===id); if(g) g.name=v; scheduleDraft(); }

async function saveLineDetails(i){

async function saveNewClient(){
  const name=($('nc-name').value||'').trim(); if(!name){ $('nc-msg').textContent='Denumirea e obligatorie.'; return; }
  const rec={tenant_id:S.tenant,name,phone:($('nc-phone').value||'').trim()||null,idno:($('nc-idno').value||'').trim()||null,address:($('nc-addr').value||'').trim()||null};
  const ins=await sb.from('clients').insert(rec).select('id,name').single();

async function save(thenPdf){
  if(!(S.inv.number||'').trim()){ toast('Numărul facturii e obligatoriu.'); return; }
  if(!S.inv.client_id){ toast('Alege un client.'); return; }

  $('btn-save').disabled=true;
  try{ const {data:{session:_s}}=await sb.auth.getSession(); if(_s&&_s.expires_at&&_s.expires_at*1000<Date.now()+60000){ await sb.auth.refreshSession(); } }catch(e){}
  const t=totals();
  const rec={ tenant_id:S.tenant, client_id:S.inv.client_id||null, number:S.inv.number, status:S.inv.status, title:S.inv.title||null,
    issue_date:S.inv.issue_date||null, due_date:S.inv.due_date||null, estimate_id:S._fromEstimate||null, site_id:S.inv.site_id||null,
    inv_type:S.inv.inv_type||'normal', contract_total:(S.inv.contract_total!=null&&S.inv.contract_total!==''?+S.inv.contract_total:null), retention_pct:(S.inv.retention_pct!=null&&S.inv.retention_pct!==''?+S.inv.retention_pct:null), bank_choice:(S.inv.bank_choice||null),
    groups:S.groups.map(g=>({id:g.id,name:g.name||'',vat:+g.vat||0,disc:+g.disc||0})),
    disc_mode:S.inv.disc_mode||'none', disc_value:+S.inv.disc_value||0, vat_mode:S.inv.vat_mode||'none', vat_value:+S.inv.vat_value||0, materials_mode:S.inv.materials_mode||'detailed', skonto_off:!!S.inv.skonto_off, skonto_pct:(S.inv.skonto_pct!=null&&S.inv.skonto_pct!==''?+S.inv.skonto_pct:null),
    subtotal:t.sub, vat_total:t.vat, total:t.total };
  try{
    if(S.id){ const u=await sb.from('invoices').update(rec).eq('id',S.id); if(u.error) throw u.error; }
    else { const ins=await sb.from('invoices').insert(rec).select('id').single(); if(ins.error) throw ins.error; S.id=ins.data.id; history.replaceState(null,'',base()+'factura.html?id='+S.id); }
    const del=await sb.from('invoice_items').delete().eq('invoice_id',S.id); if(del.error) throw del.error;
    // Verificăm că ștergerea chiar a avut loc — altfel inserarea ar dubla liniile (protecție anti-corupere).
    const chk=await sb.from('invoice_items').select('id',{count:'exact',head:true}).eq('invoice_id',S.id);
    if(chk.count){ $('btn-save').disabled=false; toast('Nu am putut rescrie liniile (drepturi insuficiente pentru rolul tău). Cere owner-ului să aplice ultima actualizare sau să salveze el factura.'); return; }
    const items=valid.map((l,i)=>({tenant_id:S.tenant,invoice_id:S.id,name:l.name,qty:+l.qty||1,unit:l.unit||'buc',unit_price:+l.unit_price||0,vat_rate:+l.vat_rate||0,disc:+l.disc||0,group_id:l.group||null,kind:l.kind||'service',position:i+1,description:l.description||null,photo_url:l.photo_url||null}));
    const im=await sb.from('invoice_items').insert(items); if(im.error) throw im.error;
    clearDraftDz(); $('btn-save').disabled=false; const dp=(t.gross>0?Math.round(t.disc/t.gross*1000)/10:0); toast('✅ Factură salvată.'+(dp>0?' Reducere '+dp+'%':'')); if(thenPdf) pdf();

async function markPaid(){
  if(!S.id){ toast('Salvează întâi factura.'); return; }
  if(!confirm('Marchezi factura ca plătită? Se înregistrează încasarea.')) return;
  const { error }=await sb.rpc('pay_invoice',{p_invoice:S.id});
  if(error){ toast('Eroare: '+error.message); return; }
  S.inv.status='paid'; toast('✅ Factură marcată plătită.'); render();
}
