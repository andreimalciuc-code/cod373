<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />

<meta name="apple-mobile-web-app-title" content="Cod373 Teren" />
<link rel="apple-touch-icon" href="icon-192.png" />

<meta name="apple-mobile-web-app-capable" content="yes" />

<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#f4f6fb;--surface:#fff;--ink:#0f1c33;--muted:#6b7793;--line:#e5e9f2;
        --primary:#2f6bff;--accent:#ff8a3d;--green:#16b364;--green-soft:#e3f8ee;--red:#f04438;--red-soft:#fde7e5;--amber:#f7a325;--amber-soft:#fdf2dd;--blue-soft:#e8f0ff;
        /* KB#109 — tokeni adăugați ca tema închisă să aibă ce rescrie. Valorile pe tema
           DESCHISĂ sunt exact literalele care erau deja scrise în pagină, deci aspectul
           luminos rămâne neschimbat pixel cu pixel. */
        --chip:#eef1f6;--chip-ink:#475467;--green-ink:#067647;--blue-ink:#1d4ed8;--amber-ink:#92400e;--red-ink:#b42318;
        --field:#fff;--link:#2f6bff;--star-off:#d8dee9;--toast-bg:#0f1c33;--toast-ink:#fff;--sheet-scrim:rgba(15,28,51,.5);
        color-scheme:light}
  /* ══ KB#109 / D97 — TEMA ÎNTUNECATĂ A APLICAȚIEI DE TEREN ══════════════════
     Autoritatea NU e nouă. Biroul ține preferința în `c373_prefs:<user-id>`,
     câmpul `theme` ∈ {light,dark}, și o aplică prin clasa `body.theme-dark`
     (`applyPrefs` din `app.html`). Terenul citește ȘI SCRIE aceeași cheie, deci
     comutatorul de pe telefon schimbă și biroul aceluiași utilizator — un singur
     sistem de aspect, nu două. Biroul NU are opțiune „system" (nicăieri un
     `prefers-color-scheme`), deci nici terenul n-o primește.
     `color-scheme:dark` e ce înnegrește controalele NATIVE — selectoarele de dată,
     popup-ul de `<select>`, barele de derulare — pe care CSS-ul nostru nu le atinge. */
  body.theme-dark{
    --bg:#0e1622;--surface:#18222f;--ink:#e7ecf6;--muted:#95a2bc;--line:#2a3648;
    --green-soft:#12271c;--red-soft:#2e1616;--amber-soft:#2c2206;--blue-soft:#17263f;
    --chip:#212c3d;--chip-ink:#aebbd4;--green-ink:#5cd39a;--blue-ink:#8fb4ff;--amber-ink:#f0b95c;--red-ink:#ff9b91;
    --field:#111a26;--link:#8fb4ff;--star-off:#3a465c;--toast-bg:#2a3648;--toast-ink:#e7ecf6;
    --sheet-scrim:rgba(0,0,0,.62);
    color-scheme:dark}
  html,body{height:100%}
  body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
  button,input,select,textarea{font-family:inherit}
  /* KB#109 — plasa de siguranță: câmpurile desenate din JS n-au clasa `.fld`, iar fără
     fundal explicit rămâneau ALBE pe tema închisă, cu text deschis peste ele. */
  input,select,textarea{background:var(--field);color:var(--ink)}
  .hidden{display:none!important}

  /* phone frame on desktop, full-bleed on phone */
  .phone{max-width:460px;margin:0 auto;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;position:relative}

  /* LOGIN */
  @keyframes c373spin{to{transform:rotate(360deg)}}
  #splash{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#0f1c33,#1a2b4a);transition:opacity .25s ease}
  #splash .nm{font-size:1.9rem;font-weight:800;letter-spacing:.5px;color:#eaf0fb}
  #splash .nm span{color:#2f6bff}
  #splash .sp{margin:1.1rem auto 0;width:26px;height:26px;border:3px solid rgba(255,255,255,.18);border-top-color:#2f6bff;border-radius:50%;animation:c373spin .8s linear infinite}
  .login{flex:1;display:flex;flex-direction:column;justify-content:center;padding:2rem 1.5rem;background:linear-gradient(160deg,#0f1c33,#1a2b4a);min-height:100vh}
  .login .logo{display:flex;align-items:center;gap:.6rem;margin-bottom:2rem;justify-content:center}
  .login .lg{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--primary),#5b8dff);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:.8rem}
  .login .nm{font-weight:800;font-size:1.5rem;color:#fff}.login .nm span{color:var(--accent)}
  .login .card{background:var(--surface);border-radius:18px;padding:1.6rem}
  .login h2{font-size:1.15rem;margin-bottom:.3rem}.login .sub{color:var(--muted);font-size:.85rem;margin-bottom:1.2rem}
  .fld{margin-bottom:.9rem}
  .fld label{display:block;font-size:.78rem;font-weight:600;color:var(--muted);margin-bottom:.3rem}
  .fld input,.fld select,.fld textarea{width:100%;padding:.8rem .9rem;border:1px solid var(--line);border-radius:12px;font-size:1rem;outline:none;background:var(--field);color:var(--ink)}
  .fld input:focus,.fld select:focus{border-color:var(--primary)}
  /* ►► FIELD1-C — câmpurile din AFARA unui `.fld` (rândurile de prezență din „Echipa mea")
     primeau doar regula-plasă de la :46: fundalul corect, dar zero padding și font 13px ⇒
     20px înălțime, imposibil de atins cu mănuși pe șantier. `.tdf` le dă aceleași metrici ca
     `.fld`, fără să depindă de gazdă. */
  .tdf{padding:.7rem .6rem;border:1px solid var(--line);border-radius:12px;font-size:1rem;
       outline:none;background:var(--field);color:var(--ink);min-height:44px}
  .tdf:focus{border-color:var(--primary)}
  .btn{width:100%;background:var(--primary);color:#fff;border:none;padding:.95rem;border-radius:12px;font-weight:700;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:.4rem}
  .btn:active{transform:scale(.99)}.btn:disabled{opacity:.6}
  /* ── Reacție rapidă: anti-întârziere tap pe mobil + feedback instant ── */
  button,a,select,input,textarea,label,[onclick]{touch-action:manipulation}
  button,.btn,.mini-btn,.bottom button,[onclick]{-webkit-tap-highlight-color:rgba(47,107,255,.10)}
  .mini-btn,.bottom button{transition:transform .06s ease,opacity .12s ease}
  .mini-btn:active,.bottom button:active{transform:scale(.95)}
  .card[onclick]:active{opacity:.75}
  .btn-soft{background:var(--blue-soft);color:var(--link)}
  .btn-line{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
  .msg{padding:.7rem .9rem;border-radius:10px;font-size:.82rem;margin-bottom:.8rem}
  .msg.err{background:var(--red-soft);color:var(--red-ink)}.msg.ok{background:var(--green-soft);color:var(--green-ink)}
  .login .alt{margin-top:1rem;text-align:center;font-size:.85rem;color:var(--muted)}
  .login .alt a{color:var(--link);font-weight:600;cursor:pointer}
  .cfg-warn{background:var(--amber-soft);color:var(--amber-ink);padding:.7rem .9rem;border-radius:10px;font-size:.78rem;margin-bottom:1rem}

  /* APP HEADER */
  .top{background:var(--surface);padding:1rem 1.1rem;display:flex;align-items:center;gap:.7rem;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
  .av{width:42px;height:42px;border-radius:12px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1rem;flex-shrink:0}
  .who{flex:1;min-width:0}
  .who .n{font-weight:700;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .who .r{font-size:.76rem;color:var(--muted)}
  .top .out{background:none;border:1px solid var(--line);border-radius:10px;padding:.45rem .7rem;font-size:.78rem;font-weight:600;color:var(--muted);cursor:pointer}

  /* role switch */
  .roles{display:flex;gap:.4rem;padding:.7rem 1.1rem;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto}
  .roles button{flex:1;white-space:nowrap;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:.5rem .6rem;font-size:.82rem;font-weight:600;color:var(--muted);cursor:pointer}
  .roles button.on{background:var(--primary);color:#fff;border-color:var(--primary)}

  /* SCREEN */
  .screen{flex:1;padding:1rem 1.1rem 5.5rem;overflow-y:auto;overscroll-behavior-y:contain}
  @keyframes ptrspin{to{transform:rotate(360deg)}}
  .scr-title{font-size:1.05rem;font-weight:800;margin:.2rem 0 1rem}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1rem;margin-bottom:.8rem}
  .card .t{font-weight:700;font-size:.98rem}
  .card .s{color:var(--muted);font-size:.82rem;margin-top:.15rem}
  .row{display:flex;align-items:center;gap:.7rem}
  .row .grow{flex:1;min-width:0}
  .pill{display:inline-block;padding:.16rem .55rem;border-radius:20px;font-size:.72rem;font-weight:600}
  .pill.green{background:var(--green-soft);color:var(--green-ink)}.pill.blue{background:var(--blue-soft);color:var(--blue-ink)}
  .pill.amber{background:var(--amber-soft);color:var(--amber-ink)}.pill.red{background:var(--red-soft);color:var(--red-ink)}.pill.grey{background:var(--chip);color:var(--chip-ink)}
  .prog{height:8px;background:var(--line);border-radius:10px;overflow:hidden;margin-top:.6rem}
  .prog span{display:block;height:100%;background:var(--green)}
  .empty{text-align:center;color:var(--muted);padding:2.5rem 1rem}.empty .ei{font-size:2.2rem;margin-bottom:.5rem}
  .loading{text-align:center;color:var(--muted);padding:2rem}
  .mini-btn{border:none;border-radius:10px;padding:.55rem .8rem;font-weight:700;font-size:.82rem;cursor:pointer}
  .mini-btn.go{background:var(--green);color:#fff}.mini-btn.pr{background:var(--primary);color:#fff}.mini-btn.gh{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
  /* FLEET2-B: „Trimite locația" e acțiunea PRINCIPALĂ de teren a cardului „Vehiculul meu" —
     se apasă din mașină, uneori cu mănuși. `.mini-btn` global rămâne la 35 px (îl folosește tot
     mobilul, iar schimbarea lui ar fi o modificare de primitivă); mărim DOAR aici, la 44 px. */
  #myveh-block .mini-btn{min-height:44px}

  /* KB#109 — comutatorul de aspect din „Profilul meu". Ținta de atingere e 44px:
     se apasă cu degetul, uneori cu mănuși, ca restul suprafeței de teren. */
  .thm-seg{display:flex;gap:.4rem}
  .thm-seg button{flex:1;min-height:44px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:.6rem .5rem;font-size:.85rem;font-weight:600;color:var(--muted);cursor:pointer}
  .thm-seg button.on{background:var(--primary);color:#fff;border-color:var(--primary)}

  /* BOTTOM NAV */
  .bottom{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;max-width:460px;margin:0 auto;z-index:20}
  .bottom button{flex:1;background:none;border:none;padding:.6rem 0 .75rem;display:flex;flex-direction:column;align-items:center;gap:.2rem;color:var(--muted);font-size:.68rem;font-weight:600;cursor:pointer}
  .bottom button .bi{font-size:1.3rem}
  .bottom button.on{color:var(--link)}

  /* SHEET (bottom modal) */
  .sheet-bg{position:fixed;inset:0;background:var(--sheet-scrim);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:bgIn .2s ease}
  .sheet{background:var(--surface);border-radius:20px 20px 0 0;width:100%;max-width:460px;padding:1.2rem 1.1rem calc(1.2rem + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;animation:sheetUp .26s cubic-bezier(.2,.8,.2,1)}
  .sheet-bg.closing{animation:bgOut .22s ease forwards}
  .sheet-bg.closing .sheet{animation:sheetDown .24s cubic-bezier(.4,0,1,1) forwards}
  @keyframes bgIn{from{opacity:0}to{opacity:1}} @keyframes bgOut{from{opacity:1}to{opacity:0}}
  @keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}} @keyframes sheetDown{from{transform:translateY(0)}to{transform:translateY(100%)}}
  @keyframes screenIn{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:translateX(0)}}
  @keyframes slideBack{from{opacity:.25;transform:translateX(-32%)}to{opacity:1;transform:translateX(0)}}
  @media (prefers-reduced-motion:reduce){ .sheet-bg,.sheet,.sheet-bg.closing,.sheet-bg.closing .sheet{animation:none!important} }
  .sheet h3{font-size:1.05rem;margin-bottom:1rem;display:flex;justify-content:space-between;align-items:center}
  .sheet h3 .x{background:none;border:none;font-size:1.4rem;color:var(--muted)}

  .chat-list{display:flex;flex-direction:column;gap:.5rem;padding-bottom:.5rem}
  .bub{max-width:80%;padding:.55rem .8rem;border-radius:14px;font-size:.9rem;line-height:1.35}
  .bub .bn{font-size:.72rem;font-weight:700;color:var(--link);margin-bottom:.15rem}
  .bub.them{background:var(--surface);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
  .bub.me{background:var(--primary);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
  .bub .bt{font-size:.65rem;opacity:.6;margin-top:.2rem;text-align:right}
  .chat-bar{display:flex;gap:.5rem;position:sticky;bottom:0;background:var(--bg);padding:.6rem 0 .2rem}
  .chat-bar input{flex:1;padding:.8rem .9rem;border:1px solid var(--line);border-radius:14px;font-size:1rem;outline:none;background:var(--field);color:var(--ink)}
  #chat-rec{transition:background .15s}
  #chat-rec.rec{background:var(--red)!important;color:#fff;animation:recpulse 1s infinite}
  @keyframes recpulse{0%,100%{opacity:1}50%{opacity:.65}}
  .bub audio{display:block;margin-top:.35rem;width:210px;max-width:62vw;height:40px}
  .bub.me audio{filter:invert(0)}
  #toast{position:fixed;bottom:5rem;left:50%;transform:translateX(-50%) translateY(10px);background:var(--toast-bg);color:var(--toast-ink);padding:.8rem 1.1rem;border-radius:12px;font-size:.85rem;opacity:0;transition:all .25s;z-index:60;max-width:90%;text-align:center;pointer-events:none}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://vzatmfhkwiojqkowtftg.supabase.co';
const SUPABASE_KEY='sb_publishable_wNj9S8eta39n1Gkq_g-gfA_idl_pbPy';
let sb=null; const S={ session:null, tenant:null, role:null, view:'acasa' };
const APP_BUILD='350';
function cfgOk(){ return SUPABASE_URL.startsWith('http')&&SUPABASE_KEY.startsWith('sb_'); }
function $(id){return document.getElementById(id);}
/* ►► SCOPING PE FIRMA ACTIVĂ (RC1-E2E). RLS lasă un membru să citească rândurile TUTUROR
   firmelor în care e membru; premisa „un utilizator = o singură firmă" nu e impusă nicăieri.
   Măsurat: „Șantierele tale" lista șantierele altei firme. `S.tenant` null ⇒ zero rânduri,
   adică eșec în siguranță, nu scurgere. */
function mSel(tbl, cols){ return sb.from(tbl).select(cols).eq('tenant_id', S.tenant); }
/* ►► FIELD1 / D91 — fișa PROPRIE vine din contractul de context, niciodată din `employees`.
   Din 0173 tabela e OFFICE-only; un `select` de aici ar întoarce zero rânduri, tăcut. */
function mEmp(){ return (S.ctx && S.ctx.employee) || null; }
/* ►► FIELD1 / D87 — numele colegilor: `field_roster`, cu coloanele enumerate pe server.
   Cache pe sesiune: cele două suprafețe care-l cer (pontajul, selectorul „mută la angajat")
   se deschid des, iar lista se schimbă rar. `mRosterWipe()` îl golește la delogare. */
async function mRoster(force){
  if(!force && S._roster) return S._roster;
  try{ const r=await sb.rpc('field_roster',{p_tenant_id:S.tenant});
       S._roster = (r && !r.error && Array.isArray(r.data)) ? r.data : []; }
  catch(e){ S._roster=[]; }
  return S._roster;
}
function mTeamWipe(){ S._td=null; S._tdEdit={}; S._tdTeam=null; S._tdDate=null; }
function mRosterWipe(){ S._roster=null; }
/* ►► Chei locale legate de IDENTITATE (telefon partajat): namespaced pe utilizator+firmă.
   `c373_install_dismiss` și `c373_mv_mode` rămân globale DELIBERAT — sunt preferințe de
   DISPOZITIV („nu-mi mai arăta bannerul de instalare", „ultimul mod de scanare"), nu stare
   de cont; al doilea utilizator al telefonului n-ar moșteni nimic despre primul prin ele. */
function mLKey(base){
  const u=(S.session&&S.session.user&&S.session.user.id)||'anon';
  return base+':'+u+':'+(S.tenant||'-');
}
/* ►► KB#109 / D97 — TEMA ÎNTUNECATĂ. NU e un al doilea sistem de aspect: e
   EXACT autoritatea biroului. `app.html` ține preferința în
   `localStorage['c373_prefs:<user-id>']`, câmpul `theme` ∈ {light,dark}, și o
   aplică prin `body.theme-dark` (`applyPrefs`). Terenul citește ȘI SCRIE aceeași
   cheie ⇒ comutatorul de pe telefon schimbă și biroul aceluiași utilizator.
   Înainte de autentificare se cade pe cheia GLOBALĂ `c373_prefs`, identic cu
   `czKey()` din birou. Biroul n-are opțiune „system" (zero `prefers-color-scheme`
   în tot `app.html`), deci nici terenul n-o primește. */
function mThemeKey(){ const u=(S.session&&S.session.user&&S.session.user.id)||''; return u?('c373_prefs:'+u):'c373_prefs'; }
function mThemePrefs(){ try{ return JSON.parse(localStorage.getItem(mThemeKey())||'{}')||{}; }catch(e){ return {}; } }
function mTheme(){ return mThemePrefs().theme==='dark'?'dark':'light'; }
function mApplyTheme(){ try{ document.body.classList.toggle('theme-dark', mTheme()==='dark'); }catch(e){} }
function mSetTheme(v){
  const k=mThemeKey(); let p={};
  try{ p=JSON.parse(localStorage.getItem(k)||'{}')||{}; }catch(e){}
  p.theme=(v==='dark')?'dark':'light';
  try{ localStorage.setItem(k,JSON.stringify(p)); }catch(e){}
  mApplyTheme();
  /* actualizăm butoanele pe loc: o redeschidere a foii ar mai face o cerere de rețea
     pentru profil și ar arunca poziția de derulare. */
  try{ document.querySelectorAll('.thm-seg button').forEach(function(b){
    const on=(b.getAttribute('data-thm')===p.theme);
    b.classList.toggle('on',on); b.setAttribute('aria-pressed',on?'true':'false');
  }); }catch(e){}

/* ►► FIELD1-C / D-2 — aritmetică pe ZIUA CIVILĂ, independentă de fusul aparatului.
   `new Date('2026-08-20T00:00:00')` construiește miezul nopții LOCAL, iar `toISOString()` se
   întoarce în UTC: la est de Greenwich se pierde o zi. Măsurat pe 2026-08-20 — „ziua următoare"
   ieșea 2026-08-20 (aceeași) și „ziua precedentă" 2026-08-18 (două în urmă) la Chișinău,
   București ȘI Berlin, adică pe toată piața. Sub UTC ieșea corect, de aceea o măsurătoare pe un
   laptop la Greenwich ar fi dat verde.
   Aici nu există niciun moment de timp: `Date.UTC` e folosit ca un simplu calendar gregorian,
   deci nu poate exista nici deriva de fus, nici saltul de la ora de vară — o zi civilă are
   întotdeauna exact o zi civilă înainte și una după, chiar dacă are 23 sau 25 de ore.
   Ziua FIRMEI vine de la server (`app.tz_local_date`) sau din `mToday()`; funcția asta doar
   se plimbă pe calendar de la ea. */
function mDayAdd(iso, n){
  const p=String(iso||'').slice(0,10).split('-');
  if(p.length!==3) return '';
  const y=+p[0], m=+p[1], d=+p[2];
  if(!(y>0&&m>=1&&m<=12&&d>=1&&d<=31)) return '';
  const t=new Date(Date.UTC(y, m-1, d));
  t.setUTCDate(t.getUTCDate()+(+n||0));
  return t.toISOString().slice(0,10);
}
/* Afișarea unei zile CIVILE. `fmtDT` e pentru momente de timp și le mută în fusul firmei; o zi
   civilă e deja în fusul firmei, deci o a doua conversie ar deplasa-o. `timeZone:'UTC'` aici nu
   înseamnă „arată în UTC", ci „nu reinterpreta componentele" — ele sunt deja cele corecte. */
function mFmtDay(iso){
  const s=String(iso||'').slice(0,10); const p=s.split('-'); if(p.length!==3) return s;
  try{
    return new Intl.DateTimeFormat((window.C373lang&&C373lang())||'ro', {timeZone:'UTC',
      weekday:'short', day:'2-digit', month:'2-digit', year:'numeric'})
      .format(new Date(Date.UTC(+p[0], +p[1]-1, +p[2])));
  }catch(e){ return p[2]+'.'+p[1]+'.'+p[0]; }
}

  const start=e=>{ drawing=true; const xy=pos(e); ctx.beginPath(); ctx.moveTo(xy[0],xy[1]); e.preventDefault(); };

/* ════ F6 — NAVIGAREA INTERNĂ: butonul „înapoi" rămâne ÎN aplicație ════════════
   `mobil.html` n-avea nicio intrare de istoric: pe Android, „înapoi" ieșea din PWA de pe
   ORICE ecran, iar munca începută se pierdea. Nu introducem un router de bibliotecă — avem
   deja o singură variabilă de rută (`S.view`) și un singur punct de randare (`render()`),
   deci ne trebuie doar oglindirea lor în `history`.

   Contractul (§19):
     · rădăcina e `replaceState` — o singură intrare, deci „înapoi" de pe ecranul de start
       iese din aplicație, cum se așteaptă utilizatorul;
     · orice navigare ULTERIOARĂ e `pushState`, cu ecranul și contextul minim;
     · `popstate` REDESENEAZĂ, nu împinge (`_mhLock` taie recursivitatea);
     · reîncărcarea reconstruiește o rădăcină validă — `history.state` supraviețuiește unui
       refresh, iar o adâncime moștenită ar minți despre câte ecrane sunt în spate.

   Contextul salvat e MINIM și intenționat: șantierul ales, săptămâna din Program, persona.
   Nu serializăm tot `S` — o intrare de istoric nu e un instantaneu al aplicației. */

function mHistInit(){
  S._mhDepth=0;

}
function mHistPush(extra){
  try{ S._mhDepth=(S._mhDepth||0)+1;
       history.pushState(Object.assign({[MH]:S._mhDepth, view:S.view, ctx:mHistCtx()}, extra||{}),''); }catch(e){}
}
/* Ecranele care își setează singure `S.view` (chat, taskuri, scanare) trec pe aici, ca să nu
   existe o a doua cale de navigare care ocolește istoricul. Garda pe `S.view!==v` face apelul
   inofensiv când `render()` a setat deja ruta. */

       s-a stricat. Cădem pe restaurarea ecranului, care e corectă în ambele cazuri. */
    if(st.ctx){
      if(st.ctx.site!=null) S.psite=st.ctx.site;
      if(st.ctx.week!=null) S.progWeek=st.ctx.week;
      if(st.ctx.role && st.ctx.role!==S.role && !mHistLockedRole()){
        S.role=st.ctx.role;

/* ── Gest „înapoi": clisezi cu degetul spre dreapta din marginea stângă (ca pe Instagram) → închide foaia deschisă sau revii la Acasă ── */
function swipeBack(){
  const sm=$('sheet-mount'); if(sm && sm.firstChild){ closeSheet(); return true; }
  /* F6 — gestul înseamnă acum „un pas înapoi în istoric", nu „sari la Acasă": pe un parcurs
     Acasă → Program → pas de lucru, saltul direct pierdea contextul intermediar. */
  if(typeof S!=='undefined' && S.view && S.view!=='acasa'){
    window._navBack=true;
    if((S._mhDepth||0)>0){ history.back(); } else { goV('acasa'); }
    return true; }
  return false;
}
/* Paginare între tab-urile de jos (ca pe Instagram): glisezi stânga = următorul, dreapta = anteriorul.
   Ecranul urmărește degetul. Dacă o foaie e deschisă → swipe dreapta o închide. */
(function(){
  let sx=0,sy=0,st=0,mode=null,atTop=false;  // 'page' | 'sheet' | 'pull'
  const scr=function(){ return document.getElementById('screen'); };
  const sheetOpen=function(){ const sm=document.getElementById('sheet-mount'); return !!(sm&&sm.firstElementChild); };
  const navList=function(){ try{ return (NAV[S.role]||NAV.worker)||[]; }catch(e){ return []; } };
  function reset(){ const el=scr(); if(el){ el.style.transition=''; el.style.transform=''; el.style.opacity=''; } }
  /* ── indicator pull-to-refresh ── */
  function ptrEl(){ let p=document.getElementById('ptr'); if(!p){ p=document.createElement('div'); p.id='ptr'; p.style.cssText='position:fixed;top:8px;left:50%;z-index:70;width:38px;height:38px;border-radius:50%;background:var(--surface);box-shadow:0 4px 16px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;font-size:1.15rem;color:#2f6bff;opacity:0;transform:translateX(-50%) translateY(-50px);pointer-events:none'; p.innerHTML='<span id="ptr-ic">↓</span>'; document.body.appendChild(p); } return p; }
  function ptrShow(pull){ const p=ptrEl(); const y=Math.min(pull,80)-50; p.style.transition='none'; p.style.opacity=String(Math.min(1,pull/64)); p.style.transform='translateX(-50%) translateY('+y+'px)'; const ic=document.getElementById('ptr-ic'); if(ic){ ic.style.animation=''; ic.textContent = pull>=64?'↻':'↓'; } }
  function ptrSpin(){ const p=ptrEl(); p.style.transition='transform .2s ease,opacity .2s ease'; p.style.opacity='1'; p.style.transform='translateX(-50%) translateY(14px)'; const ic=document.getElementById('ptr-ic'); if(ic){ ic.textContent='⟳'; ic.style.display='inline-block'; ic.style.animation='ptrspin .7s linear infinite'; } }
  function ptrHide(){ const p=document.getElementById('ptr'); if(p){ p.style.transition='transform .2s ease,opacity .2s ease'; p.style.opacity='0'; p.style.transform='translateX(-50%) translateY(-50px)'; const ic=document.getElementById('ptr-ic'); if(ic) ic.style.animation=''; } }
  function doRefresh(){
    try{ if(navigator.serviceWorker&&navigator.serviceWorker.getRegistration){ navigator.serviceWorker.getRegistration().then(function(r){ try{ r&&r.update&&r.update(); }catch(e){} }).catch(function(){}); } }catch(e){}
    setTimeout(function(){ try{ render(); }catch(e){} ptrHide(); const el=scr(); if(el){ el.style.transition='transform .25s ease'; el.style.transform='translateY(0)'; setTimeout(reset,260); } }, 480);
  }
  document.addEventListener('touchstart',function(e){
    mode=null; if(!e.touches||e.touches.length!==1) return;
    const t=e.touches[0]; sx=t.clientX; sy=t.clientY; st=Date.now();
    const lb=document.getElementById('img-lb'); if(lb&&lb.style.display!=='none') return;
    /* Camera de scanare acoperă tot ecranul la nivel de BODY, deci gesturile de aici o
       ignorau complet: o tragere în jos peste ea pornea pull-to-refresh, iar `doRefresh`
       cheamă `render()` DIRECT (nu `goV()`), deci NU oprea stream-ul — pagina se redesena
       sub o cameră încă pornită, cu callback-ul vechi viu. În modul „Mută mai multe"
       camera stă deschisă zeci de secunde, deci fereastra devenea uriașă. (SCAN1-B.1) */
    if(document.getElementById('mv-cam')) return;
    if(/^(INPUT|TEXTAREA|SELECT)$/.test((e.target&&e.target.tagName)||'')) return;  // nu fura din câmpuri
    const el0=scr(); atTop = !!(el0 && el0.scrollTop<=0);
    mode = sheetOpen() ? 'sheet' : 'page';
  },{passive:true});
  document.addEventListener('touchmove',function(e){
    if(!e.touches||e.touches.length!==1) return;
    if(mode!=='page'&&mode!=='pull') return;
    const t=e.touches[0], dx=t.clientX-sx, dy=t.clientY-sy;
    if(mode==='page'){
      if(Math.abs(dx)<10 && Math.abs(dy)<10) return;
      if(Math.abs(dx)<Math.abs(dy)){   // gest vertical
        if(dy>0 && atTop && !sheetOpen()){ mode='pull'; }   // tras în jos de sus → refresh
        else { mode=null; reset(); return; }                // altfel: scroll nativ
      } else {
        const el=scr(); if(el){ el.style.transition='none'; el.style.transform='translateX('+(dx*0.85)+'px)'; el.style.opacity=String(Math.max(.55,1-Math.abs(dx)/((window.innerWidth||360)*1.4))); }
        return;
      }
    }
    if(mode==='pull'){
      const pull=Math.max(0, Math.min(120, dy*0.5));
      const el=scr(); if(el){ el.style.transition='none'; el.style.transform='translateY('+pull+'px)'; }
      ptrShow(pull);
    }
  },{passive:true});
  document.addEventListener('touchend',function(e){
    const t=(e.changedTouches&&e.changedTouches[0]), dx=t?t.clientX-sx:0, dy=t?t.clientY-sy:0, dt=Date.now()-st;
    if(mode==='pull'){ const el=scr(); const pull=Math.max(0, Math.min(120, dy*0.5));
      if(pull>=64){ ptrSpin(); if(el){ el.style.transition='transform .2s ease'; el.style.transform='translateY(46px)'; } doRefresh(); }
      else { ptrHide(); if(el){ el.style.transition='transform .2s ease'; el.style.transform='translateY(0)'; setTimeout(reset,220); } }
      mode=null; return;
    }
    if(mode==='page'){ const el=scr(), vw=window.innerWidth||360;
      const horiz=Math.abs(dx)>Math.abs(dy)*1.4;
      const pass=horiz && (Math.abs(dx)>vw*0.25 || (Math.abs(dx)>55 && dt<320));
      if(pass){ const list=navList(); let i=-1; for(let k=0;k<list.length;k++){ if(list[k][0]===S.view){ i=k; break; } }
        let target=null; if(dx<0 && i>-1 && i<list.length-1) target=list[i+1][0]; else if(dx>0 && i>0) target=list[i-1][0];
        if(target && el){ window._navBack=(dx>0); el.style.transition='transform .15s ease,opacity .15s ease'; el.style.transform='translateX('+(dx<0?'-100%':'100%')+')'; el.style.opacity='0'; setTimeout(function(){ reset(); goV(target); },140); mode=null; return; } }
      if(el){ el.style.transition='transform .2s ease,opacity .2s ease'; el.style.transform='translateX(0)'; el.style.opacity='1'; setTimeout(reset,220); }
    } else if(mode==='sheet'){ if(dx>55 && Math.abs(dy)<70 && dx>Math.abs(dy)*1.4 && dt<800) closeSheet(); }
    mode=null;
  },{passive:true});
})();

/* CLIENT — Oferte (devize) */
async function scrClientOferte(){
  $('screen').innerHTML='<div class="scr-title">📄 Ofertele mele</div><div id="co"><div class="loading">Se încarcă…</div></div>';
  /* ►► D65 — contract self-scoped, nu citire directă pe `estimates`.
     Înainte: se citea TOATĂ tabela și se filtra în JavaScript după șantier. Măsurat cu
     JWT real de client: 23 de oferte vizibile din care 1 a lui, 42 de facturi din care 0.
     Filtrarea în client NU e securitate. În plus, filtrul pe șantier era și funcțional
     greșit: `site_id` se completează la ACCEPTARE, deci prima ofertă a unui client nou
     nu putea fi văzută niciodată — 22 din 23 de oferte reale n-au șantier. */
  const {data,error}=await sb.rpc('my_client_offers');
  if(error){ $('co').innerHTML='<div class="empty"><div class="ei">⚠️</div>Nu am putut încărca ofertele.</div>'; return; }
  const mine=(data||[]);
  if(!mine.length){ $('co').innerHTML='<div class="empty"><div class="ei">📄</div>Nu ai oferte încă.</div>'; return; }
  const st={draft:['Ciornă','grey'],sent:['Primită','blue'],accepted:['Acceptată','green'],rejected:['Respinsă','red']};
  $('co').innerHTML=mine.map(e=>{ const s=st[e.status]||['—','grey'];
    return '<div class="card"><div class="row"><div class="grow"><div class="t">Ofertă '+esc(e.number||'—')+'</div><div class="s">'+(e.valid_until?'Valabilă până '+esc(e.valid_until):'')+'</div></div><span class="pill '+s[1]+'">'+s[0]+'</span></div><div class="row" style="margin-top:.5rem"><div class="grow s">Total</div><b>'+money(e.total)+'</b></div>'
    +(e.status==='sent'?'<div class="row" style="gap:.5rem;margin-top:.6rem"><button class="mini-btn go" onclick="respondOferta(\''+e.id+'\',\'accepted\',\''+(e.updated_at||'')+'\')">Accept</button><button class="mini-btn gh" onclick="respondOferta(\''+e.id+'\',\'rejected\',\''+(e.updated_at||'')+'\')">Refuz</button></div>':'')
    +'</div>'; }).join('');
}
/* ►► FIN2 — BUTONUL NU MAI MINTE.
   Înainte: `sb.from('estimates').update({status})` + verificare DOAR pe `error`.
   Scrierea pe `estimates` e OFFICE (0019); contul de client nu e OFFICE, deci RLS
   bloca UPDATE-ul, care întorcea **0 rânduri fără eroare**. Butonul anunța
   „Ofertă acceptată" și nu se schimba absolut nimic.
   Acum trece prin `estimate_client_respond` (0161): contract îngust, self-scoped,
   care verifică proprietatea prin `clients.user_id`, membership-ul activ, CAS-ul și
   faptul că oferta e chiar „trimisă". Orice refuz ajunge la utilizator ca refuz. */
const RESP_ERR={
  DOC_NOT_FOUND:'Oferta nu mai e disponibilă pentru contul tău.',
  DOC_CONFLICT:'Oferta s-a schimbat între timp. Reîncarcă lista și încearcă din nou.',
  ESTIMATE_NOT_OPEN:'Ai răspuns deja la această ofertă.',
  STATUS_INVALID:'Acțiune necunoscută.',
  CLIENT_FORBIDDEN:'Trebuie să fii autentificat.'
};
async function respondOferta(id,status,upd){
  const {data,error}=await sb.rpc('estimate_client_respond',
    {p_estimate_id:id, p_action:status, p_expected_updated_at:upd||null});
  if(error){
    const code=String(error.message||'').split(':')[0].trim();
    toast('⛔ '+(RESP_ERR[code]||error.message)); scrClientOferte(); return;
  }
  if(data && data.noop){ toast('Oferta era deja în această stare.'); scrClientOferte(); return; }
  toast(status==='accepted'?'✅ Ofertă acceptată.':'Ofertă refuzată.'); scrClientOferte();
}

async function payInvoiceSheet(id,number,total){
  /* SEC-CLIENT-PAYMENT1 — contract invoice-scoped (0187), NU SELECT direct pe `bank_accounts`.
     Vechiul cod lua `ba[0]` dintr-un select FĂRĂ `order by`, dintr-o tabelă internă de trezorerie
     (care are și `balance`), deci putea arăta un IBAN care NU e cel de pe factura clientului.
     Acum datele vin din `invoices.bank_choice` + lista bancară PUBLICATĂ a firmei, cu aceeași
     semantică ca factura/PDF: `__off` ⇒ niciun cont, id explicit ⇒ acel cont, gol ⇒ toate. */
  let accs=[];
  try{ const {data}=await sb.rpc('my_client_invoice_bank',{p_invoice_id:id}); accs=data||[]; }catch(e){ accs=[]; }
  const bankBlock=a=>a.legacy?esc(a.legacy)
    :[a.bank?'<b>'+esc(a.bank)+'</b>':'', a.iban?'<span style="font-family:monospace">'+esc(a.iban)+'</span>':'',
      a.swift?'<b>SWIFT/BIC:</b> '+esc(a.swift):'', a.note?esc(a.note):''].filter(Boolean).join('<br>');
  openSheet('Plată factura '+number,
    '<div id="pay-msg"></div>'
    +'<div class="card" style="margin:0 0 1rem;text-align:center"><div class="s">Sumă de plată</div><div style="font-size:1.8rem;font-weight:800;margin-top:.2rem">'+money(total)+'</div></div>'
    +(accs.length?'<div class="card" style="margin:0 0 1rem"><div class="s">'+esc(mt('Transfer bancar către'))+'</div>'
        +accs.map(a=>'<div style="margin-top:.3rem">'+bankBlock(a)+'</div>').join('')+'</div>':'')
    /* KB#48A: butonul „Plătește online" chema `pay_invoice`, care marca factura
       plătită și insera în `bank_transactions` totalul integral — la apăsarea
       CLIENTULUI, fără sumă și fără registru. Toate cele 5 încasări istorice
       „Plată online (demo)" vin de aici. O confirmare a plătitorului nu e o
       plată: încasarea se înregistrează de firmă, prin registrul canonic. */
    +'<p style="font-size:.78rem;color:var(--muted);margin-top:.8rem">Achită prin transfer bancar folosind datele de mai sus. Plata online cu cardul se activează la lansare. După încasare, firma o înregistrează în sistem.</p>');
}

   contract — poarta e pe server, nu în bara de jos. */
function mFinPill(st,overdue){
  if(overdue) return '<span class="pill red">⚠ '+esc(mt('Restantă'))+'</span>';
  if(st==='paid')    return '<span class="pill green">✓ '+esc(mt('Încasată'))+'</span>';
  if(st==='partial') return '<span class="pill amber">◐ '+esc(mt('Parțial'))+'</span>';
  return '<span class="pill grey">○ '+esc(mt('Neîncasată'))+'</span>';
}
/* Mesaje de eroare PROFESIONALE: codul brut (42501, PGRST…) rămâne în consolă, nu pe ecran. */
function mErrMsg(e){
  const m=((e&&(e.message||e.msg))||e||'').toString();
  try{ console.warn('[cod373]', m); }catch(_e){}
  if(!navigator.onLine||/load failed|failed to fetch|networkerror|timeout|aborted/i.test(m))
    return mt('📴 Fără internet. Reconectează-te și încearcă din nou.');
  if(/42501|permission denied|FORBIDDEN|not authorized/i.test(m))
    return mt('Nu ai acces la această informație. Vorbește cu biroul.');
  if(/PGRST|schema cache|does not exist/i.test(m))
    return mt('Această funcție nu este disponibilă momentan.');
  return mt('Ceva nu a mers. Încearcă din nou.');
}
async function mFinStates(force){
  if(!force && S._finSt) return S._finSt;
  const r=await sb.rpc('invoice_payment_states',{p_tenant_id:S.tenant});
  if(r.error) throw r.error;
  const m={}; (r.data||[]).forEach(x=>{ m[x.invoice_id]=x; });
  S._finSt=m; return m;
}
function mFinSummary(states){
  const out={overdue:0,overdueSum:0,openN:0,openSum:0,paidN:0};
  Object.keys(states).forEach(k=>{ const x=states[k];
    const out_=Number(x.outstanding||0);
    if(x.overdue){ out.overdue++; out.overdueSum+=out_; }
    if(x.pay_state==='paid') out.paidN++; else { out.openN++; out.openSum+=out_; }
  });
  return out;
}

    a.push(B('gh',"scrTaskuri()",'✅','Taskuri'));
    a.push(B('gh','openChat()','💬','Chat'));
    return a.join(' ');
  }
  /* conducere (owner/admin/manager, sau contabil aflat în vederea de responsabil) */
  if(mIsLead()) a.push(B('pr',"goV('echipa')",'👷','Echipa mea'));

/* PROGRAMUL SĂPTĂMÂNII (Bauprogramm) — pașii de lucru planificați în săptămână, per șantier */
function weekRange(offset){ const d=new Date(); d.setHours(0,0,0,0); const dow=(d.getDay()+6)%7; const mon=new Date(d); mon.setDate(d.getDate()-dow+(offset||0)*7); const sun=new Date(mon); sun.setDate(mon.getDate()+6); const iso=x=>x.toISOString().slice(0,10); return {start:mon,end:sun,startStr:iso(mon),endStr:iso(sun)}; }
async function scrProgram(){
  $('screen').innerHTML='<div class="loading">Se încarcă…</div>';
  S.progWeek=S.progWeek||0; const wk=weekRange(S.progWeek);
  const fd=d=>{ const p=String(d).slice(0,10).split('-'); return p[2]+'.'+p[1]; };
  const isMgr=['manager','owner','admin'].includes(S.role);
  const {data:allSites}=await mSel('sites','id,name,address,status'); S.sites=allSites||[];
  const siteName={}; (allSites||[]).forEach(s=>siteName[s.id]=s.name);
  let siteIds=(allSites||[]).filter(s=>s.status!=='cancelled').map(s=>s.id);
  const myEmp=S.emp;
  const plannedDays={};
  if(!isMgr){
    const mine=new Set();
    if(myEmp){ try{ const cp=await sb.from('crew_plan').select('site_id,plan_date').eq('employee_id',myEmp).gte('plan_date',wk.startStr).lte('plan_date',wk.endStr); (cp.data||[]).forEach(p=>{ if(p.site_id){ mine.add(p.site_id); (plannedDays[p.site_id]=plannedDays[p.site_id]||[]).push(p.plan_date); } }); }catch(e){} }
    try{ const stm=await sb.from('site_team').select('site_id,user_id'); (stm.data||[]).filter(r=>r.user_id===S.session.user.id).forEach(r=>mine.add(r.site_id)); }catch(e){}
    if(mine.size) siteIds=siteIds.filter(id=>mine.has(id));
  }
  let stages=[];
  if(siteIds.length){ try{ const sr=await sb.from('site_stages').select('*').in('site_id',siteIds).not('start_date','is',null).lte('start_date',wk.endStr).gte('end_date',wk.startStr); stages=sr.data||[]; }catch(e){} }
  S.curStages=stages;
  const bySite={}; stages.forEach(st=>{ (bySite[st.site_id]=bySite[st.site_id]||[]).push(st); });
  const stCol={plan:'grey',active:'blue',done:'green',delayed:'amber'};
  const dowNames=['Du','Lu','Ma','Mi','Jo','Vi','Sâ'];
  let groups='';
  Object.keys(bySite).forEach(sid=>{
    const sts=bySite[sid].slice().sort((a,b)=>(String(a.start_date||'')+(a.position||0)).localeCompare(String(b.start_date||'')+(b.position||0)));
    let pd=''; if(plannedDays[sid]&&plannedDays[sid].length){ const days=[...new Set(plannedDays[sid])].sort().map(d=>dowNames[new Date(d).getDay()]); pd=' <span class="s">· planificat: '+days.join(', ')+'</span>'; }
    groups+='<div class="scr-title" style="font-size:.95rem;margin-top:1rem">🏗️ '+esc(siteName[sid]||'Șantier')+pd+'</div>';
    groups+=sts.map(st=>{ const ind=(st.description?' 📝':'')+((st.photo_urls&&st.photo_urls.length)?' 📷':''); const mine=(myEmp&&st.executor_kind==='angajat'&&st.executor_id===myEmp)?' <span class="pill blue">ție</span>':'';
      return '<div class="card" onclick="openStageMobile(\''+st.id+'\')" style="cursor:pointer;margin:.4rem 0;padding:.7rem"><div class="row"><div class="grow"><b>'+esc(st.name)+'</b><span style="font-size:.85rem">'+ind+'</span>'+mine+'<div class="s">'+fd(st.start_date)+(st.end_date&&st.end_date!==st.start_date?' → '+fd(st.end_date):'')+'</div></div><span class="pill '+(stCol[st.status]||'grey')+'">'+(st.progress||0)+'% ›</span></div></div>'; }).join('');
  });
  if(!stages.length) groups='<div class="empty"><div class="ei">📋</div>Nicio lucrare planificată în această săptămână.</div>';
  const wkLbl=S.progWeek===0?'Această săptămână':(S.progWeek===1?'Săptămâna viitoare':(S.progWeek>0?('peste '+S.progWeek+' săptămâni'):(Math.abs(S.progWeek)+' săpt. în urmă')));
  const navWk='<div class="row" style="gap:.5rem;align-items:center;margin:.4rem 0 .2rem"><button class="mini-btn gh" onclick="S.progWeek=(S.progWeek||0)-1;scrProgram()">‹</button><div class="grow" style="text-align:center"><b>'+fd(wk.startStr)+' – '+fd(wk.endStr)+'</b><div class="s">'+wkLbl+'</div></div><button class="mini-btn gh" onclick="S.progWeek=(S.progWeek||0)+1;scrProgram()">›</button></div>';
  $('screen').innerHTML='<div class="scr-title">📋 Programul săptămânii</div>'+navWk+'<div class="s" style="margin-bottom:.3rem">👉 Apasă o lucrare ca să vezi ce ai de făcut, pozele și materialele.</div>'+groups;
}

    if(data && data.ok!==true) throw new Error(data.message||data.detail||data.error||'Eroare AI');
    const txt=((data&&data.text)||'').trim().replace(/^["„]+|["”]+$/g,''); if(txt) ta.value=txt; else toast('AI nu a returnat text.');

  ta.disabled=false; if(btn){ btn.disabled=false; btn.textContent=o||'✨ AI'; }
}

/* ════ FLEET2-B — „Vehiculul meu": autoritatea custodiei, citită de pe teren ════
   Aici era defectul: `vehicles.driver_id` (coloană din 0003) e MOARTĂ — zero scriitori în tot
   codul și, măsurat pe producție, 0 valori non-NULL. Deci întrebarea „care e mașina mea"
   returna mereu gol, iar șoferul primea ÎNTOTDEAUNA „Nu ai un vehicul atribuit".

   Autoritatea reală e ultimul eveniment din `vehicle_handovers` (FLEET2-A). Dar acea tabelă —
   ca și `vehicle_drivers` — e OFFICE la citire, deci o interogare directă de pe telefon ar
   întoarce tot zero rânduri, doar mai derutant. Răspunsul vine printr-un contract DEFINER care
   spune EXCLUSIV ce ține utilizatorul curent: `my_vehicles()` (0156).

   Cache-ul e per-ecran, nu global: intrarea în Acasă reîntreabă, deci o predare făcută la birou
   se vede fără repornirea aplicației. */
async function mMyVehicles(force){
  if(!force && S._myVeh!==undefined) return S._myVeh;
  let out={rows:[], err:null};
  try{
    const {data,error}=await sb.rpc('my_vehicles',{p_tenant_id:S.tenant});
    if(error) out.err=error; else out.rows=data||[];
  }catch(e){ out.err=e; }
  S._myVeh=out; return out;
}
/* Cardul de pe Acasă. Spune adevărul despre PROVENIENȚĂ: „în custodia ta" (predare
   înregistrată) vs „atribuit" (vehicul vechi, fără istoric) — nu le amestecă. */
async function fillMyVehicle(){
  const host=$('myveh-block'); if(!host) return;
  const mv=await mMyVehicles(true);
  /* KB#90/D62 — cine vede SUPRAFAȚA când nu există niciun vehicul.
     Rolul `driver` păstrează starea goală existentă: pentru el ecranul e despre mașină, iar
     absența ei e o informație. Pentru ceilalți NU desenăm nimic — cardul apare fiindcă AU
     CUSTODIE, nu fiindcă sunt lucrători (§4). `_myVehEver` reține că utilizatorul a avut măcar
     o dată un vehicul în sesiune: altfel o eroare de rețea l-ar lăsa pe cel care CHIAR ține
     mașina fără niciun semn, iar tăcerea la eroare e exact defectul pe care nu-l vrem. */
  const showSurface=(S.role==='driver')||S._myVehEver===true;
  if(mv.err){
    host.innerHTML=showSurface
      ?'<div class="card"><div class="t">🚐 '+esc(mtz('Vehiculul meu'))+'</div><div class="s">'+esc(mtz('Nu am putut verifica ce vehicul ai. Trage în jos pentru reîncercare.'))+'</div></div>'
      :'';
    return;
  }
  const rows=mv.rows||[];
  if(rows.length) S._myVehEver=true;
  if(!rows.length){
    host.innerHTML=showSurface
      ?'<div class="card"><div class="t">🚐 '+esc(mtz('Niciun vehicul în custodie'))+'</div><div class="s">'+esc(mtz('Biroul ți-l predă din fișa mașinii.'))+'</div></div>'
      :'';
    return;
  }
  host.innerHTML='<div class="scr-title" style="font-size:.95rem">'+esc(mtz('Vehiculul meu'))+'</div>'
    +rows.map(function(v){
      const km=(v.km_current!=null)?((+v.km_current).toLocaleString('ro-RO')+' km'):'';
      const src=(v.source==='assignment')?mtz('atribuit (fără predare înregistrată)'):mtz('în custodia ta');
      return '<div class="card"><div class="row"><div class="grow">'
        +'<div class="t">🚐 '+esc(v.label||mtz('Vehicul'))+(v.plate?(' · '+esc(v.plate)):'')+'</div>'
        +'<div class="s">'+esc([km,src].filter(Boolean).join(' · '))+'</div></div></div>'
        +'<div style="margin-top:.6rem;text-align:right"><button class="mini-btn go" onclick="sendLocation(\''+v.vehicle_id+'\')">📍 '+esc(mtz('Trimite locația'))+'</button></div></div>';
    }).join('');
}
/* CUSTODIE — trimite locația GPS. `vid` explicit din card; fără el, se rezolvă din autoritate.
   Rezolvarea se face ÎNAINTE de a cere permisiunea GPS: n-are rost să deranjăm utilizatorul
   pentru o poziție pe care n-avem unde s-o punem.
   KB#90/D62: capabilitatea ține de CUSTODIE, nu de rol — funcția n-a avut niciodată vreo gardă
   de rol, doar butonul care o chema stătea într-o ramură `S.role==='driver'`. */
async function sendLocation(vid){
  if(!navigator.geolocation){ toast('Telefonul nu permite localizarea.'); return; }
  let target=vid;
  if(!target){
    const mv=await mMyVehicles(true);
    if(mv.err){ toast('⚠️ '+mtz('Nu am putut verifica ce vehicul ai. Încearcă din nou.')); return; }
    const rows=mv.rows||[];
    if(!rows.length){ toast(mtz('Nu ai niciun vehicul în custodie. Biroul ți-l predă din fișa mașinii.')); return; }
    /* Mai multe vehicule e o situație LEGITIMĂ (două predări) — nu ghicim care, întrebăm. */
    if(rows.length>1){ toast(mtz('Ai mai multe vehicule. Alege unul din „Vehiculul meu".')); if(S.view==='acasa') fillMyVehicle(); return; }
    target=rows[0].vehicle_id;
  }
  toast('📍 Se obține locația…');
  navigator.geolocation.getCurrentPosition(async pos=>{
    /* ►► D62 — scrierea trece prin CONTRACT self-scoped (0158), nu prin UPDATE direct.
       Motivul e măsurat, nu teoretic: `p_upd` pe `vehicles` e `has_role(tenant_id, STAFF)`
       (0019 prin `app.harden`, relărgită în 0125:129), deci un UPDATE direct e permis oricărui
       membru al personalului pe ORICE vehicul al firmei și pe ORICE coloană — `plate`,
       `km_current`, `itp_until`. Acum că suprafața nu mai e limitată la rolul `driver`, ar fi
       fost exact momentul în care acel model larg s-ar fi operaționalizat. Contractul verifică
       server-side membership + custodie și scrie DOAR poziția. Îngustarea politicii la OFFICE
       e faza 2 (lot separat): live-ul vechi încă scrie direct și nu trebuie rupt. */
    const { error } = await sb.rpc('vehicle_location_report',{
      p_tenant_id:S.tenant, p_vehicle_id:target,
      p_lat:pos.coords.latitude, p_lng:pos.coords.longitude
    });
    if(error){ toast('⚠️ '+esc(mLocErr(error))); return; }
    toast('📍 Locație trimisă. Apari pe harta firmei.');
  }, err=>{ toast('Nu am putut obține locația ('+esc(err.message)+').'); }, {enableHighAccuracy:true,timeout:10000});
}
/* Mesaje umane pentru refuzurile contractului 0158 — utilizatorul află ce s-a întâmplat și ce
   urmează, fără să vadă un cod. Necunoscutele cad pe mesajul serverului. */
function mLocErr(e){
  const m=String((e&&(e.message||e.details))||'');
  if(/LOCATION_NOT_IN_CUSTODY/.test(m)) return mtz('Vehiculul nu mai este în custodia ta. Trage în jos pentru reîmprospătare.');
  if(/LOCATION_FORBIDDEN/.test(m))      return mtz('Nu ai dreptul să trimiți locația pentru acest vehicul.');
  if(/LOCATION_INVALID/.test(m))        return mtz('Coordonatele primite de la telefon nu sunt valide.');
  return m||mtz('Nu am putut trimite locația. Încearcă din nou.');
}

/* ►► KB#112 / D100 — Aici era „butonul care minte" (clasa KB#96).
   Vechiul cod făcea `sb.from('site_stages').update(...)`, iar `site_stages` are scriere
   `{owner,admin,manager}` (0019:75) plus `sub_upd` pentru subcontractant (0025:46). Pentru un
   `worker` sau `driver` UPDATE-ul atingea ZERO rânduri și NU întorcea eroare: garda `if(error)`
   nu se declanșa niciodată, randarea optimistă rămânea pe ecran, iar toast-ul anunța
   „✅ Pas finalizat." peste o scriere care nu se întâmplase. Omul pleca de pe șantier convins
   că a raportat.

   Acum trece prin `site_stage_progress_set` (0174): serverul spune DA sau NU, iar NU-ul se vede.
   Randarea optimistă rămâne — dar se retrage la refuz, fiindcă acum există un refuz. */
const STAGE_MSG={
  STAGE_FORBIDDEN:'⛔ Poți schimba doar etapele de pe șantierul unde echipa ta e planificată azi.',
  STAGE_NOT_FOUND:'Etapa nu mai există.',
  STAGE_CONFLICT:'⚠️ Etapa a fost schimbată între timp. Reîncarcă și încearcă din nou.',
  STAGE_INVALID_STATUS:'Stare invalidă pentru o etapă.',
  STAGE_INVALID_INPUT:'Valoare invalidă.'
};
function mStageMsg(e){ const m=((e&&(e.message||e))||'').toString();
  if(!navigator.onLine||/load failed|failed to fetch|networkerror|network error|timeout|aborted/i.test(m))
    return mt('📴 Fără internet. Reconectează-te și încearcă din nou.');
  const c=Object.keys(STAGE_MSG).find(k=>m.indexOf(k)>=0);
  return c?mt(STAGE_MSG[c]):('Eroare: '+((e&&e.message)||e)); }
async function setStageStatus(stageId,status,progress){
  const st=(S.curStages||[]).find(x=>x.id===stageId);
  const prev=st?{status:st.status,progress:st.progress}:null;
  // optimist: actualizez pe loc + randez instant, salvez în fundal, revin dacă serverul refuză
  if(st){ if(status) st.status=status; if(status==='done') st.progress=100;
          else if(progress!=null) st.progress=progress; }
  openStageMobile(stageId);
  const r=await sb.rpc('site_stage_progress_set',{
    p_tenant_id:S.tenant, p_stage_id:stageId,
    p_status:status||null, p_progress:(status==='done'?100:(progress!=null?progress:null)),
    /* CAS pe VALOAREA observată (D100): `site_stages` n-are `updated_at` */
    p_expect_status:(prev?prev.status:null), p_expect_progress:(prev?prev.progress:null) });
  if(r.error){
    if(st&&prev){ st.status=prev.status; st.progress=prev.progress; }
    toast(mStageMsg(r.error)); openStageMobile(stageId); return;
  }
  const d=r.data||{};
  if(st){ st.status=d.status||st.status; st.progress=(d.progress!=null?d.progress:st.progress); }
  toast(d.status==='done'?mt('✅ Pas finalizat.'):(status?mt('▶️ Pas pornit.'):mt('✅ Progres salvat.')));
  openStageMobile(stageId);
}
/* poză de progres la un pas de lucru → ajunge la birou (documente pe șantier), legată de pasul respectiv */
async function stagePhotoUpload(stageId, inp){
  const st=(S.curStages||[]).find(x=>x.id===stageId); const site=st&&st.site_id; if(!site){ toast('Pasul nu are șantier asociat.'); return; }
  const files=(inp&&inp.files?Array.from(inp.files):[]); if(!files.length) return;
  const base='Progres: '+((st&&st.name)||'pas de lucru');
  let ok=0,fail=0;
  for(let i=0;i<files.length;i++){ toast('⏳ Se încarcă '+(i+1)+'/'+files.length+'…');
    try{ const src=files[i]; const isImg=/^image\//.test(src.type); if(!isImg && src.size>80*1024*1024){ fail++; continue; }
      let file=isImg?await compressImage(src,1600,0.72):src; const safe=(src.name||(isImg?'poza.jpg':'video.mp4')).replace(/[^a-zA-Z0-9._-]/g,'_'); const path=S.tenant+'/sites/'+site+'/'+Date.now()+'_'+i+'_'+safe;
      const up=await sb.storage.from('docs').upload(path,file,{contentType:src.type||(isImg?'image/jpeg':'video/mp4')}); if(up.error) throw up.error;
      const nm=files.length>1?(base+' ('+(i+1)+'/'+files.length+')'):base;
      const {error}=await sb.from('documents').insert({tenant_id:S.tenant,name:nm,file_url:path,mime:src.type||(isImg?'image/jpeg':'video/mp4'),size_bytes:file.size,entity_type:'site',entity_id:site,uploaded_by:S.session.user.id}); if(error) throw error;
      ok++;
    }catch(e){ fail++; }
  }
  try{ inp.value=''; }catch(e){}
  toast(ok?('✅ '+ok+' '+(ok===1?'poză trimisă':'poze trimise')+' la birou'+(fail?(' · '+fail+' eșuate'):'')+'.'):'Eroare la încărcare.');
}

async function pjSet(payload){ const P=S._pj;

function mTdAll(h){ const T=S._td; S._tdEdit=S._tdEdit||{};

    const e=S._tdEdit[m.employee_id]||(S._tdEdit[m.employee_id]={});

async function scrLivrari(){
  $('screen').innerHTML='<div class="scr-title">Livrări</div><div id="drv-orders"></div><div id="dl"><div class="loading">Se încarcă…</div></div>';
  try{ const oh=await driverOrdersHtml(); const od=$('drv-orders'); if(od) od.innerHTML=oh; }catch(e){}
  const {data}=await sb.from('deliveries').select('id,status,scheduled_at,order_id,site_id,vehicle_id,transfer_request_id,from_warehouse_id');
  const sm=await nameMap('sites','name'); const om=await nameMap('material_orders','number'); const vm=await nameMap('vehicles','label');
  const rows=(data||[]).slice().reverse();
  if(!rows.length){$('dl').innerHTML='<div class="empty"><div class="ei">🚚</div>Nicio livrare programată.</div>';return;}
  /* WAREHOUSE-LOGISTICS1/E: destinația-DEPOZIT a livrărilor de transfer vine din cererea legată */
  const trIds=rows.filter(r=>r.transfer_request_id).map(r=>r.transfer_request_id); const trTo={};
  if(trIds.length){ try{ const wm=await nameMap('warehouses','name');
    const tq=await sb.from('transfer_requests').select('id,to_warehouse_id,to_site_id').in('id',trIds);
    (tq.data||[]).forEach(t=>{ trTo[t.id]=t.to_warehouse_id?('🏬 '+(wm[t.to_warehouse_id]||'—')):('🏗️ '+(sm[t.to_site_id]||'—')); });
  }catch(e){} }
  const stat={pending:['În așteptare','amber'],accepted:['Acceptată','blue'],en_route:['Pe drum','blue'],delivered:['Livrată','green'],failed:['Eșuată','red']};
  $('dl').innerHTML=rows.map(r=>{
    const st=stat[r.status]||['—','grey']; let act=''; const isTr=!!r.transfer_request_id;
    if(isTr){
      /* tranzițiile livrărilor de transfer trec prin CONTRACT (monoton, D116) — nu prin UPDATE
         direct; „Livrată" o închide RECEPȚIA la destinație, nu șoferul */
      if(r.status==='pending') act='<button class="mini-btn go" onclick="trDlv(\''+r.id+'\',\'accepted\')">Accept</button>';
      else if(r.status==='accepted') act='<button class="mini-btn pr" onclick="trDlv(\''+r.id+'\',\'en_route\')">Pornesc</button>';
      else if(r.status==='en_route') act='<span class="pill amber">se închide la recepție</span>';
    } else {
      if(r.status==='pending') act='<button class="mini-btn go" onclick="setDeliv(\''+r.id+'\',\'accepted\')">Accept</button>';
      else if(r.status==='accepted') act='<button class="mini-btn pr" onclick="setDeliv(\''+r.id+'\',\'en_route\')">Pornesc</button>';
      else if(r.status==='en_route') act='<button class="mini-btn go" onclick="setDeliv(\''+r.id+'\',\'delivered\')">Am livrat</button>';
    }
    const dest=isTr?(trTo[r.transfer_request_id]||'Destinație'):(r.site_id?(sm[r.site_id]||'Destinație'):'Destinație');
    const sub=isTr?('🔁 Transfer'+(r.from_warehouse_id?(' din depozit'):'')):('Comanda '+esc(r.order_id?(om[r.order_id]||'—'):'—'));
    return '<div class="card"><div class="row"><div class="grow"><div class="t">'+esc(dest)+'</div><div class="s">'+sub+(r.vehicle_id&&vm[r.vehicle_id]?(' · '+esc(vm[r.vehicle_id])):'')+'</div></div><span class="pill '+st[1]+'">'+st[0]+'</span></div>'+(act?'<div style="margin-top:.7rem;text-align:right">'+act+'</div>':'')+'</div>';
  }).join('');
}

  const m=(S.mats||[]).find(x=>x.id===it.refId); if(!m) return 0;
  return +(m.purchase_price!=null?m.purchase_price:(m.last_price!=null?m.last_price:(m.store_price!=null?m.store_price:0)))||0; }
function reviewRows(){ const items=cartItemsArr(); if(!items.length) return '<div class="empty" style="padding:1rem">Coșul e gol.</div>';
  const row=it=>'<div class="row" style="gap:.5rem;align-items:center;padding:.55rem 0;border-bottom:1px solid var(--line)"><div class="grow"><div class="t">'+esc(it.name)+'</div><div class="s">'+esc(it.unit)+'</div></div>'

  if(tools.length) h+='<div style="font-weight:700;margin:.7rem 0 .1rem">🛠️ Instrumente</div>'+tools.map(row).join('');

/* grupare materiale/instrumente pt afișarea pozițiilor (tool = nume cu prefix 🛠️) */

function cartReview(){ const items=cartItemsArr(); if(!items.length){ toast('Coșul e gol.'); return; }

async function sendOrder(){
  const items=cartItemsArr();
  if(!items.length){ toast('Coșul e gol.'); return; }
  const btn=$('o-send'); if(btn){ btn.disabled=true; btn.textContent='Se trimite…'; }
  const fail=function(msg){ const m=$('o-rev-msg'); if(m) m.innerHTML='<div class="msg err">'+esc(msg)+'</div>'; else toast(msg); if(btn){ btn.disabled=false; updateSendBtn(); } };
  const site=($('o-site')&&$('o-site').value)||null;
  const deadline=($('o-deadline')&&$('o-deadline').value)||null;
  if(!site){ fail('Alege șantierul (obligatoriu).'); return; }
  if(!deadline){ fail('Pune termenul de livrare (obligatoriu).'); return; }
  // numele angajatului (nu emailul): preferă fișa de angajat
  let who=(S.uname||'').trim();
  if(!who || who.indexOf('@')>=0){ const _e=mEmp(); if(_e&&_e.name) who=_e.name; }
  who=who||S.email||null;
  // KB#31 ÎNCHIS (WAREHOUSE-LOGISTICS1/E): comanda se scrie prin contractul ATOMIC
  // `material_order_set` (0177/0179) — antetul și pozițiile într-o singură tranzacție, nu două
  // INSERT-uri care puteau lăsa un părinte orfan. Totalul NU se trimite: serverul îl calculează
  // (clientul aduna fără TVA și ar fi picat pe MO_TOTALS_MISMATCH). Prețurile din catalog merg
  // pe poziții (lucrătorul nu le vede, dar oficiul le primește).
  const rows=items.map(it=>({material_id:it.kind==='m'?it.refId:null,name:(it.kind==='t'?'🛠️ '+it.name:it.name),qty:it.qty,unit:it.unit,unit_price:catPriceOf(it),vat_rate:20}));
  const r2=await sb.rpc('material_order_set',{p_order_id:null,p_tenant_id:S.tenant,
    p_document:{site_id:site,status:'draft',expected_at:deadline,created_by_name:who},
    p_items:rows,p_expected_updated_at:null,p_allow_empty:false});
  if(r2.error){ fail(mvErr(r2.error)); return; }
  S.cart={}; closeSheet(); toast('✅ Comandă trimisă la birou ('+items.length+' poziții).'); scrComanda();
}

/* Comprimă poza pe dispozitiv înainte de upload (~1600px, JPEG ~0.72) → fișiere mult mai mici, încărcare rapidă */
async function compressImage(file, maxDim, quality){
  try{
    if(!file || !/^image\//.test(file.type||'') || /(gif|svg)/i.test(file.type||'') || !window.createImageBitmap) return file;
    const bmp=await createImageBitmap(file); let w=bmp.width, h=bmp.height;
    const scale=Math.min(1,(maxDim||1600)/Math.max(w,h)); w=Math.round(w*scale); h=Math.round(h*scale);
    const cv=document.createElement('canvas'); cv.width=w; cv.height=h; cv.getContext('2d').drawImage(bmp,0,0,w,h); if(bmp.close) bmp.close();
    const blob=await new Promise(res=>cv.toBlob(res,'image/jpeg',quality||0.72));
    if(!blob || blob.size>=file.size) return file;
    return new File([blob],(file.name||'poza').replace(/\.[^.]+$/,'')+'.jpg',{type:'image/jpeg'});
  }catch(e){ return file; }
}
function lbReg(urls){ window._lbReg=window._lbReg||{}; window._lbC=(window._lbC||0)+1; const id='lb'+window._lbC; window._lbReg[id]=(urls||[]).filter(Boolean); return id; }
function lbOpen(id,i){ openLightbox((window._lbReg||{})[id]||[], i); }

      +'<div id="lbc" style="position:absolute;bottom:14px;left:50%;transform:translateX(-50%);color:#fff;font-size:13px;background:rgba(0,0,0,.45);padding:4px 12px;border-radius:999px;z-index:2"></div>';

}
function lbDist(t){ return Math.hypot(t[0].clientX-t[1].clientX, t[0].clientY-t[1].clientY); }
function lbApply(){ var g=window._lb,im=document.getElementById('lbi'); if(im&&g){ im.style.transform='translate('+g.tx+'px,'+g.ty+'px) scale('+g.scale+') rotate('+g.rot+'deg)'; } }
function lbZoom(d){ var g=window._lb; if(!g)return; g.scale=Math.min(5,Math.max(1,Math.round((g.scale+d)*100)/100)); if(g.scale===1){g.tx=0;g.ty=0;} lbApply(); }
function lbLoadImg(url,cors){ return new Promise(function(res,rej){ var im=new Image(); if(cors) im.crossOrigin='anonymous'; im.onload=function(){res(im);}; im.onerror=rej; im.src=url; }); }

async function lbResolve(i){ var g=window._lb; if(!g)return ''; if(g.show[i])return g.show[i]; if(window._dsTaint){ g.show[i]=g.urls[i]||''; return g.show[i]; } try{ var s=await lbDownscale(g.urls[i],1400,0.62); g.show[i]=s; return s; }catch(e){ if(/security|taint/i.test(String((e&&e.name)||e))) window._dsTaint=true; g.show[i]=g.urls[i]||''; return g.show[i]; } }

/* ►► FLEET1-B.V — `openDoc` LIPSEA din `mobil.html`, deși era apelat în două locuri
   (`:283` „vezi buletinul atașat", `:284` „vezi semnătura salvată"). Aplicația de teren nu
   încarcă `app.html`, iar `i18n.js` nu o definește — deci ambele linkuri aruncau
   `ReferenceError: openDoc is not defined`. Defect PREEXISTENT, nu introdus de FLEET1-B, dar
   ambele sunt call-site-uri ale funcției pe care lotul a schimbat-o, deci se închid aici.
   Ambele căi reale sunt IMAGINI, deci merg în vizualizatorul intern care există deja
   (`openLightbox`) — IN-APP FIRST, fără filă nouă și fără un al doilea vizualizator. */
async function openDoc(encPath){
  const path=decodeURIComponent(encPath||''); if(!path) return;
  let url=''; try{ const s=await sb.storage.from('docs').createSignedUrl(path,300); url=(s.data&&s.data.signedUrl)||''; }catch(e){}
  if(!url){ toast(mtz('Nu am putut deschide documentul.')); return; }
  if(/\.(jpe?g|png|webp|gif|bmp|avif|heic|heif)$/i.test(path)){ openLightbox([url],0); return; }
  if(/\.(mp4|webm|mov|m4v|ogg)$/i.test(path)){ mVidPlay(url); return; }
  /* PDF/alt format: terenul nu are vizualizator propriu, iar construirea unuia ar fi
     funcționalitate nouă. Ieșire controlată, anunțată — fallback, nu implicit. */
  toast(mtz('Se deschide în afara aplicației…'));
  try{ window.open(url,'_blank'); }catch(e){}
}

const MT_ATT_MIME=['image/jpeg','image/png','image/webp','image/gif','image/heic','image/heif','application/pdf'];
async function mTaskAttachPick(input, taskId){
  const f=input.files&&input.files[0]; try{ input.value=''; }catch(e){} if(!f) return;
  const prog=$('mta-prog');
  if(f.size>25*1024*1024){ toast(window.C373t?C373t('Fișierul depășește 25 MB.'):'Fișierul depășește 25 MB.'); return; }
  const mime=f.type||'application/octet-stream';
  if(MT_ATT_MIME.indexOf(mime)<0){ toast(mTaskErr({message:'TASK_ATTACH_INVALID'})); return; }
  if(window._mtkBusy) return; window._mtkBusy=true;
  if(prog) prog.textContent='⏳';
  try{
    let up=f;
    if(/^image\/(jpeg|png|webp)$/.test(mime)){ try{ up=await compressImage(f,1600,0.72); }catch(e){ up=f; } }
    const safe=(f.name||'foto.jpg').replace(/[^a-zA-Z0-9._-]/g,'_');
    /* cale unică: timestamp + component aleator (KB#57) */
    const path=S.tenant+'/tasks/tk_'+Date.now()+'_'+Math.random().toString(36).slice(2,8)+'_'+safe;
    const r=await sb.storage.from('docs').upload(path,up,{contentType:up.type||mime});
    if(r.error) throw r.error;
    try{
      const res=await sb.rpc('task_attachment_add',{p_task_id:taskId,
        p_file:{file_path:path,file_name:(f.name||safe).slice(0,200),mime:up.type||mime,size_bytes:up.size||f.size},
        p_request_id:mUuid()});
      if(res.error) throw res.error;
      mTaskSheet(taskId);
    }catch(e){
      /* KB#60: curățăm obiectul DOAR la refuz EXPLICIT (cod TASK_*), nu la erori de rețea */
      if(/TASK_[A-Z_]+/.test(String(e&&e.message||''))){ try{ await sb.storage.from('docs').remove([path]); }catch(_){}}
      toast(mTaskErr(e));
    }
  }catch(e){ toast((window.C373t?C373t('Eroare:'):'Eroare:')+' '+esc(String(e&&e.message||e))); }
  finally{ window._mtkBusy=false; if(prog) prog.textContent=''; }
}

/* ══ SCANEAZĂ & MUTĂ — SCAN1-A (migr 0138/0139) ══════════════════════════════
   Fluxul de teren: scanează obiectul → alege/scanează destinația → (cantitate) →
   confirmă. Toate scrierile trec prin contractul unic `inventory_move`: starea
   curentă și ledgerul se schimbă în ACEEAȘI tranzacție, server-side. Clientul nu
   calculează stoc și nu declară niciodată succes fără confirmarea serverului. */
const MV_ERR={
  /* Codurile de INVENTARIERE stau ÎNAINTEA celor de lot și de mișcare, din același motiv

/* ── Scanner: BarcodeDetector nativ când există, altfel biblioteca deja folosită
   de `scanTool` (html5-qrcode), plus introducere manuală. Overlay-ul stă la nivel
   de BODY, nu în #screen — care primește `transform` de la IIFE-ul de gesturi (KB#2). ── */
function mScanSupported(){ return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia); }
function mScanStop(){
  try{ if(window._mvStream){ window._mvStream.getTracks().forEach(t=>t.stop()); window._mvStream=null; } }catch(e){}
  try{ if(window._mvRaf){ cancelAnimationFrame(window._mvRaf); window._mvRaf=null; } }catch(e){}
  try{ if(window._mvH5){ window._mvH5.stop().catch(()=>{}); window._mvH5=null; } }catch(e){}
  const o=document.getElementById('mv-cam'); if(o) o.remove();
  /* Starea de anti-repetare NU supraviețuiește închiderii camerei: altfel, la o redeschidere

  window._mvSeen=null; window._mvOnCode=null; window._mvKeep=false;
}
/* DEBOUNCE (SCAN1-B.1). Camera vede același cod de ~30 de ori pe secundă, deci fiecare
   detectare NU poate însemna „încă o bucată". Dar în modul „Mută mai multe" o scanare
   REPETATĂ a aceluiași material e intenționată — așa numeri 7 saci de ciment. Distincția
   nu se poate face optic, deci se face în TIMP, per cod:
     · un obiect  → 2500 ms (ca în SCAN1-A: oricum se închide camera după prima citire);
     · mai multe  → 1200 ms — sub el e re-detectarea aceluiași cadru, peste el e gestul
       fizic de a lua obiectul următor. Măsurat pe cititoarele de mână uzuale: o prezentare
       nouă durează ~1–2 s, iar mai jos de ~800 ms apar dubluri accidentale.
   Fereastra e PER COD (`_mvSeen`), nu globală: două etichete alternând în cadru nu se mai
   deblochează reciproc, cum s-ar fi întâmplat cu un singur `_mvLast`.
   Assetul e oricum protejat structural: al doilea scan al aceleiași bucăți e „Deja scanat". */
const MV_DEBOUNCE_ONE=2500, MV_DEBOUNCE_BATCH=1200;
function mvFeedback(){
  try{ if(navigator.vibrate) navigator.vibrate(30); }catch(e){}
  try{
    const C=window.AudioContext||window.webkitAudioContext; if(!C) return;
    const a=window._mvAC||(window._mvAC=new C());
    if(a.state==='suspended') a.resume();
    const o=a.createOscillator(), g=a.createGain();
    o.type='sine'; o.frequency.value=1180; g.gain.value=0.05;
    o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+0.06);
  }catch(e){}
  const f=document.getElementById('mv-frame');
  if(f){ f.style.borderColor='#16b364'; setTimeout(()=>{ if(f) f.style.borderColor='#fff'; },160); }
}
async function mScanStart(onCode, opts){
  mScanStop();
  const keep=!!(opts&&opts.keepOpen);
  window._mvKeep=keep; window._mvSeen=new Map();
  /* ══ Geometria overlay-ului (SCAN1-B.2) ══════════════════════════════════════════════
     Pe iPhone NU există `BarcodeDetector`, deci Safari cade ÎNTOTDEAUNA pe html5-qrcode.
     Biblioteca își desenează PROPRIUL cadru („shaded region") — dar numai dacă primește
     `qrbox`. Din sursa ei: `isShadedBoxEnabled(){ return !isNullOrUndefined(this.qrbox) }`,
     iar `getShadedRegionBounds` îl centrează pe VIDEOUL EI. Cadrul nostru era centrat pe
     STAGE. Cum videoul ocupa doar partea de sus, ieșeau DOUĂ cadre, în locuri diferite
     (măsurat: 99–239 px decalaj) plus o bandă neagră de 45–60% din stage, jos.
     Reparația: NU mai trimitem `qrbox` ⇒ biblioteca nu mai desenează nimic și decodează
     tot cadrul; rămâne UN SINGUR cadru, al nostru, identic pe iPhone și pe Android.
     Videoul se CENTREAZĂ în stage (nu mai e lipit sus), deci nu mai există bandă neagră
     asimetrică înainte de bara de acțiuni. Nu întindem videoul cu `object-fit:cover` pe
     ramura bibliotecii: canvas-ul ei se dimensionează din `clientWidth/clientHeight`, iar
     o întindere ar deforma cadrul trimis la decodare. Bara respectă safe-area iOS. */
  if(!document.getElementById('mv-cam-css')){
    const st=document.createElement('style'); st.id='mv-cam-css';
    /* `!important` pe position/inset NU e cosmetic — e singurul lucru care ține containerul viu.
       html5-qrcode scrie INLINE `position:relative` pe elementul ei gazdă (`#mv-h5`) în `start()`.
       Un stil inline bate o regulă de foaie fără `!important`, deci `position:absolute` cădea, iar
       `#mv-h5` redevenea COPIL DE FLEX al lui `#mv-stage`. Un flex item fără lățime intrinsecă se
       strânge la 0 ⇒ biblioteca citea `clientWidth === 0` și își scria singură `width:0px` pe
       propriul `<video>`: pe iPhone rămâneau ecran negru + cadrul alb, fără imagine.
       Cu `!important`, `#mv-h5` rămâne absolut ⇒ iese complet din fluxul flex (un copil absolut
       NU e flex item) și umple `#mv-stage`, deci `clientWidth` e lățimea reală la `h.start()`.
       `max-height` completează `max-width`: videoul bibliotecii primește lățimea containerului și
       înălțimea din raportul de aspect — pe un stage înalt trebuie plafonat, nu întins. */
    st.textContent='#mv-h5{position:absolute!important;inset:0!important;display:flex;align-items:center;justify-content:center}'
      +'#mv-h5 video{max-width:100%;max-height:100%;display:block}'
      +'#mv-h5 canvas{display:none!important}'   /* canvas-ul de decodare nu e interfață */
      +'#mv-h5 img{display:none!important}';     /* butonul „scanner paused" al bibliotecii */
    document.head.appendChild(st);
  }
  const ov=document.createElement('div'); ov.id='mv-cam';
  ov.style.cssText='position:fixed;inset:0;z-index:100003;background:#000;display:flex;flex-direction:column;'
    +'padding-top:env(safe-area-inset-top,0px)';
  ov.innerHTML='<div id="mv-stage" style="flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center">'
    +'<video id="mv-vid" playsinline muted style="width:100%;height:100%;object-fit:cover"></video>'
    +'<div id="mv-h5"></div>'
    +'<div id="mv-frame" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:66vw;max-width:280px;aspect-ratio:1;border:3px solid #fff;border-radius:14px;box-shadow:0 0 0 100vmax rgba(0,0,0,.45);pointer-events:none"></div></div>'
    +'<div style="padding:.8rem;padding-bottom:calc(.8rem + env(safe-area-inset-bottom,0px));background:#0f1c33;color:#fff;flex:0 0 auto">'
    +'<div id="mv-msg" style="font-size:.9rem;margin-bottom:.6rem;min-height:1.2em" role="status" aria-live="polite">'+esc(mtz('Îndreaptă camera spre cod'))+'</div>'
    /* HUD-ul de lot stă ÎN overlay, nu în toast: `#toast` e la z-index 60, iar `#mv-cam`
       la 100003 — un toast ridicat cu camera deschisă e complet invizibil. */
    /* HUD pe UN rând: bara de acțiuni fura 131 px din înălțime, adică exact spațiul care
       lipsea previzualizării. Două rânduri rezervate permanent nu se justifică. */
    +(keep?'<div id="mv-hud" style="font-size:.85rem;margin-bottom:.5rem;min-height:1.25em;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></div>':'')
    +'<div style="display:flex;gap:.5rem">'
    +'<button class="mini-btn gh" style="flex:1" onclick="'+(keep?'mvbCancelScan()':'mScanStop()')+'">'+esc(mtz('Anulează'))+'</button>'
    +'<button class="mini-btn gh" style="flex:1" onclick="mScanManual()">'+esc(mtz('Introdu codul'))+'</button>'
    +(keep?'<button class="mini-btn pr" style="flex:1" id="mv-done" onclick="mvbDoneScan()">'+esc(mtz('Gata'))+'</button>':'')
    +'</div></div>';
  document.body.appendChild(ov);            // BODY, nu #screen (KB#2)
  window._mvOnCode=function(code){
    const c=String(code||'').trim(); if(!c) return;
    const now=Date.now(), win=keep?MV_DEBOUNCE_BATCH:MV_DEBOUNCE_ONE;
    const seen=window._mvSeen||(window._mvSeen=new Map());
    if(now-(seen.get(c)||0) < win) return;                       // aceeași etichetă, același gest
    seen.set(c, now);
    if(seen.size>40) seen.delete(seen.keys().next().value);      // fereastră mărginită
    const m=document.getElementById('mv-msg'); if(m) m.textContent=mtz('Cod citit…');
    if(keep){ mvFeedback(); onCode(c); return; }                 // camera RĂMÂNE deschisă
    mScanStop(); onCode(c);
  };
  if(!mScanSupported()){ mScanMsg(mtz('Camera nu e disponibilă pe acest dispozitiv.')); return; }

    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});
  }catch(err){
    const nm=(err&&err.name)||'';
    mScanMsg(/NotAllowed|Security/i.test(nm)
      ? mtz('Acces la cameră refuzat. Poți introduce codul manual.')
      : mtz('Camera nu a putut porni. Poți introduce codul manual.'));
    return;
  }
  window._mvStream=stream;
  const vid=document.getElementById('mv-vid'); if(!vid){ mScanStop(); return; }
  vid.srcObject=stream; try{ await vid.play(); }catch(e){}
  if('BarcodeDetector' in window){
    let det; try{ det=new BarcodeDetector({formats:['qr_code','ean_13','ean_8','code_128','code_39','itf','upc_e','data_matrix']}); }
    catch(e){ det=new BarcodeDetector(); }
    const tick=async function(){
      if(!window._mvStream) return;
      try{ const b=await det.detect(vid); if(b && b.length && b[0].rawValue){
             window._mvOnCode(b[0].rawValue);
             /* În modul „un obiect" `_mvOnCode` a chemat deja `mScanStop`, deci bucla se
                oprea prin acest `return`. În modul „mai multe" ea TREBUIE să continue —
                aici era singurul blocaj real al scanării continue. */
             if(!keep) return;
           } }catch(e){}
      if(window._mvStream) window._mvRaf=requestAnimationFrame(tick);
    };
    window._mvRaf=requestAnimationFrame(tick);
  } else {
    /* fără BarcodeDetector: biblioteca folosită deja de `scanTool` (aceeași sursă, zero
       dependență nouă). Fără internet la prima încărcare rămâne introducerea manuală. */
    try{ vid.style.display='none'; stream.getTracks().forEach(t=>t.stop()); window._mvStream=null; }catch(e){}
    const boot=function(){
      try{
        const h=new Html5Qrcode('mv-h5'); window._mvH5=h;
        /* FĂRĂ `qrbox`: altfel biblioteca își desenează propriul cadru peste al nostru
           (al doilea cadru de pe iPhone) și restrânge decodarea la un pătrat centrat pe
           videoul EI. Fără el, decodează tot cadrul — mai iertător — iar singurul cadru
           vizibil rămâne `#mv-frame`, care e reper de ochire, nu graniță de decodare. */
        h.start({facingMode:'environment'},{fps:10},function(txt){ window._mvOnCode(txt); },function(){});
      }catch(e){ mScanMsg(mtz('Camera nu a putut porni. Poți introduce codul manual.')); }
    };
    if(window.Html5Qrcode) boot();
    else { const s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js';
      s.onload=boot; s.onerror=function(){ mScanMsg(mtz('Scanerul nu s-a încărcat. Introdu codul manual.')); };
      document.head.appendChild(s); }
  }
}
function mScanMsg(t){ const m=document.getElementById('mv-msg'); if(m) m.textContent=t; }
function mScanManual(){
  const cb=window._mvOnCode, keep=!!window._mvKeep;
  const v=prompt(mtz('Introdu codul de pe etichetă:'),'');
  if(v===null) return;
  const c=String(v).trim(); if(!c) return;

     cineva care tastează de două ori același cod ar crede că a doua oară nu s-a înregistrat. */
  if(window._mvSeen) window._mvSeen.delete(c);
  if(keep){ if(cb) cb(c); return; }          // în lot, camera rămâne deschisă
  mScanStop(); if(cb) cb(c);
}

function mvScanObject(){ mScanStart(async function(code){ await mvResolve(code,'obj'); }); }
function mvScanDest(){ mScanStart(async function(code){ await mvResolve(code,'dest'); }); }
async function mvResolve(code, slot){
  let res=null;
  try{ const r=await sb.rpc('scan_resolve',{p_code:code}); if(r.error) throw r.error; res=r.data; }
  catch(e){ toast(mvErr(e)); goV('scan'); return; }
  const st=res&&res.status;
  if(st==='unknown'){
    toast('❓ '+mtz('Cod necunoscut.'));
    S._mvUnknown=code; mvRender(); return;
  }
  if(st==='ambiguous'){ toast(mtz('Codul se potrivește cu mai multe obiecte. Alege din listă.')); mvRender(); return; }
  if(slot==='dest'){
    if(res.kind!=='warehouse' && res.kind!=='site'){ toast(mtz('Codul scanat nu e o locație.')); return; }
    mvSetDest(res.kind,res.id); return;
  }
  /* obiect */
  if(res.kind==='material'){
    if(!mvCanMaterial()){ toast('🔒 '+mtz('Nu ai dreptul să miști materiale.')); return; }
    S._mv.obj={kind:'material',id:res.id,label:res.label,unit:res.unit||''};
    await mvLoadStock();
  } else if(res.kind==='asset'){
    S._mv.obj={kind:'asset',id:res.id,label:res.label};
    await mvLoadUnit();
  } else if(res.kind==='tool'){
    /* sculă-tip: în SCAN1-A se mută BUCATA. Dacă are exact una, continuăm cu ea. */
    try{
      const u=await sb.from('tool_units').select('id,serial_no,site_id,warehouse_id,holder_employee_id,tools(name)').eq('tool_id',res.id).limit(2);
      const rows=u.data||[];
      if(rows.length===1){ S._mv.obj={kind:'asset',id:rows[0].id,label:((rows[0].tools&&rows[0].tools.name)||res.label)}; await mvLoadUnit(); }
      else if(rows.length===0){ toast(mtz('Scula nu are bucăți individuale înregistrate. Mutarea pe cantitate vine în SCAN1-B.')); return; }
      else { toast(mtz('Scula are mai multe bucăți. Scanează eticheta bucății.')); return; }
    }catch(e){ toast(mvErr(e)); return; }
  } else { toast(mtz('Codul scanat nu e un obiect care se poate muta.')); return; }
  S._mv.dest=null; mvRender();
}
async function mvLoadStock(){
  const M=S._mv; M.from=null; M.avail=null;
  try{
    const r=await sb.from('stock').select('qty,site_id,warehouse_id').eq('material_id',M.obj.id).gt('qty',0);
    const rows=r.data||[];
    if(rows.length===1){
      const x=rows[0];
      M.from = x.warehouse_id ? {kind:'warehouse',id:x.warehouse_id} : (x.site_id ? {kind:'site',id:x.site_id} : null);
      M.avail = +x.qty;
    } else if(rows.length>1){ M.multi=rows; }   /* ambiguu: NU ghicim sursa */
  }catch(e){}
}
async function mvLoadUnit(){
  const M=S._mv; M.from=null;
  try{
    const r=await sb.from('tool_units').select('site_id,warehouse_id,holder_employee_id').eq('id',M.obj.id).maybeSingle();
    const u=r.data; if(!u) return;

           : u.site_id ? {kind:'site',id:u.site_id}

  }catch(e){}
}

/* Tipul se derivă din CAPETE, nu se alege din interfață. Verificările de ASSET stau
   ÎNAINTEA lui `receipt`: până la SCAN1-B.1, o bucată NEALOCATĂ predată unui angajat
   producea `receipt` + `to.kind='employee'`, formă pe care contractul o refuză cu
   MOVE_INVALID_LOCATION — predarea era pur și simplu imposibilă din teren. Regula e acum
   identică celei din birou (`toolUnitMove` din app.html) și celei server-side din 0144;
   două interfețe care produc `movement_type` diferit pentru aceeași acțiune fizică ar
   strica istoricul. */
function mvType(){
  const M=S._mv, isMat=M.obj.kind==='material';
  if(M.dest.kind==='consume') return 'consumption';
  if(!isMat){
    if(M.dest.kind==='employee') return 'assign';
    if(M.from && (M.from.kind==='warehouse'||M.from.kind==='site')) return 'transfer';
    return 'return';                       // de la un angajat, de la un terț extern sau de nicăieri
  }
  if(!M.from) return 'receipt';
  return 'transfer';
}
/* Istoricul mișcărilor — LAZY, doar la cerere, limitat pe server (D23) */
/* „În reparație", nu „Reparație": cheia scurtă e deja folosită ca TIP DE LUCRARE
   (i18n: de='Renovierung') — un text-sursă identic ar suprascrie acea traducere (KB#6). */
const MV_TYPE={receipt:'Intrare',transfer:'Transfer',assign:'Predat',return:'Retur',consumption:'Consum',
  inventory_adjustment:'Corecție',damaged:'Deteriorat',lost:'Pierdut',repair:'În reparație',decommission:'Scos din uz'};

  const html = rows.length ? rows.map(function(x){

      +(x.qty!=null?(' · '+(+x.qty)+' '+esc(x.unit||'')):'')
      +'<div class="s">'+esc(path)+'</div></div>'

    : '<div class="empty"><div class="ei">🕘</div>'+esc(mtz('Nicio mișcare încă.'))+'</div>';
  openSheet('🕘 '+mtz('Istoric mișcări'), html);
