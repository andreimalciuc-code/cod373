async function mvConfirm(){
  const M=S._mv, err=$('mv-err'); if(!M||!M.obj||!M.dest) return;
  if(M.busy) return;                                   // gardă „în zbor" (D29)
  const isMat=M.obj.kind==='material';
  let qty=null;
  if(isMat){
    qty=parseFloat(($('mv-qty')&&$('mv-qty').value)||'');
    if(!(qty>0)){ if(err) err.textContent=mtz('Cantitatea trebuie să fie mai mare decât zero.'); return; }
  }
  if(isMat && !M.from && M.dest.kind==='consume'){ if(err) err.textContent=mtz('Nu ai de unde consuma.'); return; }
  const mtype=mvType();
  const payload={kind:M.obj.kind, type:mtype};
  if(isMat){ payload.material_id=M.obj.id; payload.qty=qty; } else payload.unit_id=M.obj.id;
  /* La `return` dinspre un ANGAJAT sursa se omite deliberat, ca în birou: serverul validează
     capetele cu `movement_location_ok`, care cere `employees.active = true`, deci o bucată
     rămasă la un angajat dezactivat între timp ar fi devenit imposibil de întors. */
  if(M.from && !(mtype==='return' && M.from.kind==='employee')) payload.from={kind:M.from.kind,id:M.from.id};
  if(M.dest.kind!=='consume') payload.to={kind:M.dest.kind,id:M.dest.id};
  /* request_id STABIL pe încercare: un retry după eroare de rețea refolosește același id,
     deci serverul face replay în loc de a doua mișcare (pregătit și pentru OFFLINE1). */
  if(!M.rq) M.rq=mUuid();
  M.busy=true; const btn=$('mv-go'); if(btn) btn.disabled=true; if(err) err.textContent='';
  try{
    const r=await sb.rpc('inventory_move',{p_tenant_id:S.tenant,p_payload:payload,p_request_id:M.rq});
    if(r.error) throw r.error;
    const dest=M.dest.kind==='consume'?mtz('Consum'):mvLocLabel(M.dest.kind,M.dest.id);
    toast('✅ '+esc(M.obj.label)+' → '+esc(dest));
    mvReset(); mvRender();
  }catch(e){
    /* succesul se anunță DOAR după confirmarea serverului; la eroare păstrăm tot
       contextul (obiect, destinație, cantitate, request_id) ca retry-ul să fie sigur */
    if(err) err.textContent=mvErr(e);
  }
  finally{ M.busy=false; if(btn) btn.disabled=false; }
}

/* ══ „MUTĂ MAI MULTE" — lot de obiecte către o destinație comună (SCAN1-B.1, migr 0144) ══
   Azi fluxul cere destinația din nou pentru FIECARE obiect. Aici o alegi O DATĂ, scanezi
   continuu, verifici lista și confirmi O DATĂ — un singur lot economic, all-or-nothing.
   Regulile care nu se negociază:
     · scanarea construiește DOAR o schiță locală; nimic nu se scrie până la Confirmă;
     · cantitatea trăiește în STARE (`it.qty`), nu în DOM — `mvRender` rescrie tot ecranul,
       iar un `<input>` ar fi golit la fiecare redesenare (defectul lui `#mv-qty` din SCAN1-A);
     · un obiect = o linie; materialul rescanat crește cantitatea, bucata rescanată nu se dublează;
     · „Mută tot" NU trimite cantitatea văzută pe ecran — trimite `move_all`, iar serverul
       citește cantitatea sub lacăt;
     · orice modificare a conținutului resetează `rq`, fiindcă devine ALT lot economic; un
       retry după eroare păstrează același `rq`, deci serverul face replay, nu a doua mutare. */
function mvbKey(){ const u=(S.session&&S.session.user&&S.session.user.id)||'anon';
  return 'c373_mv_batch:'+(S.tenant||'-')+':'+u; }

  const d=JSON.parse(raw); if(!d||!Array.isArray(d.items)) return false;

function mvbClear(){ try{ sessionStorage.removeItem(mvbKey()); }catch(e){} }
/* La delogare schița dispare COMPLET: pe un telefon de șantier folosit de doi oameni,

  ks.forEach(k=>sessionStorage.removeItem(k)); }catch(e){} }

function miHud(){

async function miOnCode(code){
  const mi=S._mi; if(!mi||!mi.sid) return;
  let res=null;
  try{ const r=await sb.rpc('scan_resolve',{p_code:code}); if(r.error) throw r.error; res=r.data; }
  catch(e){ mScanMsg(mvErr(e)); return; }
  const st=res&&res.status;
  if(st==='unknown'){ mi._last='❓ '+mtz('Cod necunoscut'); miHud(); mScanMsg(mtz('Cod necunoscut.')); return; }
  if(st==='ambiguous'){ mScanMsg(mtz('Codul se potrivește cu mai multe obiecte. Alege din listă.')); return; }
  let payload=null;
  if(res.kind==='material') payload={kind:'material', material_id:res.id, mode:'scan', qty:1};
  else if(res.kind==='asset') payload={kind:'asset', unit_id:res.id, mode:'scan'};
  /* 0181: scula-TIP (cantitativă) se numără ca materialul — fiecare scanare = încă o bucată */
  else if(res.kind==='tool') payload={kind:'tool', tool_id:res.id, mode:'scan', qty:1};
  else { mScanMsg(mtz('Codul scanat nu e un obiect care se poate număra.')); return; }
  payload.session_id=mi.sid;
  try{
    const r=await sb.rpc('inventory_session_count',{p_tenant_id:S.tenant, p_payload:payload, p_request_id:mUuid()});
    if(r.error) throw r.error;
    const d=r.data;
    mi._last=(res.kind==='material'?'📦 ':'🛠️ ')+res.label
      +(res.kind!=='asset'?(' × '+(+d.counted_qty)):'');
    mvFeedback();
    await miLoad(); miHud();
  }catch(e){
    /* „Deja scanat" nu e o eroare de flux — e răspunsul corect la o a doua trecere */
    const msg=mvErr(e); mi._last='⚠️ '+res.label; miHud(); mScanMsg(msg);
  }
}
async function miSet(lineId, kind, objId){
  const st=S._mi&&S._mi.st; if(!st) return;
  const row=(kind==='material'?(st.materials||[]):kind==='tool'?(st.tools||[]):[]).find(x=>x.line_id===lineId);
  const cur=row&&row.counted_qty!=null?(+row.counted_qty):'';
  const v=prompt(mtz('Cantitatea numărată')+(row?(' — '+row.name+(row.unit?(' ('+row.unit+')'):'')):''), String(cur));
  if(v===null) return;
  const s=String(v).trim();
  const payload={session_id:S._mi.sid, kind:kind,
                 mode:(s===''?'clear':'set'), expected_version:row?row.version:null};
  if(kind==='tool') payload.tool_id=objId; else payload.material_id=objId;
  if(s!==''){ const n=Number(s.replace(',','.')); if(!isFinite(n)||n<0){ toast(mtz('Cantitate invalidă.')); return; } payload.qty=n; }
  try{
    const r=await sb.rpc('inventory_session_count',{p_tenant_id:S.tenant, p_payload:payload, p_request_id:mUuid()});
    if(r.error) throw r.error;
    await miLoad(); miRender();
  }catch(e){ toast(mvErr(e)); }
}
async function miReconcile(){
  if(S._mi.busy) return; S._mi.busy=true; miRender();
  try{
    const r=await sb.rpc('inventory_session_reconcile',{p_tenant_id:S.tenant,
      p_payload:{session_id:S._mi.sid, expected_version:S._mi.st&&S._mi.st.session?S._mi.st.session.version:null}});
    if(r.error) throw r.error;
    await miLoad();
    /* NU finalizăm automat după reîncărcare: reconfirmarea rămâne un act deliberat. */
    toast('🔄 '+mtz('Stare reîncărcată. Verifică diferențele și confirmă.'));
  }catch(e){ toast(mvErr(e)); }
  S._mi.busy=false; miRender();
}
async function miCancel(){
  if(!confirm(mtz('Anulezi inventarierea? Numărătoarea se păstrează în istoric, dar nu mai poate fi finalizată.'))) return;
  try{
    const r=await sb.rpc('inventory_session_cancel',{p_tenant_id:S.tenant,
      p_payload:{session_id:S._mi.sid, expected_version:S._mi.st&&S._mi.st.session?S._mi.st.session.version:null}});
    if(r.error) throw r.error;
    miReset(); toast(mtz('Inventariere anulată.')); miScreen();
  }catch(e){ toast(mvErr(e)); }
}
async function miFinalize(){
  const st=S._mi&&S._mi.st; if(!st) return;
  const mats=(st.materials||[]).concat(st.tools||[]);   /* 0181: sculele-tip = aceeași economie */
  const dif=mats.filter(x=>x.counted && (+x.difference)!==0);
  const unc=mats.filter(x=>!x.counted).length;
  const as=st.assets||[];
  const miss=as.filter(x=>x.class==='missing').length, unexp=as.filter(x=>x.class==='unexpected').length;
  let msg=mtz('Finalizezi inventarierea?')+'\n\n'
    +dif.length+' '+mtz('poziții cu diferență → se corectează stocul')+'\n';
  if(unc) msg+=unc+' '+mtz('poziții NENUMĂRATE → rămân neatinse')+'\n';
  if(miss||unexp) msg+=(miss+unexp)+' '+mtz('discrepanțe la scule → se păstrează ca observație, fără mutare')+'\n';
  if(!confirm(msg)) return;
  /* `request_id` se păstrează pe TOATĂ încercarea, inclusiv după o eroare de rețea: un retry
     trebuie să fie replay, nu o a doua finalizare (tiparul SCAN1-A/B.1). */
  if(!S._mi._rq) S._mi._rq=mUuid();
  S._mi.busy=true; miRender();
  try{
    const r=await sb.rpc('inventory_session_finalize',{p_tenant_id:S.tenant,
      p_payload:{session_id:S._mi.sid, expected_version:st.session?st.session.version:null},
      p_request_id:S._mi._rq});
    if(r.error) throw r.error;
    const d=r.data||{};
    toast('✅ '+mtz('Inventariere finalizată.')+' '+((d.adjusted||0)+(d.tools_adjusted||0))+' '+mtz('corecții'));
    miReset(); S._mi.busy=false; miScreen(); return;
  }catch(e){
    S._mi.busy=false;
    const m=String((e&&(e.message||e))||'');
    if(m.indexOf('INVENTORY_STOCK_CHANGED')>=0 || m.indexOf('ADJ_STALE_QTY')>=0){
      /* conflictul consumă jetonul: următoarea încercare e o operație NOUĂ, pe altă bază */
      S._mi._rq=null; await miLoad();
    }
    toast(mvErr(e)); miRender();
  }
}
function miRender(){
  const sc=$('screen'); if(!sc) return;
  const mi=S._mi||{}; let h=mvHead();
  if(mi.busy && !mi.st){ sc.innerHTML=h+'<div class="card"><div class="s">'+esc(mtz('Se încarcă…'))+'</div></div>'; return; }

  /* ── fără sesiune: alege locația ── */
  if(!mi.sid){
    const L=S._mvLoc||{wh:[],sites:[]};
    h+='<div class="card"><div class="t">'+esc(mtz('Ce inventariezi?'))+'</div>'
      +'<div class="s">'+esc(mtz('Alege locația, apoi scanează ce găsești fizic. Nimic nu se modifică până la finalizare.'))+'</div></div>';
    const row=(kind,x,ic)=>'<button class="card" style="width:100%;text-align:left;display:block" onclick="miStart(\''+kind+'\',\''+x.id+'\')">'
      +'<div class="t">'+ic+' '+esc(x.name)+'</div></button>';
    if(!L.wh.length && !L.sites.length) h+='<div class="card"><div class="s">'+esc(mtz('Nicio locație disponibilă.'))+'</div></div>';
    h+=L.wh.map(x=>row('warehouse',x,'🏬')).join('')+L.sites.map(x=>row('site',x,'🏗️')).join('');
    sc.innerHTML=h; return;
  }

  const st=mi.st||{}, S1=st.session||{}, mats=st.materials||[], as=st.assets||[], tls=st.tools||[];
  /* 0181: sculele cantitative intră în ACEEAȘI economie ca materialele */
  const conflicts=mats.filter(x=>x.changed).concat(tls.filter(x=>x.changed));
  const counted=mats.filter(x=>x.counted).length+tls.filter(x=>x.counted).length,
        unc=(mats.length+tls.length)-counted;
  const dif=mats.filter(x=>x.counted && (+x.difference)!==0).length
           +tls.filter(x=>x.counted && (+x.difference)!==0).length;

  h+='<div class="card"><div class="row"><div class="grow">'
    +'<div class="t">'+esc(mvLocLabel(S1.location&&S1.location.kind, S1.location&&S1.location.id))+'</div>'
    +'<div class="s">'+esc(mtz('Numărate'))+': <b>'+counted+'/'+(mats.length+tls.length)+'</b>'
    +(dif?(' · '+esc(mtz('diferențe'))+': <b>'+dif+'</b>'):'')
    +(unc?(' · '+esc(mtz('nenumărate'))+': '+unc):'')+'</div></div>'
    +'<button class="mini-btn gh" onclick="miLoad().then(miRender)">🔄</button></div>'
    +'<button class="btn" style="margin-top:.6rem" onclick="miStartScan()">📷 '+esc(mtz('Scanează'))+'</button></div>';

  /* Conflictul NU e semnalat doar prin culoare: are pictogramă, titlu și explicație. */
  if(conflicts.length){
    h+='<div class="card" style="border-left:4px solid var(--amber)"><div class="t">⚠️ '+esc(mtz('Stocul s-a modificat în timpul inventarierii'))+'</div>'
      +'<div class="s">'+esc(mtz('Cineva a mișcat marfă cât timp numărai. Numărătoarea ta e păstrată. Reîncarcă starea, verifică diferențele și confirmă din nou.'))+'</div>'
      +conflicts.map(x=>'<div class="s" style="margin-top:.35rem">• <b>'+esc(x.name)+'</b>: '
        +esc(mtz('la start'))+' '+(+x.expected_qty)+' → '+esc(mtz('acum'))+' <b>'+(+x.current_qty)+'</b>'
        +(x.counted?(' · '+esc(mtz('numărat'))+' '+(+x.counted_qty)):'')+'</div>').join('')
      +'<button class="btn" style="margin-top:.6rem" onclick="miReconcile()">🔄 '+esc(mtz('Reîncarcă starea'))+'</button></div>';
  }

  /* ── MATERIALE: În sistem / Numărat / Diferență ── */
  h+='<div class="scr-title" style="margin-top:.8rem">📦 '+esc(mtz('Materiale'))+'</div>';
  if(!mats.length) h+='<div class="card"><div class="s">'+esc(mtz('Nimic în sistem la locația asta. Scanează ce găsești.'))+'</div></div>';
  h+=mats.map(function(x){
    const d=x.counted?(+x.difference):null;
    const mark=!x.counted?'○':(d===0?'✓':(d>0?'▲':'▼'));
    const col=!x.counted?'var(--muted)':(d===0?'var(--green-ink)':(d>0?'var(--blue-ink)':'var(--amber-ink)'));
    return '<button class="card" style="width:100%;text-align:left;display:block" onclick="miSet(\''+x.line_id+'\',\'material\',\''+x.material_id+'\')">'
      +'<div class="row"><div class="grow"><div class="t">'+esc(x.name)+'</div>'
      +'<div class="s">'+esc(mtz('În sistem'))+': '+(+x.expected_qty)+' '+esc(x.unit||'')
      +' · '+esc(mtz('Numărat'))+': '+(x.counted?('<b>'+(+x.counted_qty)+'</b>'):esc(mtz('—')))+'</div></div>'
      /* starea NU e transmisă doar prin culoare: simbolul o spune singur */
      +'<div style="text-align:right;min-width:4.2rem"><div style="font-size:1.1rem;color:'+col+'">'+mark+'</div>'
      +(d!==null&&d!==0?('<div class="s" style="color:'+col+'"><b>'+(d>0?'+':'')+d+'</b></div>'):'')+'</div></div></button>';
  }).join('');

  /* ── 0181: SCULE CANTITATIVE — aceeași economie ca materialele (În sistem / Numărat / Diferență) ── */
  if(tls.length){
    h+='<div class="scr-title" style="margin-top:.8rem">🧰 '+esc(mtz('Scule pe cantități'))+'</div>';
    h+=tls.map(function(x){
      const d=x.counted?(+x.difference):null;
      const mark=!x.counted?'○':(d===0?'✓':(d>0?'▲':'▼'));
      const col=!x.counted?'var(--muted)':(d===0?'var(--green-ink)':(d>0?'var(--blue-ink)':'var(--amber-ink)'));
      return '<button class="card" style="width:100%;text-align:left;display:block" onclick="miSet(\''+x.line_id+'\',\'tool\',\''+x.tool_id+'\')">'
        +'<div class="row"><div class="grow"><div class="t">'+esc(x.name)+'</div>'
        +'<div class="s">'+esc(mtz('În sistem'))+': '+(+x.expected_qty)+' '+esc(x.unit||'buc')
        +' · '+esc(mtz('Numărat'))+': '+(x.counted?('<b>'+(+x.counted_qty)+'</b>'):esc(mtz('—')))+'</div></div>'
        +'<div style="text-align:right;min-width:4.2rem"><div style="font-size:1.1rem;color:'+col+'">'+mark+'</div>'
        +(d!==null&&d!==0?('<div class="s" style="color:'+col+'"><b>'+(d>0?'+':'')+d+'</b></div>'):'')+'</div></div></button>';
    }).join('');
  }

  /* ── SCULE: găsit / lipsă / neașteptat — se CONSTATĂ, nu se corectează ── */
  if(as.length){
    const ic={found:'✓',missing:'✗',unexpected:'＋'};
    const lb={found:'Găsit',missing:'Lipsă',unexpected:'Neașteptat aici'};
    const cl={found:'var(--green-ink)',missing:'var(--amber-ink)',unexpected:'var(--blue-ink)'};
    h+='<div class="scr-title" style="margin-top:.8rem">🛠️ '+esc(mtz('Scule'))+'</div>'
      +'<div class="card"><div class="s">'+esc(mtz('Discrepanțele se păstrează ca observație. Nimic nu se mută automat și nimic nu devine „pierdut".'))+'</div></div>'
      +as.map(function(x){
        return '<div class="card"><div class="row"><div class="grow"><div class="t">'+esc(x.label)+'</div>'
          +'<div class="s">'+esc(mtz(lb[x.class]||''))
          +(x.moved_since_start?(' · '+esc(mtz('mutată în timpul inventarierii'))):'')+'</div></div>'
          +'<div style="font-size:1.1rem;color:'+(cl[x.class]||'var(--muted)')+'">'+(ic[x.class]||'')+'</div></div></div>';
      }).join('');
  }

  /* ── acțiuni ── */
  h+='<div class="card" style="margin-top:.8rem">';
  if(miCanFinalize()){
    h+='<button class="btn" onclick="miFinalize()"'+(mi.busy?' disabled':'')+'>✅ '+esc(mtz('Finalizează inventarierea'))+'</button>'
      +'<div class="s" style="margin-top:.4rem">'+esc(mtz('Abia acum se corectează stocul. Pozițiile nenumărate rămân neatinse.'))+'</div>';
  } else {
    /* worker: poate număra, nu poate finaliza — mesaj explicit, nu buton mort */
    h+='<div class="s">🔒 '+esc(mtz('Numărătoarea ta e salvată. Finalizarea o face un responsabil.'))+'</div>';
  }
  h+='<button class="mini-btn gh" style="margin-top:.6rem;width:100%" onclick="miCancel()">'+esc(mtz('Anulează inventarierea'))+'</button></div>';
  sc.innerHTML=h;
}

/* ── scanarea continuă ── */
function mvbStartScan(){ mScanStart(mvbOnCode,{keepOpen:true}); setTimeout(mvbHud,60); }
function mvbCancelScan(){ mScanStop(); mvbRender(); }
function mvbDoneScan(){ mScanStop(); mvbRender(); }
function mvbHud(){
  const B=S._mvB; if(!B) return;
  const d=document.getElementById('mv-done'); const n=B.items.length;
  if(d) d.textContent=mtz('Gata')+(n?' ('+n+')':'');
  const el=document.getElementById('mv-hud'); if(!el) return;
  const last=B.items[n-1];
  /* un singur rând: contor + ultimul obiect scanat, separate prin „·" */
  el.innerHTML='<b>'+n+' '+esc(mtz('scanate'))+'</b>'
    +(last?(' · <span style="opacity:.85">'+(last.kind==='material'?'📦 ':'🛠️ ')+esc(last.label)
       +(last.kind==='material'?(' × '+(last.moveAll?esc(mtz('Tot')):(+last.qty))):'')+'</span>'):'');
}
async function mvbOnCode(code){
  const B=S._mvB; if(!B) return;
  let res=null;
  try{ const r=await sb.rpc('scan_resolve',{p_code:code}); if(r.error) throw r.error; res=r.data; }
  catch(e){ mScanMsg(mvErr(e)); return; }
  const st=res&&res.status;
  if(st==='unknown'){   mScanMsg('❓ '+mtz('Cod necunoscut.')); return; }
  if(st==='ambiguous'){ mScanMsg(mtz('Codul se potrivește cu mai multe obiecte. Alege din listă.')); return; }
  /* o locație scanată în timpul scanării continue = destinația, dacă nu e deja aleasă */
  if(res.kind==='warehouse'||res.kind==='site'){
    if(!B.dest){ mvbSetDest(res.kind,res.id); mScanMsg(mtz('Destinația a fost setată.')); return; }
    mScanMsg(mtz('Destinația e deja aleasă.')); return;
  }
  if(res.kind==='material'){
    if(!mvCanMaterial()){ mScanMsg('🔒 '+mtz('Nu ai dreptul să miști materiale.')); return; }
    if(B.dest && B.dest.kind==='employee'){ mScanMsg(mtz('Materialele nu se pot preda unui angajat.')); return; }
    const i=mvbFind('material',res.id);
    if(i>=0){ const it=B.items[i];
      /* rescanarea aceluiași material = încă o unitate ÎN UM-UL LUI (fără conversii inventate) */
      if(it.moveAll){ mScanMsg(mtz('Linia e pe „Tot" — schimbă cantitatea din listă.')); return; }
      it.qty=Math.round(((+it.qty||0)+1)*1000)/1000; mvbTouch(); mvbHud(); return; }
    B.items.push({kind:'material', id:res.id, label:res.label||'—', unit:res.unit||'',
                  from:null, avail:null, multi:null, qty:1, moveAll:false, err:null});
    mvbTouch(); mvbHud(); mvbLoadMat(B.items[B.items.length-1]); return;
  }
  if(res.kind==='asset'){
    if(B.dest && B.dest.kind==='consume'){ mScanMsg(mtz('Sculele nu se consumă.')); return; }
    if(mvbFind('asset',res.id)>=0){ mScanMsg('✓ '+mtz('Deja scanat')); return; }   /* exact o linie per bucată */
    B.items.push({kind:'asset', id:res.id, label:res.label||'—', from:null, xf:null, xfSet:false, err:null});
    mvbTouch(); mvbHud(); mvbLoadUnit(B.items[B.items.length-1]); return;
  }
  if(res.kind==='tool'){ mScanMsg(mtz('Scula are mai multe bucăți. Scanează eticheta bucății.')); return; }
  mScanMsg(mtz('Codul scanat nu e un obiect care se poate muta.'));
}
/* Sursa unui MATERIAL nu se ghicește: o singură locație pozitivă se precompletează, mai
   multe cer alegerea utilizatorului, zero înseamnă intrare nouă. Restul lotului merge mai
   departe — o linie neclară nu blochează scanarea. */
async function mvbLoadMat(it){
  try{
    const r=await sb.from('stock').select('qty,site_id,warehouse_id').eq('material_id',it.id).gt('qty',0);
    const rows=r.data||[];
    if(rows.length===1){ const x=rows[0];
      it.from = x.warehouse_id?{kind:'warehouse',id:x.warehouse_id}:(x.site_id?{kind:'site',id:x.site_id}:null);
      it.avail=+x.qty; it.multi=null;
    } else if(rows.length>1){ it.multi=rows; it.from=null; it.avail=null; }
  }catch(e){}
  mvbSave(); mvbHud(); if(!document.getElementById('mv-cam')) mvbRender();
}
/* Sursa unei BUCĂȚI o derivă serverul sub lacăt; ce citim aici e doar starea AȘTEPTATĂ,
   trimisă ca `expected_from` pentru detectarea conflictului. Dacă citirea eșuează,
   `xfSet` rămâne fals și NU trimitem nicio așteptare — mai bine fără gardă decât cu una falsă. */
async function mvbLoadUnit(it){
  try{
    const r=await sb.from('tool_units').select('site_id,warehouse_id,holder_employee_id,holder').eq('id',it.id).maybeSingle();
    const u=r.data; if(!u) return;
    it.from = u.warehouse_id ? {kind:'warehouse',id:u.warehouse_id}
            : u.site_id ? {kind:'site',id:u.site_id}
            : u.holder_employee_id ? {kind:'employee',id:u.holder_employee_id}
            : (String(u.holder||'').trim() ? {kind:'external'} : null);
    it.xf = it.from ? (it.from.kind==='external' ? {kind:'external'} : {kind:it.from.kind,id:it.from.id}) : null;
    it.xfSet=true;
  }catch(e){}
  mvbSave(); mvbHud(); if(!document.getElementById('mv-cam')) mvbRender();
}
function mvbSetDest(kind,id){
  const B=S._mvB;
  B.dest = (kind==='consume') ? {kind:'consume',id:null} : {kind:kind,id:id};
  const before=B.items.length;
  if(B.dest.kind==='employee') B.items=B.items.filter(x=>x.kind==='asset');
  if(B.dest.kind==='consume')  B.items=B.items.filter(x=>x.kind==='material');
  const dropped=before-B.items.length;
  mvbTouch();
  if(dropped){ const m=mtz('Am scos din listă')+' '+dropped+' '+mtz('obiecte care nu se potrivesc cu destinația.');
    if(document.getElementById('mv-cam')) mScanMsg(m); else toast(esc(m)); }
  if(document.getElementById('mv-cam')) mvbHud(); else mvbRender();
}
function mvbChangeDest(){ S._mvB.dest=null; mvbTouch(); mvbRender(); }
function mvbScanDest(){ mScanStart(async function(code){
  let res=null;
  try{ const r=await sb.rpc('scan_resolve',{p_code:code}); if(r.error) throw r.error; res=r.data; }
  catch(e){ toast(esc(mvErr(e))); mvbRender(); return; }
  if(!res||res.status!=='ok'||(res.kind!=='warehouse'&&res.kind!=='site')){
    toast(esc(mtz('Codul scanat nu e o locație.'))); mvbRender(); return; }
  mvbSetDest(res.kind,res.id);
}); }
function mvbDel(i){ const B=S._mvB; B.items.splice(i,1); mvbTouch(); mvbRender(); }
function mvbQty(i,d){ const B=S._mvB, it=B.items[i]; if(!it) return;
  it.moveAll=false;
  it.qty=Math.max(0, Math.round(((+it.qty||0)+d)*1000)/1000);
  if(it.qty===0){ B.items.splice(i,1); } mvbTouch(); mvbRender(); }
function mvbSetQty(i){ const B=S._mvB, it=B.items[i]; if(!it) return;
  const v=prompt(mtz('Cantitate')+' ('+(it.unit||'')+'):', it.moveAll?'':it.qty);
  if(v===null) return;
  let n=parseFloat(String(v).replace(',','.'));   /* tastatura RO/DE dă virgulă */
  if(isNaN(n)||n<0) n=0;
  it.moveAll=false; it.qty=Math.round(n*1000)/1000;
  if(it.qty===0){ B.items.splice(i,1); } mvbTouch(); mvbRender(); }
/* „Tot" NU fixează un număr: marchează linia, iar serverul citește cantitatea sub lacăt. */
function mvbAll(i){ const it=S._mvB.items[i]; if(!it||!it.from) return;
  it.moveAll=!it.moveAll; mvbTouch(); mvbRender(); }
function mvbSetFrom(i,j){ const it=S._mvB.items[i]; if(!it||!it.multi) return;
  const x=it.multi[j]; if(!x) return;
  const k=x.warehouse_id?'warehouse':(x.site_id?'site':null); if(!k) return;
  it.from={kind:k,id:x.warehouse_id||x.site_id}; it.avail=+x.qty; it.multi=null;
  mvbTouch(); mvbRender(); }
function mvbNewEntry(i){ const it=S._mvB.items[i]; if(!it) return;
  it.multi=null; it.from=null; it.avail=null; it.moveAll=false; mvbTouch(); mvbRender(); }

function mvbRow(it,i){
  const isMat=it.kind==='material';
  const needSrc = isMat && it.multi && it.multi.length && !it.from;
  /* Cât timp sursa e neclară, rândul NU are voie să spună „Intrare nouă": ar afirma un lucru
     (marfă venită din afară) exact în timp ce mai jos cere alegerea locației din care iese. */
  let src = it.from ? (it.from.kind==='external' ? mtz('La un terț') : mvLocLabel(it.from.kind,it.from.id))
                    : (needSrc ? mtz('Alege sursa') : (isMat ? mtz('Intrare nouă') : mtz('Nealocat')));

/* DETALIUL erorii poartă identitatea liniei vinovate: `object_id` e cheia pe care o poate
   regăsi interfața (`batch_line` e indexul CANONIC de pe server, nu cel de pe ecran). */
function mvbDetail(e){ try{ const d=e&&e.details; return d?JSON.parse(d):null; }catch(_){ return null; } }
async function mvbConfirm(){
  const B=S._mvB, err=$('mvb-err'); if(!B||!B.items.length) return;
  if(B.busy) return;                                    // gardă „în zbor" (D29)
  if(!B.dest){ if(err) err.textContent=mtz('Alege întâi destinația.'); return; }
  if(B.items.some(it=>it.kind==='material' && it.multi && it.multi.length && !it.from)){
    if(err) err.textContent=mtz('Alege sursa pentru materialele marcate.'); return; }
  if(B.items.some(it=>it.kind==='material' && !it.moveAll && !(+it.qty>0))){
    if(err) err.textContent=mtz('Cantitatea trebuie să fie mai mare decât zero.'); return; }
  if(B.dest.kind==='consume' && B.items.some(it=>!it.from)){
    if(err) err.textContent=mtz('Nu ai de unde consuma.'); return; }
  const lines=B.items.map(function(it){
    if(it.kind==='asset'){ const o={kind:'asset',unit_id:it.id};
      if(it.xfSet) o.expected_from=it.xf; return o; }
    const o={kind:'material',material_id:it.id};
    if(it.moveAll) o.move_all=true; else o.qty=+it.qty;
    if(it.from) o.from={kind:it.from.kind,id:it.from.id};
    return o; });
  const payload={to:(B.dest.kind==='consume'?{kind:'consume'}:{kind:B.dest.kind,id:B.dest.id}), lines:lines};
  /* id STABIL pe conținut: un retry după eroare de rețea refolosește exact acest id, deci
     serverul face replay în loc de a doua mutare (§18). Se resetează doar la editare. */
  if(!B.rq) B.rq=mUuid();
  B.busy=true; mvbSave();
  const btn=$('mvb-go'); if(btn) btn.disabled=true; if(err) err.textContent='';
  B.items.forEach(x=>x.err=null);
  try{
    const r=await sb.rpc('inventory_batch_move',{p_tenant_id:S.tenant,p_payload:payload,p_request_id:B.rq});
    if(r.error) throw r.error;
    const n=(r.data&&r.data.objects)||B.items.length;
    /* succesul se anunță DOAR după confirmarea serverului; abia atunci se golește schița */
    toast('✅ '+esc(mtz('Mutate'))+' '+n+' '+esc(mtz('obiecte')));
    mvbClear(); mvbReset(); mvbRender();
  }catch(e){
    /* la ORICE eroare — rețea sau refuz — schița rămâne întreagă, cu obiect, sursă,
       cantitate și `rq`, ca reîncercarea să fie sigură (§18/§19) */
    const d=mvbDetail(e), msg=mvErr(e);
    if(d && d.object_id){ const it=B.items.find(x=>x.id===d.object_id); if(it) it.err=msg; }
    mvbSave(); mvbRender();
    const e2=$('mvb-err'); if(e2) e2.textContent=msg;
  }
  finally{ B.busy=false; const b2=$('mvb-go'); if(b2) b2.disabled=false; }
}

let _rec=null,_recChunks=[],_recStart=0,_recTimer=null,_recStream=null;
function chatRecUI(on){ const b=$('chat-rec'); if(b){ b.classList.toggle('rec',on); if(!on) b.textContent='🎤'; } const inp=$('chat-input'); if(inp) inp.disabled=on; }
async function chatRec(){
  if(_rec && _rec.state==='recording'){ try{ _rec.stop(); }catch(e){} return; }
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){ toast('Înregistrarea audio nu e suportată pe acest dispozitiv/browser.'); return; }
  try{ _recStream=await navigator.mediaDevices.getUserMedia({audio:true}); }catch(e){ toast('Nu am acces la microfon. Permite accesul din setările browserului.'); return; }
  _recChunks=[]; let mime=''; ['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/aac','audio/ogg'].some(function(m){ if(window.MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m)){ mime=m; return true; } return false; });
  try{ _rec=mime?new MediaRecorder(_recStream,{mimeType:mime}):new MediaRecorder(_recStream); }catch(e){ try{ _rec=new MediaRecorder(_recStream); }catch(e2){ toast('Înregistrare indisponibilă.'); _recStream.getTracks().forEach(t=>t.stop()); return; } }
  _rec.ondataavailable=function(e){ if(e.data&&e.data.size) _recChunks.push(e.data); };
  _rec.onstop=async function(){ try{ _recStream.getTracks().forEach(t=>t.stop()); }catch(e){} clearInterval(_recTimer); chatRecUI(false);
    const type=(_rec&&_rec.mimeType)||'audio/webm'; const blob=new Blob(_recChunks,{type:type});
    if(blob.size<700){ toast('Mesaj prea scurt.'); return; }
    await chatSendVoice(blob,type); };
  try{ _rec.start(); }catch(e){ toast('Nu pot porni înregistrarea.'); _recStream.getTracks().forEach(t=>t.stop()); return; }
  _recStart=Date.now(); chatRecUI(true);
  _recTimer=setInterval(function(){ const b=$('chat-rec'); if(b){ const s=Math.floor((Date.now()-_recStart)/1000); b.textContent='⏹ '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); } if(Date.now()-_recStart>180000){ try{ _rec.stop(); }catch(e){} } }, 300);
}

  if(!('serviceWorker' in navigator)||!('PushManager' in window)||typeof Notification==='undefined') return;
  if(pushOff()) return;
  try{
    if(Notification.permission==='granted'){ try{ await mPushSubscribeSave(); }catch(e){} return; }
    if(Notification.permission==='denied') return;
    mPushPrompt();   // 'default' → cerem (necesită un tap, mai ales pe iPhone)
  }catch(e){}
}
function mPushPrompt(){
  if($('push-banner')||pushOff()) return;
  const b=document.createElement('div'); b.id='push-banner';
  b.style.cssText='position:fixed;left:.6rem;right:.6rem;top:calc(.6rem + env(safe-area-inset-top));z-index:70;background:#0f1c33;color:#fff;border-radius:14px;padding:.7rem .85rem;display:flex;align-items:center;gap:.55rem;box-shadow:0 8px 30px rgba(0,0,0,.3)';
  b.innerHTML='<div style="font-size:1.35rem">🔔</div><div style="flex:1;min-width:0"><b style="font-size:.88rem">Pornește notificările</b><div style="color:#9fb0d4;font-size:.76rem">Te anunț când ești planificat, ai o livrare sau un mesaj.</div></div>'
    +'<button onclick="pushPromptYes()" style="background:#2f6bff;color:#fff;border:none;border-radius:9px;padding:.45rem .7rem;font-weight:700;font-size:.8rem;white-space:nowrap">Activează</button>'
    +'<button onclick="pushPromptNo()" aria-label="Nu acum" style="background:none;border:none;color:#9fb0d4;font-size:1.25rem;line-height:1;padding:0 .15rem">×</button>';
  document.body.appendChild(b);
}
function pushPromptClose(){ const b=$('push-banner'); if(b) b.remove(); }
async function pushPromptYes(){ pushPromptClose(); await mPushToggle(); }
function pushPromptNo(){ pushPromptClose(); }   // doar „mai târziu" — reapare la următoarea logare; oprire definitivă din Profil
function openSetPassword(){

    '<div id="sp-msg"></div>'
    +'<div class="fld"><label>Cont</label><input value="'+esc(S.email||'')+'" disabled/></div>'

async function saveNewPassword(){
  const p=$('sp-p1').value, p2=$('sp-p2').value;
  if(p.length<6){ $('sp-msg').innerHTML='<div class="msg err">Parola trebuie să aibă minim 6 caractere.</div>'; return; }
  if(p!==p2){ $('sp-msg').innerHTML='<div class="msg err">Parolele nu coincid.</div>'; return; }
  $('sp-btn').disabled=true;
  const {error}=await sb.auth.updateUser({password:p,data:{pw_set:true}});
  $('sp-btn').disabled=false;
  if(error){ $('sp-msg').innerHTML='<div class="msg err">'+esc(error.message)+'</div>'; return; }
  closeSheet(); toast('✅ Parolă setată. De acum te poți loga cu email + parolă.');
}
async function saveProfile(){
  const full_name=$('pf-name').value.trim(), phone=$('pf-phone').value.trim();
  $('pf-save').disabled=true;
  const {error}=await sb.from('profiles').update({full_name:full_name||null,phone:phone||null}).eq('id',S.session.user.id);
  $('pf-save').disabled=false;
  if(error){ $('pf-msg').innerHTML='<div class="msg err">'+esc(error.message)+'</div>'; return; }
  S.uname=full_name||S.email; S.profile={full_name,phone};
  $('who-n').textContent=S.uname; $('av').textContent=((S.uname)[0]||'U').toUpperCase();
  closeSheet(); toast('✅ Profil salvat.');
}

/* SHEET */
function openSheet(title,html){
  $('sheet-mount').innerHTML='<div class="sheet-bg" onclick="if(event.target===this)closeSheet()"><div class="sheet"><h3>'+esc(title)+'<button class="x" onclick="closeSheet()">×</button></h3>'+html+'</div></div>';
  /* F6 — o foaie e un nivel de navigare: „înapoi" o închide pe ea, nu ecranul de sub ea. */
  if(!_mhLock) mHistPush({sheet:true});
}
/* Închiderea are UN SINGUR executor (`mSheetWipe`) și două intrări: butonul „×" (care trece
   prin istoric, ca să nu rămână o intrare orfană) și `popstate` (care execută direct). */
function closeSheet(){
  if(!_mhLock){ const st=history.state; if(st && st[MH]!=null && st.sheet){ history.back(); return; } }
  mSheetWipe();
}
function mSheetWipe(){ const m=$('sheet-mount'), bg=m&&m.firstElementChild; const after=function(){ try{ if(typeof renderCartBar==='function') renderCartBar(); }catch(e){} }; if(bg&&!bg.classList.contains('closing')){ bg.classList.add('closing'); setTimeout(()=>{ if(m) m.innerHTML=''; after(); },230); } else if(m){ m.innerHTML=''; after(); } }

const TOOL_COND={ok:'✅ Bună',dirty:'🧽 Murdar',defect:'🛠 Defect'};
/* semnează miniaturile din storage (bucket privat „docs") — img[data-sp] */
async function mobSignThumbs(){
  const els=Array.prototype.slice.call(document.querySelectorAll('img[data-sp]')).filter(e=>!e.dataset.signed);
  if(!els.length) return;
  const paths=Array.from(new Set(els.map(e=>e.getAttribute('data-sp')).filter(Boolean)));
  try{ const su=await sb.storage.from('docs').createSignedUrls(paths,3600); const map={}; (su.data||[]).forEach((x,i)=>{ if(x&&x.signedUrl) map[paths[i]]=x.signedUrl; });
    els.forEach(e=>{ e.dataset.signed='1'; const u=map[e.getAttribute('data-sp')]; if(u) e.src=u; }); }catch(e){}
}
function mobImgOpen(img){ if(!img||!img.src||img.src.indexOf('http')!==0) return; const g=lbReg([img.src]); lbOpen(g,0); }
function mThumb(path, emoji){ return path
  ? '<img data-sp="'+esc(path)+'" onclick="event.stopPropagation();mobImgOpen(this)" style="width:46px;height:46px;object-fit:cover;border-radius:9px;background:var(--line);flex:none;cursor:zoom-in"/>'
  : '<div style="width:46px;height:46px;border-radius:9px;background:var(--line);display:flex;align-items:center;justify-content:center;flex:none;font-size:1.3rem">'+(emoji||'📦')+'</div>'; }

async function toolAct(id, action, condition){
  const note=($('tool-note')&&$('tool-note').value||'').trim()||null;
  if(action==='defect'&&!note){ if($('tool-msg'))$('tool-msg').textContent='Scrie ce anume e defect.'; return; }
  try{
    const { error }=await sb.rpc('tool_move',{ p_tool:id, p_action:action, p_condition:condition, p_note:note, p_from_label:null });
    if(error) throw error;
    const lbl={receive:'✅ Ai preluat scula.',warehouse:'🏬 Marcată în depozit.',defect:'🛠 Marcată cu defect.',repaired:'✔️ Marcată reparată.'}[action]||'Salvat.';
    toast(lbl); closeSheet();
    if(S.view==='scule') scrScule();
  }catch(e){ const m=((e&&e.message)||'').toLowerCase();
    if($('tool-msg'))$('tool-msg').textContent=(!navigator.onLine||/load failed|failed to fetch|network/.test(m))?'📡 Conexiune întreruptă — încearcă din nou.':('Eroare: '+(e.message||e)); }
}
/* ════ INVENTORY-CUTOVER1/D — workspace DEPOZIT (D108/D109/D110) ══════════════
   Interfața se COMPUNE din responsabilități: `ctx.keeper_warehouses` e RAPORT (D84),
   autoritatea reală o recalculează serverul la fiecare scriere. Mișcarea fizică rămâne
   ecranul `scan` (un singur scanner, D53); aici stau stocul, cererile de transfer
   (preia → acceptă total/parțial → execută / anulează), disponibilitatea din alte
   depozite și istoricul. Datele de timp trec prin fmtDT (fusul FIRMEI, nu UTC). */
function mKeeps(){ return ((S.ctx&&S.ctx.keeper_warehouses)||[]); }
function mWkWh(){ const ks=mKeeps(); if(!ks.length) return null;
  if(!S._wkWh||!ks.find(k=>k.id===S._wkWh)) S._wkWh=ks[0].id; return S._wkWh; }
async function wkNames(){ if(S._wkWhNames) return S._wkWhNames;
  const r=await mSel('warehouses','id,name').order('name');
  S._wkWhNames=(r.data||[]); return S._wkWhNames; }
function wkWhName(id){ const w=(S._wkWhNames||[]).find(x=>x.id===id); return w?w.name:'—'; }

async function scrDepozit(){
  const ks=mKeeps(); const wh=mWkWh();
  if(!wh){ goV('acasa'); return; }
  await wkNames();
  const chips=ks.map(k=>'<button class="mini-btn'+(k.id===wh?'':' gh')+'" onclick="S._wkWh=\''+k.id+'\';render()">🏬 '+esc(k.name)+'</button>').join(' ');
  $('screen').innerHTML='<div class="scr-title">Depozit</div>'
    +(ks.length>1?'<div class="row" style="gap:.4rem;flex-wrap:wrap;margin-bottom:.6rem">'+chips+'</div>'
                 :'<div class="s" style="margin-bottom:.6rem">🏬 '+esc(wkWhName(wh))+'</div>')
    +'<div class="row" style="gap:.5rem;flex-wrap:wrap;margin-bottom:.8rem">'
    +'<button class="btn btn-soft" style="flex:1;min-width:44%" onclick="goV(\'scan\')">📷 Scanează / Mută</button>'
    +'<button class="btn btn-soft" style="flex:1;min-width:44%" onclick="wkInv()">📋 Inventariere</button>'
    +'<button class="btn btn-soft" style="flex:1;min-width:44%" onclick="wkRequests()">🔁 Cereri de transfer<span id="wk-reqn"></span></button>'
    +'<button class="btn btn-soft" style="flex:1;min-width:44%" onclick="wkLookup()">🔍 Alte depozite</button>'
    +'<button class="btn btn-soft" style="flex:1;min-width:44%" onclick="wkHistory()">🕘 Istoric mișcări</button>'
    +'<button class="btn btn-soft" style="flex:1;min-width:44%" onclick="wkOrders()">🛒 Comenzi de pregătit<span id="wk-ordn"></span></button></div>'
    +'<div class="fld"><input id="wk-q" placeholder="Caută în stoc…" oninput="wkStockFilter(this.value)"/></div>'

  const st=await mSel('stock','id,qty,min_qty,materials(name,unit)').eq('warehouse_id',wh).is('site_id',null);
  S._wkStock=(st.data||[]).filter(x=>+x.qty>0||+x.min_qty>0)

    const rq=await mSel('transfer_requests','id,status,from_warehouse_id,to_warehouse_id').in('status',['pending','accepted','prepared','loaded']);

    const e2=$('wk-ordn'); if(e2&&(or.data||[]).length) e2.textContent=' ('+or.data.length+')';
  }catch(e){}

function wkStockFilter(q){ q=(q||'').toLowerCase(); const el=$('wk-stock'); if(!el) return;
  const rows=(S._wkStock||[]).filter(x=>String((x.materials||{}).name||'').toLowerCase().indexOf(q)>=0);
  el.innerHTML=rows.length?rows.map(x=>{ const m=x.materials||{};
    return '<div class="card" style="padding:.6rem .8rem;margin-bottom:.45rem"><div class="row"><div class="grow"><div class="t">'+esc(m.name||'—')+'</div></div><div class="t">'+(+x.qty||0)+' '+esc(m.unit||'')+((+x.min_qty>0&&+x.qty<+x.min_qty)?' <span class="pill red">sub minim</span>':'')+'</div></div></div>'; }).join('')

/* ── Cererile de transfer: preia → acceptă → PREGĂTEȘTE → ÎNCARCĂ → tranzit → RECEPȚIONEAZĂ ──
   (0182/0183, D112–D116). Execuția expresă rămâne pentru transferul fără transport etapizat;
   o cerere intrată pe pregătire nu se mai execută direct (TR_STAGED, server-side). */
async function wkRequests(){
  await wkNames(); const ids=mKeeps().map(k=>k.id); const me=S.session.user.id;
  const sm=await nameMap('sites','name');
  const rq=await mSel('transfer_requests','id,status,from_warehouse_id,to_warehouse_id,to_site_id,needed_by,demand_id,requested_by,claimed_by,version,created_at')
    .in('status',['pending','accepted','prepared','loaded']).order('created_at',{ascending:false}).limit(60);
  if(rq.error){ toast(mvErr(rq.error)); return; }
  const all=(rq.data||[]).filter(r=>ids.indexOf(r.from_warehouse_id)>=0||ids.indexOf(r.to_warehouse_id)>=0||r.requested_by===me);
  const rids=all.map(r=>r.id); S._wkItems={}; S._wkReq={}; all.forEach(r=>S._wkReq[r.id]=r);
  if(rids.length){ const it=await mSel('transfer_request_items','id,request_id,qty_requested,qty_accepted,qty_prepared,qty_loaded,qty_received,unit,materials(name)').in('request_id',rids);
    (it.data||[]).forEach(x=>{(S._wkItems[x.request_id]=S._wkItems[x.request_id]||[]).push(x);}); }
  const destName=r=>r.to_warehouse_id?wkWhName(r.to_warehouse_id):('🏗️ '+(sm[r.to_site_id]||'—'));
  const qline=(r,x,dir)=>{
    if(dir==='in'&&r.status==='pending'&&r.claimed_by===me)
      return '<input id="wk-acc-'+x.id+'" type="number" inputmode="decimal" min="0" max="'+(+x.qty_requested)+'" value="'+(+x.qty_requested)+'" style="width:76px;padding:.2rem .35rem"> / '+(+x.qty_requested);
    let s=''+(+x.qty_requested);
    if(x.qty_accepted!=null) s=(+x.qty_accepted)+' <span>rez.</span>';
    if(x.qty_prepared!=null) s+=' · '+(+x.qty_prepared)+' <span>preg.</span>';
    if(x.qty_loaded!=null){ s+=' · '+(+x.qty_loaded)+' <span>înc.</span>';
      const tr=(+x.qty_loaded)-(+x.qty_received||0);
      /* pe cererea închisă diferența e lipsa DECLARATĂ, nu „pe drum" (defect prins de E2E) */
      s+=' · '+(+x.qty_received||0)+' <span>primit</span>'
        +(tr>0?(' · <b>'+tr+'</b> <span>'+(r.status==='fulfilled'?'pierdut în tranzit':'pe drum')+'</span>'):''); }
    return s;
  };
  const card=(r,dir)=>{ const its=S._wkItems[r.id]||[];
    const lines=its.map(x=>'<div class="s">• '+esc((x.materials||{}).name||'—')+' — '+qline(r,x,dir)+' '+esc(x.unit||'')+'</div>').join('');
    let act='';
    if(dir==='in'){

    +its.map(x=>'<div class="fld"><label>'+esc((x.materials||{}).name||'—')+' — încărcat '+(+x.qty_loaded)+' · primit '+(+x.qty_received||0)+' '+esc(x.unit||'')+'</label>'
      +'<input id="wkr-'+x.id+'" type="number" inputmode="decimal" min="'+(+x.qty_received||0)+'" max="'+(+x.qty_loaded)+'" value="'+(+x.qty_loaded)+'"/></div>').join('')

async function wkReceiveGo(id,final){
  const r=S._wkReq[id]; const its=(S._wkItems[id]||[]).filter(x=>(+x.qty_loaded||0)>0); const map={}; let bad=false;
  its.forEach(x=>{ const i=$('wkr-'+x.id); if(!i) return; const v=parseFloat(i.value);
    if(isNaN(v)||v<(+x.qty_received||0)||v>+x.qty_loaded){ bad=true; return; } map[x.id]=v; });
  if(bad){ $('wkr-msg').innerHTML='<div class="msg err">Totalul primit trebuie să fie între ce era deja primit și ce s-a încărcat.</div>'; return; }
  const lost=$('wkr-lost')&&$('wkr-lost').checked;
  const q=await sb.rpc('transfer_request_receive',{p_tenant_id:S.tenant,p_request_id:id,p_items:map,p_final:final,p_shortfall:(final&&lost)?'lost':null,p_expected_version:r.version});
  if(q.error){ $('wkr-msg').innerHTML='<div class="msg err">'+mvErr(q.error)+'</div>'; return; }
  toast(final?'📥 Recepție finalizată.':'Recepție parțială salvată.'); wkRequests();
}

async function wkDecide(id,ver,action){
  const payload={request_id:id,action:action};
  if(action==='accept'){ const over={}; let bad=false;
    (S._wkItems[id]||[]).forEach(x=>{ const i=$('wk-acc-'+x.id); if(!i) return;
      const v=parseFloat(i.value); if(isNaN(v)||v<0||v>+x.qty_requested){ bad=true; return; }
      if(v!==+x.qty_requested) over[x.id]=v; });
    if(bad){ toast('Cantitățile acceptate trebuie să fie între 0 și cerut.'); return; }
    if(Object.keys(over).length) payload.overrides=over; }
  const r=await sb.rpc('transfer_request_decide',{p_tenant_id:S.tenant,p_payload:payload,p_expected_version:ver});
  if(r.error){ toast(mvErr(r.error)); } else toast(action==='accept'?'✅ Cerere acceptată — cantitatea e rezervată.':'✖ Cerere refuzată.');
  wkRequests(); }

  if(!cfgOk()){$('login').classList.remove('hidden');hideSplash();$('cfg-warn').classList.remove('hidden');$('cfg-warn').innerHTML='⚙️ Configurare incompletă (cheia publishable).';$('l-btn').disabled=true;return;}
  sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  sb.auth.onAuthStateChange((evt)=>{ if(evt==='PASSWORD_RECOVERY'){ mShowReset(); return; } if(evt==='SIGNED_IN' && !S.tenant) boot(); });
  setTimeout(function(){ if(document.getElementById('splash')){ var a=$('app'); if(a&&a.classList.contains('hidden')) $('login').classList.remove('hidden'); hideSplash(); } }, 9000);
  try{ await boot(); }catch(e){ $('login').classList.remove('hidden'); hideSplash(); }
})();
</script>
<script>
/* 👁 „Arată parola" — se aplică automat pe TOATE câmpurile type=password (acum și cele generate dinamic). */
(function(){
  function enhance(inp){
    if(!inp || inp.getAttribute('data-eye')) return;
    inp.setAttribute('data-eye','1');
    var p=inp.parentNode; if(!p) return;
    var w=document.createElement('span'); w.className='pw-wrap';
    w.style.cssText='position:relative;display:block;flex:1 1 auto;min-width:0;width:100%';
    p.insertBefore(w, inp); w.appendChild(inp);
    inp.style.width='100%'; inp.style.flex=''; inp.style.paddingRight='2.3rem'; inp.style.boxSizing='border-box';
    var b=document.createElement('button');
    b.type='button'; b.tabIndex=-1; b.className='pw-eye';
    b.title=(window.tz?tz('Arată / ascunde parola'):'Arată / ascunde parola');
    b.setAttribute('aria-label', b.title);
    b.textContent='👁';
    b.style.cssText='position:absolute;right:.45rem;top:50%;transform:translateY(-50%);background:none;border:0;cursor:pointer;font-size:1.15rem;line-height:1;opacity:.55;padding:.2rem .3rem;z-index:2';
    b.addEventListener('click', function(e){ e.preventDefault(); e.stopPropagation(); var show=(inp.type==='password'); inp.type=show?'text':'password'; b.textContent=show?'🙈':'👁'; b.style.opacity=show?'.95':'.55'; try{ inp.focus(); }catch(_){} });
    w.appendChild(b);
  }
  function scan(root){ try{ (root||document).querySelectorAll('input[type="password"]:not([data-eye])').forEach(enhance); }catch(e){} }
  function init(){ scan(document); try{ var mo=new MutationObserver(function(muts){ for(var i=0;i<muts.length;i++){ if(muts[i].addedNodes&&muts[i].addedNodes.length){ scan(document); break; } } }); mo.observe(document.body,{childList:true,subtree:true}); }catch(e){} }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init); else init();
})();
</script>
