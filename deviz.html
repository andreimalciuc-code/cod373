<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<style>
  :root{ --ink:#0f1c33; --muted:#6b7793; --line:#e6eaf2; --primary:#2f6bff; --bg:#f4f6fb; --red:#dc2626; --green:#16a34a; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; color:var(--ink); background:var(--bg); font-size:14px; }
  header{ background:#fff; border-bottom:1px solid var(--line); padding:.7rem 1rem; display:flex; align-items:center; gap:.8rem; flex-wrap:wrap; position:sticky; top:0; z-index:30; }
  header h1{ font-size:1.05rem; margin:0; } .spacer{ flex:1; }
  .pill{ font-size:.72rem; padding:.18rem .6rem; border-radius:999px; font-weight:700; }
  .pill.draft{ background:#eef2ff; color:#3730a3; } .pill.sent{ background:#fef9c3; color:#854d0e; } .pill.accepted{ background:#dcfce7; color:#15803d; } .pill.rejected{ background:#fee2e2; color:#b91c1c; }
  .btn{ border:1px solid var(--line); background:#fff; border-radius:9px; padding:.5rem .8rem; font-size:.85rem; cursor:pointer; color:var(--ink); white-space:nowrap; }
  .btn:hover{ background:#f1f5f9; } .btn.primary{ background:var(--primary); color:#fff; border-color:var(--primary); } .btn.primary:hover{ filter:brightness(1.05); }
  .wrap{ max-width:1440px; margin:0 auto; padding:1.1rem; display:grid; grid-template-columns:1fr 320px; gap:1.1rem; align-items:start; }
  .lines{ table-layout:fixed; }
  @media(max-width:1200px){ .wrap{ grid-template-columns:1fr; } }
  .panel{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:1.1rem; margin-bottom:1.1rem; }
  .panel h3{ margin:0 0 .8rem; font-size:.95rem; }
  .right{ position:sticky; top:72px; }
  .field{ margin-bottom:.7rem; } label{ display:block; font-size:.78rem; font-weight:600; margin-bottom:.25rem; color:#46506a; }
  input,select,textarea{ width:100%; padding:.5rem .65rem; border:1px solid var(--line); border-radius:9px; font-size:.88rem; font-family:inherit; outline:none; background:#fff; }
  input[type=number]{ -moz-appearance:textfield; }
  input[type=number]::-webkit-outer-spin-button, input[type=number]::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  input:focus,select:focus,textarea:focus{ border-color:var(--primary); }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:.6rem; }
  .lines{ width:100%; border-collapse:collapse; }
  .lines th{ text-align:left; font-size:.7rem; text-transform:uppercase; color:var(--muted); padding:.3rem .35rem; border-bottom:1px solid var(--line); }
  .lines td{ padding:.25rem .25rem; vertical-align:top; border-bottom:1px solid #f1f4fa; }
  .lines td input{ padding:.45rem .5rem; }
  .grip{ cursor:grab; color:#c2cbdb; padding:.4rem .1rem; }
  .ta-wrap{ position:relative; }
  .lines td textarea.lname{ width:100%; padding:.45rem .5rem; resize:none; overflow:hidden; line-height:1.3; min-height:2.2em; white-space:pre-wrap; word-break:break-word; font-family:inherit; font-size:.88rem; }
  .dd{ position:absolute; z-index:40; left:0; right:0; top:100%; background:#fff; border:1px solid var(--line); border-radius:10px; box-shadow:0 10px 30px rgba(15,28,51,.14); max-height:280px; overflow:auto; margin-top:2px; }
  .dd .it{ padding:.5rem .7rem; cursor:pointer; display:flex; gap:.5rem; align-items:center; font-size:.85rem; border-bottom:1px solid #f4f6fb; }
  .dd .it:hover, .dd .it.active{ background:#eff4ff; }
  .dd .it .nm{ flex:1; } .dd .it .pr{ color:var(--muted); font-size:.78rem; white-space:nowrap; }
  .dd .add{ color:var(--primary); font-weight:700; }
  .sub{ color:var(--muted); font-size:.8rem; }
  .totrow{ display:flex; justify-content:space-between; padding:.35rem 0; }
  .totrow.g{ font-size:1.15rem; font-weight:800; border-top:2px solid var(--ink); margin-top:.4rem; padding-top:.6rem; }
  .delx{ background:none; border:none; color:#c2452f; cursor:pointer; font-size:1.1rem; padding:.3rem; }
  .legend{ font-size:.72rem; color:var(--muted); margin-top:.4rem; }
  .center{ text-align:center; padding:3rem 1rem; color:var(--muted); }
  .toast{ position:fixed; bottom:1rem; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:.6rem 1rem; border-radius:10px; font-size:.85rem; z-index:80; opacity:0; transition:.2s; }
  .toast.show{ opacity:1; }
  .ov{ position:fixed; inset:0; background:rgba(15,28,51,.5); display:flex; align-items:center; justify-content:center; z-index:90; padding:1rem; }
  .modal{ background:#fff; border-radius:14px; width:100%; max-width:420px; padding:1.1rem; }
  .modal h3{ margin:0 0 .8rem; }
  .addline{ background:none; border:1px dashed var(--line); color:var(--primary); border-radius:9px; padding:.5rem .8rem; cursor:pointer; font-size:.85rem; margin-top:.5rem; }
</style>
</head>
<body>
<header>
  <h1>📋 Ofertă / Deviz</h1>
  <span id="hd-num" class="sub"></span>
  <span id="hd-status"></span>
  <div class="spacer"></div>
  <button class="btn" onclick="goBack()">↩ Înapoi</button>
  <button class="btn" id="btn-plan" onclick="togglePlan()">📐 Plan</button>
  <button class="btn" id="btn-prev" onclick="pdf()">👁 Previzualizare</button>
  <button class="btn" id="btn-sendcl" onclick="sendOfferPortal()">🤝 Trimite clientului</button>
  <button class="btn primary" id="btn-save" onclick="save()">💾 Salvează</button>
</header>
<div id="root"><div class="center">Se încarcă…</div></div>
<div id="toast" class="toast"></div>
<div id="modal-mount"></div>

<script>
const SUPABASE_URL='https://vzatmfhkwiojqkowtftg.supabase.co';
const SUPABASE_KEY='sb_publishable_wNj9S8eta39n1Gkq_g-gfA_idl_pbPy';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
const esc=s=>(s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CURSYM={MDL:'MDL',EUR:'€',RON:'lei',USD:'$',UAH:'₴',GBP:'£'}; let CUR='MDL';
const money=n=>new Intl.NumberFormat('ro-RO',{minimumFractionDigits:2,maximumFractionDigits:2}).format(+n||0)+' '+(CURSYM[CUR]||CUR);
const num2=n=>{ const r=Math.round((+n||0)*100)/100; return r%1===0?r:r.toFixed(2); };
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2200); }
function param(k){ return new URLSearchParams(location.search).get(k); }
function goBack(){ if(history.length>1) history.back(); else location.href='app.html'; }
function base(){ return location.href.split('?')[0].split('#')[0].replace(/\/[^/]*$/,'/'); }

const STATUS={draft:'Ciornă',sent:'Trimisă',accepted:'Acceptată',rejected:'Respinsă'};
const FIN=['owner','admin','manager','accountant'];
let S={ id:null, role:null, canEdit:false, firm:{}, est:{status:'draft',number:'',client_id:'',title:'',issue_date:new Date().toISOString().slice(0,10),valid_until:'',notes:'',disc_mode:'none',disc_value:0,vat_mode:'line',vat_value:0,materials_mode:'detailed',skonto_off:false,skonto_pct:null},
        lines:[], groups:[], clients:[], catalog:[], normMat:{}, _activeDD:null, lineThumbs:{} };
function gid(){ return 'g'+Date.now().toString(36)+Math.floor(Math.random()*1000); }
function coDateFmt(){ return (S.firm&&S.firm.automations&&S.firm.automations.date_fmt)||'DD.MM.YYYY'; }
function fmtDate(iso){ if(!iso) return ''; const s=String(iso).slice(0,10); const p=s.split('-'); if(p.length<3) return s; const y=p[0],m=p[1],d=p[2]; const f=coDateFmt(); return f==='YYYY-MM-DD'?s:f==='DD/MM/YYYY'?(d+'/'+m+'/'+y):f==='MM/DD/YYYY'?(m+'/'+d+'/'+y):(d+'.'+m+'.'+y); }
/* ── schiță auto-salvată (ofertă nouă) ── */
let _dzT=null;
function dkey(){ return 'c373_draft_deviz_'+(S.tenant||''); }
function getDraftDz(){ try{ const r=localStorage.getItem(dkey()); return r?JSON.parse(r):null; }catch(e){ return null; } }
function saveDraftDz(){ if(S.id) return; try{ const has=(S.lines||[]).some(l=>(l.name||'').trim()||(+l.unit_price>0)); if(!has){ localStorage.removeItem(dkey()); return; } localStorage.setItem(dkey(), JSON.stringify({t:Date.now(), est:S.est, lines:S.lines, groups:S.groups})); }catch(e){} }
function clearDraftDz(){ try{ localStorage.removeItem(dkey()); }catch(e){} }
function scheduleDraft(){ if(S.id) return; clearTimeout(_dzT); _dzT=setTimeout(saveDraftDz,600); }

async function boot(){
  const { data:{ session } }=await sb.auth.getSession();
  if(!session){ $('root').innerHTML='<div class="center">🔒 Trebuie să fii autentificat.<br><br><a class="btn primary" href="app.html">Deschide aplicația</a></div>'; return; }
  const mem=await sb.from('memberships').select('role, tenant_id, tenants(name,idno,address,phone,vat_rate,currency,logo_url,automations)').eq('active',true).limit(1).maybeSingle();
  S.role=mem.data?mem.data.role:null; S.tenant=mem.data?mem.data.tenant_id:null; S.firm=(mem.data&&mem.data.tenants)||{}; S.canEdit=FIN.includes(S.role); CUR=(S.firm.currency||'MDL').toUpperCase();
  if(!S.canEdit){ $('root').innerHTML='<div class="center">🔒 Doar proprietar/administrator/manager/contabil pot crea oferte.</div>'; return; }
  await loadCatalog();
  const id=param('id');
  if(id){ await loadEstimate(id); }
  else { S.est.number=await genNumber(); if(param('client')) S.est.client_id=param('client'); S.lines=[blankLine()];
    S.est.vat_value=(S.firm.vat_rate!=null?S.firm.vat_rate:20); S.est.vat_mode=(S.firm.vat_rate?'line':'none');
    if(param('prefill')){ try{ const pf=JSON.parse(localStorage.getItem('c373_offer_prefill')||'null'); if(pf && pf.lines && pf.lines.length){ S.lines=pf.lines.map(l=>Object.assign(blankLine(),{name:l.name,qty:+l.qty||1,unit:l.unit||'buc',unit_price:+l.unit_price||0,vat_rate:(l.vat_rate!=null?+l.vat_rate:(S.firm.vat_rate!=null?S.firm.vat_rate:20))})); S._restored=true; } localStorage.removeItem('c373_offer_prefill'); }catch(e){} }
    else if(!param('survey')){ const dr=getDraftDz(); if(dr && dr.lines && dr.lines.length){ if(dr.est) S.est=Object.assign(S.est,dr.est); S.lines=dr.lines; if(Array.isArray(dr.groups)) S.groups=dr.groups; reorderLinesBySection(); S._restored=true; } } }
  // din fisa de previzualizare
  if(param('survey')) await fromSurvey(param('survey'));
  if(param('print')){ await pdf(param('doctype')||'oferta', true); return; }
  render();
  signLineThumbs();
  document.addEventListener('input',scheduleDraft); document.addEventListener('change',scheduleDraft);
  if(S._restored) toast('↩️ Schiță nesalvată restaurată.');
}
/* semneaza pozele liniilor pentru previzualizare in editor (cache), apoi re-randeaza liniile */
async function signLineThumbs(){
  const paths=S.lines.filter(l=>l.photo_url && !S.lineThumbs[l.photo_url]).map(l=>l.photo_url);
  if(!paths.length){ return; }
  try{ const su=await sb.storage.from('docs').createSignedUrls(paths,3600); (su.data||[]).forEach((x,idx)=>{ if(x.signedUrl) S.lineThumbs[paths[idx]]=x.signedUrl; }); }catch(e){}
  renderLines();
}
async function genNumber(){ try{ const { count }=await sb.from('estimates').select('id',{count:'exact',head:true}); return 'OF-'+new Date().getFullYear()+'-'+String((count||0)+1).padStart(4,'0'); }catch(e){ return 'OF-'+new Date().getFullYear()+'-'+Math.floor(Math.random()*900+100); } }
function blankLine(){ return { name:'', qty:1, unit:'buc', unit_price:0, vat_rate:(S.firm.vat_rate!=null?S.firm.vat_rate:20), disc:0, group:'', kind:'service', norm_code:null, description:'', photo_url:null }; }

async function loadCatalog(){
  const [cl, svc, nrm, mat, nm]=await Promise.all([
    sb.from('clients').select('id,name').order('name'),
    sb.from('services').select('id,name,unit,price,vat_rate,description,photo_url').eq('active',true),
    sb.from('norms').select('id,code,name,unit,category,unit_price'),
    sb.from('materials').select('id,name,unit,last_price,vat_rate,description,photo_url').eq('active',true),
    sb.from('norm_materials').select('norm_code,material_name,unit,qty_per_unit,kind')
  ]);
  S.clients=cl.data||[];
  S.catalog=[].concat(
    (svc.data||[]).map(x=>({src:'service',id:x.id,icon:'🧰',name:x.name,unit:x.unit||'buc',price:+x.price||0,vat:(x.vat_rate!=null?+x.vat_rate:20),kind:'service',desc:x.description||'',photo:x.photo_url||null})),
    (nrm.data||[]).map(x=>({src:'norm',icon:'📐',name:x.name,unit:x.unit||'m2',price:+x.unit_price||0,vat:20,kind:'service',norm_code:x.code,cat:x.category})),
    (mat.data||[]).map(x=>({src:'material',id:x.id,icon:'📦',name:x.name,unit:x.unit||'buc',price:+x.last_price||0,vat:(x.vat_rate!=null?+x.vat_rate:20),kind:'material',desc:x.description||'',photo:x.photo_url||null}))
  );
  S.normMat={}; (nm.data||[]).forEach(x=>{ (S.normMat[x.norm_code]=S.normMat[x.norm_code]||[]).push(x); });
}
async function loadEstimate(id){
  const e=await sb.from('estimates').select('*').eq('id',id).single();
  if(e.error){ toast('Eroare: '+e.error.message); return; }
  S.id=id; S.est={ status:e.data.status, number:e.data.number||'', client_id:e.data.client_id||'', title:e.data.title||'', site_id:e.data.site_id||null,
    issue_date:e.data.issue_date||new Date().toISOString().slice(0,10), valid_until:e.data.valid_until||'', notes:e.data.notes||'',
    disc_mode:e.data.disc_mode||'none', disc_value:+e.data.disc_value||0, vat_mode:e.data.vat_mode||'line', vat_value:+e.data.vat_value||0, materials_mode:e.data.materials_mode||'detailed', skonto_off:!!e.data.skonto_off, skonto_pct:(e.data.skonto_pct!=null?+e.data.skonto_pct:null),
    signature_url:e.data.signature_url||null, signer_name:e.data.signer_name||null, signed_at:e.data.signed_at||null, plan_url:e.data.plan_url||null };
  S.groups=Array.isArray(e.data.groups)?e.data.groups.map(g=>({id:g.id,name:g.name||'',vat:+g.vat||0,disc:+g.disc||0})):[];
  const it=await sb.from('estimate_items').select('*').eq('estimate_id',id);
  const mapped=((it.data||[]).sort((a,b)=>(a.position||0)-(b.position||0))).map(x=>{ const c=S.catalog.find(c=>c.name===x.name&&c.src==='norm'); return { name:x.name, qty:+x.qty, unit:x.unit, unit_price:+x.unit_price, vat_rate:+x.vat_rate, disc:+x.disc||0, group:x.group_id||'', kind:x.kind||'service', norm_code:c?c.norm_code:null, description:x.description||'', photo_url:x.photo_url||null }; });
  // Auto-curățare: elimină liniile EXACT identice (corupere veche dintr-o regulă RLS care bloca ștergerea la salvarea făcută de manager/contabil → liniile se dublau la fiecare salvare).
  const _seen=new Set(); const _before=mapped.length;
  const deduped=mapped.filter(l=>{ const k=[l.name,l.qty,l.unit,l.unit_price,l.vat_rate,l.disc,l.group,l.description||'',l.photo_url||''].join('¦'); if(_seen.has(k)) return false; _seen.add(k); return true; });
  const _removed=_before-deduped.length;
  S.lines=deduped; reorderLinesBySection();
  if(!S.lines.length) S.lines=[blankLine()];
  if(_removed>0) setTimeout(function(){ toast('⚠️ Am eliminat '+_removed+' linii dublate (eroare mai veche). Verifică totalul și apasă „Salvează" ca să se corecteze definitiv.'); },500);
}
async function fromSurvey(sid){
  const sv=await sb.from('site_surveys').select('name,client_id,area_m2').eq('id',sid).single();
  const m=await sb.from('survey_measurements').select('*').eq('survey_id',sid);
  if(sv.data){ if(sv.data.client_id) S.est.client_id=sv.data.client_id; if(sv.data.name && !S.est.title) S.est.title=sv.data.name; }
  const meas=(m.data||[]).sort((a,b)=>(a.position||0)-(b.position||0));
  if(!meas.length) return;
  const dv=(S.firm.vat_rate!=null?+S.firm.vat_rate:20);
  // încarcă serviciile legate + rețetele lor + prețurile materialelor
  const svcIds=[...new Set(meas.map(x=>x.service_id).filter(Boolean))];
  let svcById={}, recBy={}, matById={};
  if(svcIds.length){
    const svc=((await sb.from('services').select('id,name,unit,price,vat_rate,description').in('id',svcIds)).data)||[];
    svc.forEach(s=>svcById[s.id]=s);
    const sm=((await sb.from('service_materials').select('*').in('service_id',svcIds)).data)||[];
    const matIds=[...new Set(sm.map(r=>r.material_id).filter(Boolean))];
    if(matIds.length){ const mats=((await sb.from('materials').select('id,name,unit,last_price,vat_rate,description,photo_url').in('id',matIds)).data)||[]; mats.forEach(x=>matById[x.id]=x); }
    sm.forEach(r=>{ (recBy[r.service_id]=recBy[r.service_id]||[]).push(r); });
  }
  const lines=[], groups=[];
  meas.forEach((x,gi)=>{
    const q=+x.qty||1;
    const svc=x.service_id?svcById[x.service_id]:null;
    if(svc){
      const gv='g'+Date.now().toString(36)+gi+Math.floor(Math.random()*1000);
      groups.push({ id:gv, name:svc.name||x.label, vat:(svc.vat_rate!=null?+svc.vat_rate:dv), disc:0 });
      // manopera = prețul serviciului
      lines.push(Object.assign(blankLine(),{ name:svc.name||x.label, qty:q, unit:x.unit||svc.unit||'buc', unit_price:+svc.price||0, vat_rate:(svc.vat_rate!=null?+svc.vat_rate:dv), kind:'service', description:x.note||svc.description||'', group:gv, cat_id:svc.id, cat_src:'services', _catName:svc.name, _catPrice:+svc.price||0, _catUnit:svc.unit||'' }));
      // materiale din rețetă (consum × (1+pierdere%) × volum)
      (recBy[x.service_id]||[]).sort((a,b)=>(a.position||0)-(b.position||0)).forEach(r=>{
        const mat=r.material_id?matById[r.material_id]:null;
        const mq=q*(+r.qty_per_unit||0)*(1+(+r.waste_pct||0)/100);
        lines.push(Object.assign(blankLine(),{ name:(mat&&mat.name)||r.material_name||'Material', qty:+mq.toFixed(3), unit:(mat&&mat.unit)||r.unit||'buc', unit_price:(mat?+mat.last_price||0:0), vat_rate:(mat&&mat.vat_rate!=null?+mat.vat_rate:dv), kind:'material', description:(mat&&mat.description)||'', photo_url:(mat&&mat.photo_url)||null, group:gv, cat_id:r.material_id||null, cat_src:r.material_id?'materials':'', _catName:(mat&&mat.name)||r.material_name||'', _catPrice:(mat?+mat.last_price||0:0), _catUnit:(mat&&mat.unit)||r.unit||'', _catDesc:(mat&&mat.description)||'', _catPhoto:(mat&&mat.photo_url)||'' }));
      });
    } else {
      lines.push(Object.assign(blankLine(),{ name:x.label, qty:q, unit:x.unit||'m2', unit_price:0, vat_rate:dv, kind:'service', description:x.note||'', group:'' }));
    }
  });
  S.lines=lines; S.groups=groups; reorderLinesBySection();
  if(typeof signLineThumbs==='function') signLineThumbs();
}

/* păstrează S.lines ordonate: fără grup întâi, apoi pe grupuri (în ordinea S.groups) */
function reorderLinesBySection(){
  const known=new Set(S.groups.map(g=>g.id));
  S.lines.forEach(l=>{ if(l.group && !known.has(l.group)) l.group=''; });
  let arr=S.lines.filter(l=>!l.group);
  S.groups.forEach(g=>{ arr=arr.concat(S.lines.filter(l=>l.group===g.id)); });
  S.lines=arr;
}
function lineNet(l){ const g=(+l.qty||0)*(+l.unit_price||0); return (!l.group && S.est.disc_mode==='line')? g*(1-(+l.disc||0)/100) : g; }
/* TVA efectiv pe linie: în grup sau în mod „pe poziție" → cota liniei; altfel 0 (mod unificat/fără = TVA doar la final) */
function lineEffVat(l){ const inGroup=!!l.group; if(inGroup) return +l.vat_rate||0; const vm=S.est.vat_mode; if(vm==='line') return +l.vat_rate||0; if(vm==='total') return +S.est.vat_value||0; return 0; }
function lineGross(l){ return lineNet(l)*(1+lineEffVat(l)/100); }
/* Selector TVA pe linie: cotele din țara/firma (Setări) + „—" (fără TVA) */
function vatRates(){ const rs=(S.firm&&S.firm.automations&&S.firm.automations.vat_rates)||[20,8,0]; return rs.map(Number).filter(r=>!isNaN(r)&&r>=0); }
function vatOptsHtml(cur){ cur=Math.round((+cur||0)*100)/100; let rs=vatRates().filter(r=>r>0); if(cur>0&&rs.indexOf(cur)<0) rs.push(cur); rs=Array.from(new Set(rs)).sort((a,b)=>b-a);
  return '<option value="0"'+(cur===0?' selected':'')+'>—</option>'+rs.map(r=>'<option value="'+r+'"'+(r===cur?' selected':'')+'>'+num2(r)+'%</option>').join(''); }
function vatSelectHtml(i,cur){ return '<select id="vt-'+i+'" onchange="lineSetVat('+i+',this.value)" style="width:100%;font-weight:600">'+vatOptsHtml(cur)+'</select>'; }
function lineSetVat(i,v){ const rate=(v===''?0:+v||0); const l=S.lines[i]; if(!l) return;
  if(!l.group && S.est.vat_mode==='total'){ S.est.vat_value=rate; S.lines.forEach(x=>{ if(!x.group) x.vat_rate=rate; }); render(); }
  else { l.vat_rate=rate; refreshLineTotal(i); renderSummary(); } }
function groupTotals(grp){ let net=0, vat=0; const f=(1-(+grp.disc||0)/100); S.lines.forEach(l=>{ if(l.group===grp.id){ const g=(+l.qty||0)*(+l.unit_price||0); net+=g; vat+=g*f*(+l.vat_rate||0)/100; } }); const base=net*f; return { net:net, base:base, vat:vat, total:base+vat }; }
function totals(){
  const dm=S.est.disc_mode||'none', vm=S.est.vat_mode||'none';
  let gross=0, base=0, disc=0, vat=0;
  // poziții fără grup (mod document)
  const ung=S.lines.filter(l=>!l.group);
  let uGross=0,uNet=0; ung.forEach(l=>{ const g=(+l.qty||0)*(+l.unit_price||0); uGross+=g; uNet+=(dm==='line'? g*(1-(+l.disc||0)/100):g); });
  const uF=(dm==='total')?(1-(+S.est.disc_value||0)/100):1; const uBase=uNet*uF;
  gross+=uGross; base+=uBase; disc+=(uGross-uBase);
  if(vm==='line') ung.forEach(l=>{ const g=(+l.qty||0)*(+l.unit_price||0); const net=(dm==='line'? g*(1-(+l.disc||0)/100):g)*uF; vat+=net*(+l.vat_rate||0)/100; });
  else if(vm==='total') vat+=uBase*(+S.est.vat_value||0)/100;
  // grupuri (TVA/reducere proprii)
  S.groups.forEach(grp=>{ const gt=groupTotals(grp); gross+=gt.net; base+=gt.base; disc+=(gt.net-gt.base); vat+=gt.vat; });
  return { gross:gross, sub:base, disc:disc, vat:vat, total:base+vat };
}
function prepayNote(total){
  const au=(S.firm&&S.firm.automations)||{};
  if(au.prepay_show===false) return null;
  if(S.est.skonto_off) return null;
  const pct=(S.est.skonto_pct!=null && S.est.skonto_pct!=='') ? +S.est.skonto_pct : (au.prepay_pct!=null?+au.prepay_pct:3);
  if(!(pct>0)||!(total>0)) return null;
  const save=Math.round(total*pct/100*100)/100;
  return { pct:pct, save:save, after:Math.round((total-save)*100)/100 };
}

function rebuildLinesFromDOM(){

  document.querySelectorAll('#lines-wrap .lbody').forEach(tb=>{ const g=tb.getAttribute('data-g')||''; tb.querySelectorAll('tr[data-i]').forEach(tr=>{ const oi=+tr.getAttribute('data-i'); const l=S.lines[oi]; if(l){ l.group=g; nl.push(l); } }); });

function rebuildGroupsFromDOM(){
  const order=[]; document.querySelectorAll('#groups-wrap .lgroup').forEach(d=>{ const g=S.groups.find(x=>x.id===d.getAttribute('data-g')); if(g) order.push(g); });

function aiOffer(){

async function aiOfferRun(){
  const input=($('ai-input').value||'').trim(); if(!input){ $('ai-msg').textContent='Scrie o descriere.'; return; }
  const btn=$('ai-go'); if(btn){ btn.disabled=true; btn.textContent='Se generează…'; }
  try{
    const lang=(window.C373lang||'ro');
    const cur=(S.firm&&S.firm.currency)||'MDL';
    const au=(S.firm&&S.firm.automations)||{};
    const { data, error }=await sb.functions.invoke('ai',{ body:{ mode:'offer', input, lang, currency:cur, tenant_id:S.tenant, key:au.anthropic_key||undefined, model:au.ai_model||'claude-haiku-4-5' } });
    if(error) throw new Error(error.message||'Eroare apel AI');
    if(data && data.ok!==true) throw new Error(data.message||data.detail||data.error||'Eroare AI');
    let txt=(data&&data.text)||''; const m=txt.match(/\{[\s\S]*\}/); if(m) txt=m[0];
    const parsed=JSON.parse(txt); const lines=(parsed.lines||parsed||[]);
    if(!Array.isArray(lines)||!lines.length) throw new Error('Niciun rezultat. Reformulează descrierea.');
    const vr=(S.firm.vat_rate!=null?S.firm.vat_rate:20);
    const added=lines.slice(0,25).map(x=>({ name:(x.name||'').toString().slice(0,200), qty:+x.qty||1, unit:(x.unit||'buc').toString().slice(0,12), unit_price:+x.price||+x.unit_price||0, vat_rate:vr, kind:'service', norm_code:null, description:'', photo_url:null }));
    if(S.lines.length===1 && !S.lines[0].name) S.lines=added; else S.lines=S.lines.concat(added); reorderLinesBySection();
    closeM(); toast('✅ '+added.length+' linii generate. Verifică prețurile.'); renderLines(); renderSummary(); renderBOM();
  }catch(e){
    if(btn){ btn.disabled=false; btn.textContent='Generează'; }
    let msg=(e&&e.message)||String(e); if(/configur|ANTHROPIC|neconfig|not found|404|Failed to send|Edge Function|non-2xx|FunctionsFetch/i.test(msg)) msg='AI nu este încă configurat. Administratorul trebuie să publice funcția „ai" și să adauge cheia API în Supabase (vezi instrucțiunile).';
    $('ai-msg').textContent=msg;
  }
}

function isNetErr(e){ const m=((e&&(e.message||e))||'').toString().toLowerCase(); return !navigator.onLine || /load failed|failed to fetch|networkerror|network error|timeout|aborted/.test(m); }
async function saveLineDetails(i){
  const l=S.lines[i]; l.description=($('ld-desc').value||'').trim()||'';
  if($('ld-net')) l.unit_price=+($('ld-net').value)||0; if($('ld-vat')) l.vat_rate=+($('ld-vat').value)||0;
  const f=$('ld-photo');
  if(f && f.files && f.files[0]){
    const btn=$('ld-save'); if(btn) btn.disabled=true; $('ld-msg').textContent='Se încarcă poza…';
    try{
      const file=f.files[0]; const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
      const mq=await sb.from('memberships').select('tenant_id').eq('active',true).limit(1).maybeSingle();
      if(mq.error) throw mq.error;
      const tid=mq.data&&mq.data.tenant_id; if(!tid) throw new Error('Sesiune expirată. Reîncarcă pagina.');
      const path=tid+'/lines/'+Date.now()+'_'+safe;
      // reîncearcă automat dacă rețeaua pică (util pe telefon / 4G)
      let up, attempt=0;
      while(true){ up=await sb.storage.from('docs').upload(path,file,{contentType:file.type||'image/jpeg'});
        if(!up.error || !isNetErr(up.error) || attempt>=2) break;
        attempt++; $('ld-msg').textContent='📡 Conexiune slabă — reîncerc ('+attempt+')…'; await new Promise(s=>setTimeout(s,700*attempt)); }
      if(up.error) throw up.error;
      l.photo_url=path;
    }catch(e){ if($('ld-save'))$('ld-save').disabled=false;
      $('ld-msg').textContent = isNetErr(e) ? '📡 Conexiune întreruptă — verifică internetul și apasă din nou.' : ('Eroare: '+(e.message||e)); return; }
  }
  closeM(); toast('✅ Detalii salvate.'); renderLines(); signLineThumbs();
}

function lineSearch(i,q){ S.lines[i].name=q; const dd=$('dd-'+i); if(!dd) return;

  let html=list.map((c,ci)=>{ const idx=S.catalog.indexOf(c);

  dd.innerHTML=html||'<div class="it sub">Niciun rezultat.</div>'; dd.style.display='';
}

function pickCatalog(i,ci){ const c=S.catalog[ci]; if(!c) return; const l=S.lines[i];

async function lcSave(i,mode){ const l=S.lines[i]; if(!l) return;
  const kindSel=($('lc-kind')&&$('lc-kind').value)||l.cat_src||l.kind||'service';
  const isMat=(mode==='update')?(l.cat_src==='material'):(kindSel==='material'); const tbl=isMat?'materials':'services'; const vat=+l.vat_rate||(S.firm.vat_rate!=null?S.firm.vat_rate:20);
  const payload=isMat?{name:l.name,unit:l.unit,last_price:+l.unit_price||0,vat_rate:vat,description:l.description||null,photo_url:l.photo_url||null}:{name:l.name,unit:l.unit,price:+l.unit_price||0,vat_rate:vat,description:l.description||null,photo_url:l.photo_url||null};
  try{
    if(mode==='update'){ if(!l.cat_id) throw new Error('Linia nu e legată de catalog.'); const u=await sb.from(tbl).update(payload).eq('id',l.cat_id); if(u.error) throw u.error;
      const c=S.catalog.find(x=>x.id===l.cat_id&&x.src===l.cat_src); if(c){ c.name=l.name; c.unit=l.unit; c.price=+l.unit_price||0; c.vat=vat; c.desc=l.description||''; c.photo=l.photo_url||null; }
    } else { const tid=S.tenant||(await sb.from('memberships').select('tenant_id').eq('active',true).limit(1).maybeSingle()).data.tenant_id;
      const ins=await sb.from(tbl).insert(Object.assign({tenant_id:tid},payload)).select('id').single(); if(ins.error) throw ins.error;
      l.cat_id=ins.data.id; l.cat_src=isMat?'material':'service'; if(!l.kind) l.kind=l.cat_src; S.catalog.unshift({src:l.cat_src,id:ins.data.id,icon:(isMat?'📦':'🧰'),name:l.name,unit:l.unit,price:+l.unit_price||0,vat:vat,kind:l.cat_src,desc:l.description||'',photo:l.photo_url||null});
    }
    l._catName=l.name; l._catPrice=+l.unit_price||0; l._catUnit=l.unit; l._catDesc=l.description||''; l._catPhoto=l.photo_url||null;
    closeM(); toast(mode==='update'?'✅ Produs actualizat în catalog.':'✅ Produs nou salvat în catalog.'); renderLines();

    const extra=(l.description?'<div style="color:#6b7793;font-size:11px;margin-top:3px">'+esc(l.description).replace(/\n/g,'<br>')+'</div>':'');
    const hasPhoto=l.photo_url&&lphotos[l.photo_url];
    const photoCell='<td style="text-align:center;vertical-align:middle">'+(hasPhoto?'<img src="'+lphotos[l.photo_url]+'" onclick="zoom(this.src)" title="'+(window.C373t?window.C373t('Apasă pentru a mări'):'Apasă pentru a mări')+'" style="width:90px;height:90px;object-fit:cover;border-radius:6px;border:1px solid #e5e9f2;cursor:zoom-in">':'')+'</td>';
    if(isLiv) return '<tr><td>'+n+'</td><td>'+esc(l.name)+extra+'</td><td class="r">'+num2(l.qty)+'</td><td>'+esc(l.unit)+'</td>'+photoCell+'</tr>';
    return '<tr><td>'+n+'</td><td>'+esc(l.name)+extra+'</td><td class="r">'+num2(l.qty)+'</td><td>'+esc(l.unit)+'</td><td class="r">'+money(l.unit_price)+'</td>'
      +(showDiscCol?'<td class="r">'+num2(l.disc||0)+'%</td>':'')
      +(showVatCol?'<td class="r">'+num2(eff)+'%</td>':'')
      +'<td class="r">'+money(lineTot)+'</td>'+photoCell+'</tr>';
  }
  const isRolled = !isLiv && (S.est.materials_mode==='rolled'); // materiale incluse in manopera (ascunse)
  let _n=0, rows='';
  S.lines.filter(l=>(l.name||'').trim() && !l.group).forEach(l=>{ rows+=pdfRow(l,++_n); });
  S.groups.forEach(g=>{ const gl=S.lines.filter(l=>(l.name||'').trim() && l.group===g.id); if(!gl.length && !(g.name||'').trim()) return;
    rows+='<tr><td colspan="'+colsN+'" style="background:#eef2ff;font-weight:800">'+esc(g.name||T('Grup'))+'</td></tr>';
    if(isRolled){
      const mats=gl.filter(l=>l.kind==='material'), labor=gl.filter(l=>l.kind!=='material');
      const matGross=mats.reduce((s,l)=>s+(+l.qty||0)*(+l.unit_price||0),0);
      if(labor.length){ labor.forEach((l,idx)=>{ const cl=Object.assign({},l); const q=+cl.qty||0; const own=q*(+cl.unit_price||0); const gross=own+(idx===0?matGross:0); cl.unit_price=q?gross/q:gross; rows+=pdfRow(cl,++_n); }); }
      else { rows+=pdfRow(Object.assign(blankLine(),{name:g.name||T('Materiale'),qty:1,unit:'set',unit_price:matGross,vat_rate:(g.vat||0),group:g.id}),++_n); }
    } else { gl.forEach(l=>{ rows+=pdfRow(l,++_n); }); }
    if(!isLiv){ const gt=groupTotals(g); rows+='<tr><td colspan="'+(colsN-2)+'" style="text-align:right;color:#6b7793;font-size:11px;padding-right:10px">'+T('Subtotal grup')+(g.disc?(' −'+num2(g.disc)+'%'):'')+(gt.vat>0.005?(' · '+T('TVA:')+' '+money(gt.vat)):'')+'</td><td class="r"><b>'+money(gt.total)+'</b></td><td></td></tr>'; }
  });
  const docTitle=isLiv?T('BON DE LIVRARE'):(docType==='confirmare'?T('CONFIRMARE DE COMANDĂ'):T('OFERTĂ / DEVIZ'));
  const tabHead=isLiv?('<tr><th>#</th><th>'+T('Denumire')+'</th><th class="r">'+T('Cant.')+'</th><th>'+T('UM')+'</th><th style="width:108px;text-align:center">'+T('Foto')+'</th></tr>')
    :('<tr><th>#</th><th>'+T('Denumire')+'</th><th class="r">'+T('Cant.')+'</th><th>'+T('UM')+'</th><th class="r">'+T('Preț')+'</th>'+(showDiscCol?'<th class="r">'+T('Reducere')+'</th>':'')+(showVatCol?'<th class="r">'+T('TVA')+'</th>':'')+'<th class="r">'+(anyVat?T('Total cu TVA'):T('Total'))+'</th><th style="width:108px;text-align:center">'+T('Foto')+'</th></tr>');
  const totBlock=isLiv?'<div style="margin-top:40px;display:flex;justify-content:space-between;gap:30px"><div style="flex:1">'+T('Predat de')+':<br><br>____________________</div><div style="flex:1">'+T('Primit de')+':<br><br>____________________</div></div>'
    :('<div class="tot"><div><span>'+T('Subtotal:')+'</span><b>'+money(t.gross)+'</b></div>'
       +(t.disc>0.005?'<div><span>'+T('Reducere:')+'</span><b>−'+money(t.disc)+'</b></div>':'')
       +'<div><span>'+T('TVA:')+(vmode==='total'&&(+S.est.vat_value)?(' '+num2(S.est.vat_value)+'%'):'')+'</span><b>'+money(t.vat)+'</b></div>'
       +'<div class="g"><span>'+T('TOTAL:')+'</span><span>'+money(t.total)+'</span></div></div>'
       +(()=>{ const pn=prepayNote(t.total); return pn?'<div style="margin-top:12px;margin-left:auto;width:380px;padding:11px 13px;background:#ecfdf5;border:1px solid #a7f3d0;border-radius:9px;font-size:12px;color:#065f46;line-height:1.5">💸 '+T('La achitarea 100% în avans beneficiați de o reducere suplimentară de')+' <b>'+num2(pn.pct)+'%</b> '+T('din suma finală')+' ('+T('economisiți')+' <b>'+money(pn.save)+'</b>). '+T('Total cu avans:')+' <b>'+money(pn.after)+'</b></div>':''; })()
       +(legalNote?'<div class="muted" style="margin-top:10px;font-size:11px">'+esc(legalNote)+'</div>':'')
       +(S.est.notes?'<div class="ft">'+esc(S.est.notes).replace(/\n/g,'<br>')+'</div>':'<div class="ft">'+T('Vă mulțumim!')+'</div>'));
  const doc='<!doctype html><html lang="'+L+'"><head><meta charset="utf-8"><title>'+esc(docTitle)+' '+esc(S.est.number||'')+'</title><style>'
    +'body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;color:#0f1c33;padding:32px;max-width:800px;margin:0 auto;font-size:13px}.hd{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #2f6bff;padding-bottom:16px;margin-bottom:20px}.ti{font-size:22px;font-weight:800;color:#2f6bff}.muted{color:#6b7793}.box{display:flex;gap:24px;margin:0 0 20px}.box>div{flex:1;background:#f4f6fb;border-radius:10px;padding:12px 14px}.box h4{font-size:11px;text-transform:uppercase;color:#6b7793;margin:0 0 6px}table{width:100%;border-collapse:collapse;margin-top:8px}th,td{padding:8px 10px;border-bottom:1px solid #e5e9f2;text-align:left}th{background:#0f1c33;color:#fff;font-size:11px;text-transform:uppercase}.r{text-align:right}.tot{margin-top:16px;margin-left:auto;width:280px}.tot div{display:flex;justify-content:space-between;padding:5px 0}.tot .g{font-size:17px;font-weight:800;border-top:2px solid #0f1c33;margin-top:6px;padding-top:8px}.ft{margin-top:30px;color:#6b7793;font-size:11px;border-top:1px solid #e5e9f2;padding-top:12px}@media print{.noprint{display:none}tr{page-break-inside:avoid}}'
    +'</style></head><body><div class="hd"><div>'+logo+'<div style="font-size:18px;font-weight:800">'+esc(brand||f.name||'Firma')+'</div>'+(brand?'<div class="muted" style="font-size:11px">'+T('Marca comercială a')+' '+esc(f.name||'')+'</div>':'')+'<div class="muted">'+(f.idno?esc(idLabel)+': '+esc(f.idno)+'<br>':'')+(f.address?esc(f.address)+'<br>':'')+(f.phone?T('Tel:')+' '+esc(f.phone):'')+'</div></div>'
    +'<div style="text-align:right"><div class="ti">'+docTitle+'</div><div style="font-weight:700;font-size:15px">'+T('Nr.')+' '+esc(S.est.number||'—')+'</div><div class="muted">'+T('Data:')+' '+esc(fmtDate(S.est.issue_date))+((!isLiv&&S.est.valid_until)?'<br>'+T('Valabil până la:')+' '+esc(fmtDate(S.est.valid_until)):'')+'</div></div></div>'
    +'<div class="box"><div><h4>'+T('Furnizor')+'</h4><b>'+esc(brand||f.name||'')+'</b>'+(brand?'<div style="font-size:10px;color:#6b7793">'+T('Marca comercială a')+' '+esc(f.name||'')+'</div>':'')+'</div><div><h4>'+T('Client')+'</h4><b>'+esc(cl.name||'—')+'</b></div></div>'
    +'<table><thead>'+tabHead+'</thead><tbody>'+(rows||'<tr><td colspan="'+colsN+'" style="text-align:center;color:#888;padding:18px">'+T('Fără linii.')+'</td></tr>')+'</tbody></table>'
    +totBlock+sigHtml
    +'<div class="noprint" style="margin-top:20px;text-align:center"><button onclick="window.print()" style="padding:10px 20px;font-size:14px;cursor:pointer">🖨 '+T('Tipărește / Salvează PDF')+'</button></div>'
    +'<div id="lb" class="noprint" onclick="this.style.display=\'none\'" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);align-items:center;justify-content:center;z-index:9999;cursor:zoom-out"><img id="lbimg" style="max-width:92%;max-height:92%;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.5)"></div>'
    +'<script>function zoom(s){var l=document.getElementById("lb");document.getElementById("lbimg").src=s;l.style.display="flex";}document.addEventListener("keydown",function(e){if(e.key==="Escape"){var l=document.getElementById("lb");if(l)l.style.display="none";}});<\/script>'
    +'</body></html>';
  if(inPlace){ document.open(); document.write(doc); document.close(); return; }
  if(w&&!w.closed){ try{ w.document.open(); w.document.write(doc); w.document.close(); }catch(e){ const w2=window.open('','_blank'); if(w2){ w2.document.write(doc); w2.document.close(); } } }
  else { const w2=window.open('','_blank'); if(!w2){ toast('Permite ferestrele pop-up pentru această pagină.'); return; } w2.document.write(doc); w2.document.close(); }
}
/* ---- SEMNĂTURĂ DIGITALĂ (acceptare ofertă) ---- */
var _sg={};
function signPad(){
  if(!S.id){ toast('Salvează întâi oferta.'); return; }
  const cl=(S.clients.find(c=>c.id===S.est.client_id)||{});
  $('modal-mount').innerHTML='<div class="ov" onclick="if(event.target===this)closeM()"><div class="modal" style="max-width:460px"><h3>✍️ Semnătură client (acceptare)</h3>'
    +'<div class="field"><label>Nume semnatar</label><input id="sg-name" value="'+esc(S.est.signer_name||cl.name||'')+'"/></div>'
    +'<div style="font-size:.8rem;color:var(--muted);margin-bottom:.3rem">Semnează cu degetul / mouse-ul în casetă:</div>'
    +'<canvas id="sg-canvas" width="430" height="180" style="border:1px dashed var(--line);border-radius:10px;width:100%;touch-action:none;background:#fff"></canvas>'
    +'<div id="sg-msg" style="color:var(--red);font-size:.82rem"></div>'
    +'<div style="display:flex;gap:.5rem;justify-content:space-between;margin-top:.6rem"><button class="btn" onclick="sgClear()">Șterge</button><div style="display:flex;gap:.5rem"><button class="btn" onclick="closeM()">Anulează</button><button class="btn primary" id="sg-save" onclick="sgSave()">Salvează semnătura</button></div></div></div></div>';
  setTimeout(sgInit,60);
}
function sgInit(){ const c=$('sg-canvas'); if(!c) return; const ctx=c.getContext('2d'); ctx.lineWidth=2.4; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#0f1c33'; _sg={c,ctx,drawing:false,has:false};
  const pos=e=>{ const r=c.getBoundingClientRect(); return {x:(e.clientX-r.left)*(c.width/r.width), y:(e.clientY-r.top)*(c.height/r.height)}; };
  c.addEventListener('pointerdown',e=>{ e.preventDefault(); _sg.drawing=true; _sg.has=true; const p=pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); try{c.setPointerCapture(e.pointerId);}catch(_){}});
  c.addEventListener('pointermove',e=>{ if(!_sg.drawing) return; e.preventDefault(); const p=pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); });
  c.addEventListener('pointerup',()=>{ _sg.drawing=false; });
}
function sgClear(){ if(_sg.ctx){ _sg.ctx.clearRect(0,0,_sg.c.width,_sg.c.height); _sg.has=false; } }
async function sgSave(){
  if(!_sg.has){ $('sg-msg').textContent='Semnează în casetă întâi.'; return; }
  const btn=$('sg-save'); if(btn) btn.disabled=true;
  try{
    const blob=await new Promise(res=>_sg.c.toBlob(res,'image/png'));
    const tid=(await sb.from('memberships').select('tenant_id').eq('active',true).limit(1).maybeSingle()).data.tenant_id;
    const path=tid+'/signatures/'+S.id+'_'+Date.now()+'.png';
    const up=await sb.storage.from('docs').upload(path,blob,{contentType:'image/png'}); if(up.error) throw up.error;
    const name=($('sg-name').value||'').trim()||null; const now=new Date().toISOString();
    const u=await sb.from('estimates').update({signature_url:path,signer_name:name,signed_at:now,status:'accepted'}).eq('id',S.id); if(u.error) throw u.error;
    S.est.signature_url=path; S.est.signer_name=name; S.est.signed_at=now; S.est.status='accepted';
    closeM(); toast('✅ Semnătură salvată. Ofertă acceptată.'); render();
  }catch(e){ if(btn) btn.disabled=false; $('sg-msg').textContent='Eroare: '+(e.message||e); }
}

/* ---- conversii ---- */
async function toInvoice(){
  if(!S.id){ toast('Salvează întâi oferta.'); return; }
  await save();
  if(S.id) window.open('factura.html?estimate='+S.id,'_blank');
}
async function toSite(){
  if(!S.est.client_id){ toast('Alege un client.'); return; }
  const t=totals(); const tid=(await sb.from('memberships').select('tenant_id').eq('active',true).limit(1).maybeSingle()).data.tenant_id;
  const name=prompt('Denumirea șantierului:', (S.clients.find(c=>c.id===S.est.client_id)||{}).name||'Șantier nou'); if(name===null) return;
  const ins=await sb.from('sites').insert({tenant_id:tid,name:name||'Șantier nou',client_id:S.est.client_id,budget:t.total,status:'planned',source_estimate_id:S.id||null}).select('id').single();
  if(ins.error){ toast('Eroare: '+ins.error.message); return; }
  toast('✅ Șantier creat. Deschid graficul…'); setTimeout(()=>location.href='grafic.html?site='+ins.data.id,700);
}

boot();
