<script>
const SUPABASE_URL='https://vzatmfhkwiojqkowtftg.supabase.co';
const SUPABASE_KEY='sb_publishable_wNj9S8eta39n1Gkq_g-gfA_idl_pbPy';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
const esc=s=>(s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CURSYM={MDL:'MDL',EUR:'€',RON:'lei',USD:'$',UAH:'₴',GBP:'£'}; let CUR='MDL';
const money=n=>new Intl.NumberFormat('ro-RO',{minimumFractionDigits:2,maximumFractionDigits:2}).format(+n||0)+' '+(CURSYM[CUR]||CUR);
const num2=n=>{ const r=Math.round((+n||0)*100)/100; return r%1===0?r:r.toFixed(2); };
/* Semantica preț/TVA — identică cu `app.html` și `factura.html` (KB#39, D34).
   `estimate_items.unit_price` este ÎNTOTDEAUNA net. Rotunjirea la 2 zecimale se
   face doar la afișare și la valorile scrise înapoi într-un câmp; totalurile
   rămân rotunjirea sumei, nu suma rotunjirilor. */
const VATX = {
  r2(n){ return Math.round((+n||0)*100)/100; },
  gross(net, rate){ return (+net||0)*(1+(+rate||0)/100); },
  net(gross, rate){ const r=+rate||0; return r ? (+gross||0)/(1+r/100) : (+gross||0); },
  vat(net, rate){ return (+net||0)*(+rate||0)/100; }
};
// Contractul de pret v2 (D35). Clientul DECLARA explicit ce semantica au
// preturile pe care le trimite, ca serverul sa nu mai ghiceasca din setarea
// firmei. In v356+ campul cu `id="f-<key>"` este INTOTDEAUNA cel fara TVA
// (D34), deci valoarea trimisa e mereu NETA, indiferent de `prices_incl_vat`.
// Se trimite in interiorul JSONB-ului, nu ca parametru nou: semnatura RPC
// ramane neschimbata, deci un tab vechi ramas pe cache nu se rupe.
const PRICE_CONTRACT = { price_contract_version:'2', price_input_mode:'net' };
function withPriceContract(o){ return Object.assign({}, o||{}, PRICE_CONTRACT); }
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2200); }
function param(k){ return new URLSearchParams(location.search).get(k); }

const STATUS={draft:'Ciornă',sent:'Trimisă',accepted:'Acceptată',rejected:'Respinsă'};
/* `T` e LOCAL în fiecare funcție a acestui fișier, nu global — helperii de stare
   rulează la nivel de modul, deci au nevoie de propriul traducător. */
function TS(x){ return (window.C373t? window.C373t(x) : x); }
const ST_ICON={draft:'✎',sent:'➤',accepted:'✓',rejected:'✕'};
/* Expirarea e o proprietate a DATEI, nu o stare pe care o alege cineva. */
function estIsExpired(){ return (S.est.status==='sent') && S.est.valid_until
  && String(S.est.valid_until).slice(0,10) < (typeof coToday==='function'?coToday():new Date().toISOString().slice(0,10)); }
function stPill(){
  if(estIsExpired()) return '<span class="pill sent" title="Valabilitatea a trecut">⏳ '+TS('Expirată')+'</span>';
  const k=S.est.status||'draft';
  return '<span class="pill '+k+'">'+(ST_ICON[k]||'')+' '+TS(STATUS[k]||'')+'</span>';
}
/* Doar tranzițiile care au sens din starea curentă. Nu umplem antetul cu butoane. */
function stActions(){
  if(!S.canEdit || !S.id) return '';
  const k=S.est.status||'draft'; let b='';
  const btn=(act,lab,st)=>'<button class="btn" style="padding:.2rem .55rem;font-size:.75rem;margin-left:.35rem'+(st||'')+'" onclick="stSet(\''+act+'\')">'+TS(lab)+'</button>';
  if(k==='draft')  b+=btn('sent','Marchează ca trimisă');
  if(k==='sent'){  b+=btn('accepted','Acceptată',';color:var(--green)')+btn('rejected','Refuzată',';color:#dc2626'); }
  return b;
}
/* Schimbarea trece prin contractul server-side, cu jetonul CAS. La succes
   RESINCRONIZĂM `S._updatedAt` — altfel următoarea salvare pică pe DOC_CONFLICT
   (capcana documentată în factura.html după înregistrarea unei încasări). */
const ST_ERR={ DOC_CONFLICT:'Documentul a fost modificat în altă parte. Reîncarcă-l.',
  STATUS_FORBIDDEN:'Nu ai dreptul să schimbi starea acestui document.',
  ESTIMATE_ACCEPTED_LOCKED:'Oferta a generat deja un șantier; starea nu se mai poate schimba.',
  STATUS_INVALID:'Stare necunoscută.', DOC_NOT_FOUND:'Documentul nu a fost găsit.' };
async function stSet(st){
  if(!S.id){ toast('Salvează documentul întâi.'); return; }
  const {data,error}=await sb.rpc('estimate_set_status',
    {p_estimate_id:S.id, p_status:st, p_expected_updated_at:S._updatedAt||null});
  if(error){ const c=String(error.message||'').split(':')[0].trim();
    toast('⛔ '+(ST_ERR[c]||error.message)); return; }
  S.est.status=data.status; S._updatedAt=data.updated_at;
  S.est.sent_at=data.sent_at; S.est.accepted_at=data.accepted_at; S.est.rejected_at=data.rejected_at;
  toast('✅ '+TS('Stare actualizată')); render();
}
const FIN=['owner','admin','manager','accountant'];
let S={ id:null, role:null, canEdit:false, firm:{}, est:{status:'draft',number:'',client_id:'',title:'',issue_date:new Date().toISOString().slice(0,10),valid_until:'',notes:'',disc_mode:'none',disc_value:0,vat_mode:'line',vat_value:0,materials_mode:'detailed',skonto_off:false,skonto_pct:null},
        lines:[], groups:[], clients:[], catalog:[], normMat:{}, _activeDD:null, lineThumbs:{} };
function gid(){ return 'g'+Date.now().toString(36)+Math.floor(Math.random()*1000); }
function coDateFmt(){ return (S.firm&&S.firm.automations&&S.firm.automations.date_fmt)||'DD.MM.YYYY'; }
function fmtDate(iso){ if(!iso) return ''; const s=String(iso).slice(0,10); const p=s.split('-'); if(p.length<3) return s; const y=p[0],m=p[1],d=p[2]; const f=coDateFmt(); return f==='YYYY-MM-DD'?s:f==='DD/MM/YYYY'?(d+'/'+m+'/'+y):f==='MM/DD/YYYY'?(m+'/'+d+'/'+y):(d+'.'+m+'.'+y); }
/* ── schiță auto-salvată (ofertă nouă) ── */
let _dzT=null;
function dkey(){ return 'c373_draft_deviz_'+(S.tenant||''); }
function getDraftDz(){ try{ const r=localStorage.getItem(dkey()); return r?JSON.parse(r):null; }catch(e){ return null; } }
function saveDraftDz(){ if(S.id) return; try{ const has=(S.lines||[]).some(l=>(l.name||'').trim()||(+l.unit_price>0)); if(!has){ localStorage.removeItem(dkey()); return; } localStorage.setItem(dkey(), JSON.stringify({t:Date.now(), est:S.est, lines:S.lines, groups:S.groups})); }catch(e){} }
function clearDraftDz(){ try{ localStorage.removeItem(dkey()); }catch(e){} }
function scheduleDraft(){ if(S.id) return; clearTimeout(_dzT); _dzT=setTimeout(saveDraftDz,600); }

async function boot(){
  const { data:{ session } }=await sb.auth.getSession();
  if(!session){ $('root').innerHTML='<div class="center">🔒 Trebuie să fii autentificat.<br><br><a class="btn primary" href="app.html">Deschide aplicația</a></div>'; return; }
  const mem=await sb.from('memberships').select('role, tenant_id, tenants(name,idno,address,phone,vat_rate,currency,logo_url,automations)').eq('active',true).limit(1).maybeSingle();
  S.role=mem.data?mem.data.role:null; S.tenant=mem.data?mem.data.tenant_id:null; S.firm=(mem.data&&mem.data.tenants)||{}; S.canEdit=FIN.includes(S.role); CUR=(S.firm.currency||'MDL').toUpperCase();
  if(!S.canEdit){ $('root').innerHTML='<div class="center">🔒 Doar proprietar/administrator/manager/contabil pot crea oferte.</div>'; return; }
  await loadCatalog();
  const id=param('id');
  if(id){ const _b=$('btn-save'); if(_b) _b.disabled=true; await loadEstimate(id); }
  else { S.est.number=await genNumber(); S._autoNum=S.est.number; if(param('client')) S.est.client_id=param('client'); S.lines=[blankLine()];
    S.est.vat_value=(S.firm.vat_rate!=null?S.firm.vat_rate:20); S.est.vat_mode=(S.firm.vat_rate?'line':'none');
    if(param('prefill')){ try{ const pf=JSON.parse(localStorage.getItem('c373_offer_prefill')||'null'); if(pf && pf.lines && pf.lines.length){ S.lines=pf.lines.map(l=>Object.assign(blankLine(),{name:l.name,qty:+l.qty||1,unit:l.unit||'buc',unit_price:+l.unit_price||0,vat_rate:(l.vat_rate!=null?+l.vat_rate:(S.firm.vat_rate!=null?S.firm.vat_rate:20))})); S._restored=true; } localStorage.removeItem('c373_offer_prefill'); }catch(e){} }
    else if(!param('survey')){ const dr=getDraftDz(); if(dr && dr.lines && dr.lines.length){ if(dr.est) S.est=Object.assign(S.est,dr.est); S.lines=dr.lines; if(Array.isArray(dr.groups)) S.groups=dr.groups; reorderLinesBySection(); S._restored=true; } } }
  // din fisa de previzualizare
  if(param('survey')) await fromSurvey(param('survey'));
  if(param('print')){ await pdf(param('doctype')||'oferta', true); return; }
  render();
  signLineThumbs();
  historyInit();
  document.addEventListener('input',scheduleDraft); document.addEventListener('change',scheduleDraft);
  if(S._restored) toast('↩️ Schiță nesalvată restaurată.');
}
/* semneaza pozele liniilor pentru previzualizare in editor (cache), apoi re-randeaza liniile */
async function signLineThumbs(){
  const paths=S.lines.filter(l=>l.photo_url && !S.lineThumbs[l.photo_url]).map(l=>l.photo_url);
  if(!paths.length){ return; }
  try{ const su=await sb.storage.from('docs').createSignedUrls(paths,3600); (su.data||[]).forEach((x,idx)=>{ if(x.signedUrl) S.lineThumbs[paths[idx]]=x.signedUrl; }); }catch(e){}
  renderLines();
}
async function genNumber(){ const yr=new Date().getFullYear(); const pref='OF-'+yr+'-';
  // Următorul număr = MAX existent din anul curent + 1 (nu „count+1", care se dubla la ștergeri/goluri).
  try{ const { data }=await sb.from('estimates').select('number').like('number',pref+'%').limit(10000);
    let max=0; (data||[]).forEach(r=>{ const m=String(r.number||'').match(/(\d+)\s*$/); if(m){ const n=parseInt(m[1],10)||0; if(n>max) max=n; } });
    return pref+String(max+1).padStart(4,'0'); }catch(e){ return pref+Math.floor(Math.random()*9000+1000); } }
function blankLine(){ return { name:'', qty:1, unit:'buc', unit_price:0, vat_rate:(S.firm.vat_rate!=null?S.firm.vat_rate:20), disc:0, group:'', kind:'service', norm_code:null, description:'', photo_url:null,
  sub_id:null, sub_price_id:null, sub_price_at:null, sub_price_amount:null, sub_price_currency:null, sub_price_name:null, sub_price_unit:null }; }

async function loadCatalog(){
  const [cl, svc, nrm, mat, nm]=await Promise.all([
    sb.from('clients').select('id,name').order('name'),
    sb.from('services').select('id,name,unit,price,vat_rate,description,photo_url').eq('active',true),
    sb.from('norms').select('id,code,name,unit,category,unit_price'),
    sb.from('materials').select('id,name,unit,last_price,vat_rate,description,photo_url').eq('active',true),
    sb.from('norm_materials').select('norm_code,material_name,unit,qty_per_unit,kind')
  ]);
  S.clients=cl.data||[];
  S.catalog=[].concat(
    (svc.data||[]).map(x=>({src:'service',id:x.id,icon:'🧰',name:x.name,unit:x.unit||'buc',price:+x.price||0,vat:(x.vat_rate!=null?+x.vat_rate:20),kind:'service',desc:x.description||'',photo:x.photo_url||null})),
    (nrm.data||[]).map(x=>({src:'norm',icon:'📐',name:x.name,unit:x.unit||'m2',price:+x.unit_price||0,vat:20,kind:'service',norm_code:x.code,cat:x.category})),
    (mat.data||[]).map(x=>({src:'material',id:x.id,icon:'📦',name:x.name,unit:x.unit||'buc',price:+x.last_price||0,vat:(x.vat_rate!=null?+x.vat_rate:20),kind:'material',desc:x.description||'',photo:x.photo_url||null}))
  );
  S.normMat={}; (nm.data||[]).forEach(x=>{ (S.normMat[x.norm_code]=S.normMat[x.norm_code]||[]).push(x); });
}
async function loadEstimate(id){
  const e=await sb.from('estimates').select('*').eq('id',id).single();
  if(e.error){ docLoadFailed('Oferta nu a putut fi citită.', e.error.message); return; }
  S.id=id; S._updatedAt=e.data.updated_at; S.est={ status:e.data.status, number:e.data.number||'', client_id:e.data.client_id||'', title:e.data.title||'', site_id:e.data.site_id||null,
    /* FIN2 — marcajele de lifecycle vin de la server; `select('*')` le aducea deja, dar
       maparea le arunca, deci starea clientului le avea mereu null. */
    sent_at:e.data.sent_at||null, accepted_at:e.data.accepted_at||null, rejected_at:e.data.rejected_at||null,
    issue_date:e.data.issue_date||new Date().toISOString().slice(0,10), valid_until:e.data.valid_until||'', notes:e.data.notes||'',
    disc_mode:e.data.disc_mode||'none', disc_value:+e.data.disc_value||0, vat_mode:e.data.vat_mode||'line', vat_value:+e.data.vat_value||0, materials_mode:e.data.materials_mode||'detailed', skonto_off:!!e.data.skonto_off, skonto_pct:(e.data.skonto_pct!=null?+e.data.skonto_pct:null),
    signature_url:e.data.signature_url||null, signer_name:e.data.signer_name||null, signed_at:e.data.signed_at||null, plan_url:e.data.plan_url||null };
  S.groups=Array.isArray(e.data.groups)?e.data.groups.map(g=>({id:g.id,name:g.name||'',vat:+g.vat||0,disc:+g.disc||0})):[];
  const it=await sb.from('estimate_items').select('*').eq('estimate_id',id);
  if(it.error){ docLoadFailed('Pozițiile ofertei nu au putut fi citite.', it.error.message); return; }
  const mapped=((it.data||[]).sort((a,b)=>(a.position||0)-(b.position||0))).map(x=>{ const c=S.catalog.find(c=>c.name===x.name&&c.src==='norm'); const cid=x.material_id||x.service_id||null; const csrc=x.material_id?'material':(x.service_id?'service':null);
    const cat=cid?S.catalog.find(z=>z.id===cid&&z.src===csrc):null;
    return { name:x.name, qty:+x.qty, unit:x.unit, unit_price:+x.unit_price, vat_rate:+x.vat_rate, disc:+x.disc||0, group:x.group_id||'', kind:x.kind||'service', norm_code:c?c.norm_code:null, description:x.description||'', photo_url:x.photo_url||null,
      // legătura la catalog e acum PERSISTENTĂ (migr 0127): se reface la fiecare
      // deschidere, deci „Actualizează produsul existent" rămâne disponibilă

/* păstrează S.lines ordonate: fără grup întâi, apoi pe grupuri (în ordinea S.groups) */
function reorderLinesBySection(){
  const known=new Set(S.groups.map(g=>g.id));
  S.lines.forEach(l=>{ if(l.group && !known.has(l.group)) l.group=''; });
  let arr=S.lines.filter(l=>!l.group);
  S.groups.forEach(g=>{ arr=arr.concat(S.lines.filter(l=>l.group===g.id)); });
  S.lines=arr;
}
function lineNet(l){ const g=(+l.qty||0)*(+l.unit_price||0); return (!l.group && S.est.disc_mode==='line')? g*(1-(+l.disc||0)/100) : g; }
/* ►► FIN1 — SINGURA regulă de selecție a cotei, pentru TOATE pozițiile, în grup sau nu.
   Modul documentului decide: 'none' → 0 · 'total' → cota UNIFICATĂ · 'line' → cota liniei.
   Clauza `if(inGroup) return l.vat_rate` de dinainte făcea ca o poziție din grup să nu vadă
   NICIODATĂ modul documentului: TVA unificat 20% peste un grup la 8% dădea 8%. Cotele
   individuale NU se distrug — rămân în `l.vat_rate` și redevin efective când modul revine
   la „pe poziție". */
function lineEffVat(l){ const vm=S.est.vat_mode||'none'; if(vm==='none') return 0; if(vm==='total') return +S.est.vat_value||0; return +l.vat_rate||0; }
/* FIN1 — o linie fără denumire NU e salvată de `save()` și e ignorată de `app.calc_totals`,
   deci nu are voie să intre în totaluri (paritate cu factura.html, KB#48A). */
function lineCounts(l){ return !!((l.name||'').trim()); }
function lineGross(l){ return lineNet(l)*(1+lineEffVat(l)/100); }
/* ►► FIN-UNIT-GROSS1 — PREȚUL BRUT PE UNITATE. DERIVAT, niciodată stocat: nu există coloană
   nouă în DB și nu se naște un al doilea motor de calcul.
   Se obține din `lineGross` — adică din motorul canonic — împărțit la cantitate. De aceea
   `unitGross(l) * qty === lineGross(l)` EXACT, înainte de rotunjire: aceleași reduceri, aceeași
   cotă efectivă (`lineEffVat`), aceeași ramură pentru grup/document. Zero aritmetică nouă.
   SEMANTICA aleasă e prețul EFECTIV pe unitate, nu cel de catalog: singurele reduceri incluse
   sunt exact cele pe care `lineNet` le include deja, ca valoarea afișată să se reconcilieze cu
   „Total" din același rând. Reducerea de grup/document rămâne în rezumat, unde era — a o
   distribui pe unitate ar fi însemnat aritmetică inventată.
   ROTUNJIRE: valoarea e pentru AFIȘARE. `r2(unitGross) * qty` poate diferi cu un ban de totalul
   canonic (139,00 × 3 = 417,00 față de 416,99). Totalul NU se recalculează din ea — rămâne
   rotunjirea sumei, nu suma rotunjirilor (D34/KB#39). */
function unitGross(l){ const q=+l.qty||0; return q ? lineGross(l)/q : 0; }

/* Selector TVA pe linie: cotele din țara/firma (Setări) + „—" (fără TVA) */
function vatRates(){ const rs=(S.firm&&S.firm.automations&&S.firm.automations.vat_rates)||[20,8,0]; return rs.map(Number).filter(r=>!isNaN(r)&&r>=0); }
function vatOptsHtml(cur){ cur=Math.round((+cur||0)*100)/100; let rs=vatRates().filter(r=>r>0); if(cur>0&&rs.indexOf(cur)<0) rs.push(cur); rs=Array.from(new Set(rs)).sort((a,b)=>b-a);
  return '<option value="0"'+(cur===0?' selected':'')+'>—</option>'+rs.map(r=>'<option value="'+r+'"'+(r===cur?' selected':'')+'>'+num2(r)+'%</option>').join(''); }
function vatSelectHtml(i,cur){ return '<select id="vt-'+i+'" onchange="lineSetVat('+i+',this.value)" style="width:100%;font-weight:600">'+vatOptsHtml(cur)+'</select>'; }
/* FIN1 — în mod unificat, editarea cotei pe ORICE poziție (în grup sau nu) schimbă rata
   documentului. Nu mai stampilăm `x.vat_rate` peste liniile fără grup: cotele individuale
   se PĂSTREAZĂ și redevin efective la întoarcerea pe „pe poziție". */
function lineSetVat(i,v){ const rate=(v===''?0:+v||0); const l=S.lines[i]; if(!l) return;
  if((S.est.vat_mode||'none')==='total'){ S.est.vat_value=rate; render(); }
  else { l.vat_rate=rate; refreshLineTotal(i); renderSummary(); } }
/* FIN1 — subtotalul grupului folosește ACEEAȘI regulă ca documentul (`lineEffVat`).
   Înainte nu consulta deloc `vat_mode`: un deviz „Fără TVA" cu grupuri producea TVA, iar
   TVA unificat nu ajungea niciodată în grup. */
function groupTotals(grp){ let net=0, vat=0; const f=(1-(+grp.disc||0)/100);
  S.lines.forEach(l=>{ if(l.group===grp.id && lineCounts(l)){ const g=(+l.qty||0)*(+l.unit_price||0); net+=g; vat+=g*f*lineEffVat(l)/100; } });
  const base=net*f; return { net:net, base:base, vat:vat, total:base+vat }; }
function totals(){
  const dm=S.est.disc_mode||'none', vm=S.est.vat_mode||'none';
  let gross=0, base=0, disc=0, vat=0;
  // poziții fără grup (mod document)
  const ung=S.lines.filter(l=>!l.group && lineCounts(l));
  let uGross=0,uNet=0; ung.forEach(l=>{ const g=(+l.qty||0)*(+l.unit_price||0); uGross+=g; uNet+=(dm==='line'? g*(1-(+l.disc||0)/100):g); });
  const uF=(dm==='total')?(1-(+S.est.disc_value||0)/100):1; const uBase=uNet*uF;
  gross+=uGross; base+=uBase; disc+=(uGross-uBase);
  /* FIN1 — o singură ramură: cota efectivă vine din `lineEffVat`, deci 'line'/'total'/'none'
     se rezolvă identic aici și în grup. Pentru 'total', Σ(net×vv) == uBase×vv. */
  ung.forEach(l=>{ const g=(+l.qty||0)*(+l.unit_price||0); const net=(dm==='line'? g*(1-(+l.disc||0)/100):g)*uF; vat+=net*lineEffVat(l)/100; });
  // grupuri (TVA/reducere proprii)
  S.groups.forEach(grp=>{ const gt=groupTotals(grp); gross+=gt.net; base+=gt.base; disc+=(gt.net-gt.base); vat+=gt.vat; });
  return { gross:gross, sub:base, disc:disc, vat:vat, total:base+vat };
}

async function aiOfferRun(){
  const input=($('ai-input').value||'').trim(); if(!input){ $('ai-msg').textContent='Scrie o descriere.'; return; }
  const btn=$('ai-go'); if(btn){ btn.disabled=true; btn.textContent='Se generează…'; }
  try{
    const lang=(window.C373lang||'ro');
    const cur=(S.firm&&S.firm.currency)||'MDL';
    const au=(S.firm&&S.firm.automations)||{};
    const { data, error }=await sb.functions.invoke('ai',{ body:{ mode:'offer', input, lang, currency:cur, tenant_id:S.tenant, key:au.anthropic_key||undefined, model:au.ai_model||'claude-haiku-4-5' } });
    if(error) throw new Error(error.message||'Eroare apel AI');
    if(data && data.ok!==true) throw new Error(data.message||data.detail||data.error||'Eroare AI');
    let txt=(data&&data.text)||''; const m=txt.match(/\{[\s\S]*\}/); if(m) txt=m[0];
    const parsed=JSON.parse(txt); const lines=(parsed.lines||parsed||[]);
    if(!Array.isArray(lines)||!lines.length) throw new Error('Niciun rezultat. Reformulează descrierea.');
    const vr=(S.firm.vat_rate!=null?S.firm.vat_rate:20);
    const added=lines.slice(0,25).map(x=>({ name:(x.name||'').toString().slice(0,200), qty:+x.qty||1, unit:(x.unit||'buc').toString().slice(0,12), unit_price:+x.price||+x.unit_price||0, vat_rate:vr, kind:'service', norm_code:null, description:'', photo_url:null }));
    if(S.lines.length===1 && !S.lines[0].name) S.lines=added; else S.lines=S.lines.concat(added); reorderLinesBySection();
    closeM(); toast('✅ '+added.length+' linii generate. Verifică prețurile.'); renderLines(); renderSummary(); renderBOM();
  }catch(e){
    if(btn){ btn.disabled=false; btn.textContent='Generează'; }
    let msg=(e&&e.message)||String(e); if(/configur|ANTHROPIC|neconfig|not found|404|Failed to send|Edge Function|non-2xx|FunctionsFetch/i.test(msg)) msg='AI nu este încă configurat. Administratorul trebuie să publice funcția „ai" și să adauge cheia API în Supabase (vezi instrucțiunile).';
    $('ai-msg').textContent=msg;
  }
}

function docLoadFailed(msg, detail){

function docLoadTripwire(rawItems, hdr){
  const T=window.C373t||function(s){return s;};

  (rawItems||[]).forEach(x=>{ const p=+x.position||0; if(p>0){ if(seen[p]) dup++; seen[p]=1; } });
  if(dup>0){ docLoadFailed('Documentul are poziții duplicate (corupere anterioară). Poate fi citit, dar nu salvat din această filă — anunță administratorul.'); return false; }
  try{ const t=totals(); const tol=0.02;
    if(Math.abs((+hdr.subtotal||0)-t.sub)>tol || Math.abs((+hdr.vat_total||0)-t.vat)>tol || Math.abs((+hdr.total||0)-t.total)>tol){
      setTimeout(function(){ toast('⚠️ '+T('Totalurile salvate nu se reconstituie din poziții (document istoric sau modificat în afara editorului). Verifică pozițiile înainte de a salva.')); },600);
    } }catch(e){}

}

/* ---- SEMNĂTURĂ DIGITALĂ (acceptare ofertă) ---- */
var _sg={};
function signPad(){
  if(!S.id){ toast('Salvează întâi oferta.'); return; }
  const cl=(S.clients.find(c=>c.id===S.est.client_id)||{});
  $('modal-mount').innerHTML='<div class="ov" onclick="if(event.target===this)closeM()"><div class="modal" style="max-width:460px"><h3>✍️ Semnătură client (acceptare)</h3>'
    +'<div class="field"><label>Nume semnatar</label><input id="sg-name" value="'+esc(S.est.signer_name||cl.name||'')+'"/></div>'
    +'<div style="font-size:.8rem;color:var(--muted);margin-bottom:.3rem">Semnează cu degetul / mouse-ul în casetă:</div>'
    +'<canvas id="sg-canvas" width="430" height="180" style="border:1px dashed var(--line);border-radius:10px;width:100%;touch-action:none;background:#fff"></canvas>'
    +'<div id="sg-msg" style="color:var(--red);font-size:.82rem"></div>'
    +'<div style="display:flex;gap:.5rem;justify-content:space-between;margin-top:.6rem"><button class="btn" onclick="sgClear()">Șterge</button><div style="display:flex;gap:.5rem"><button class="btn" onclick="closeM()">Anulează</button><button class="btn primary" id="sg-save" onclick="sgSave()">Salvează semnătura</button></div></div></div></div>';
  setTimeout(sgInit,60);
}
function sgInit(){ const c=$('sg-canvas'); if(!c) return; const ctx=c.getContext('2d'); ctx.lineWidth=2.4; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#0f1c33'; _sg={c,ctx,drawing:false,has:false};
  const pos=e=>{ const r=c.getBoundingClientRect(); return {x:(e.clientX-r.left)*(c.width/r.width), y:(e.clientY-r.top)*(c.height/r.height)}; };
  c.addEventListener('pointerdown',e=>{ e.preventDefault(); _sg.drawing=true; _sg.has=true; const p=pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); try{c.setPointerCapture(e.pointerId);}catch(_){}});
  c.addEventListener('pointermove',e=>{ if(!_sg.drawing) return; e.preventDefault(); const p=pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); });
  c.addEventListener('pointerup',()=>{ _sg.drawing=false; });
}
function sgClear(){ if(_sg.ctx){ _sg.ctx.clearRect(0,0,_sg.c.width,_sg.c.height); _sg.has=false; } }
async function sgSave(){
  if(!_sg.has){ $('sg-msg').textContent='Semnează în casetă întâi.'; return; }
  const btn=$('sg-save'); if(btn) btn.disabled=true;
  try{
    const blob=await new Promise(res=>_sg.c.toBlob(res,'image/png'));
    const tid=(await sb.from('memberships').select('tenant_id').eq('active',true).limit(1).maybeSingle()).data.tenant_id;
    const path=tid+'/signatures/'+S.id+'_'+Date.now()+'.png';
    const up=await sb.storage.from('docs').upload(path,blob,{contentType:'image/png'}); if(up.error) throw up.error;
    const name=($('sg-name').value||'').trim()||null; const now=new Date().toISOString();
    // Scrierea întoarce chiar starea canonică: `updated_at` e pus de trigger cu now() al
    // serverului, deci NU poate fi ghicit în client. Fără `.single()` — ca să distingem
    // „update-ul a eșuat" (u.error) de „a reușit, dar nu putem citi înapoi" (0 rânduri).
    const u=await sb.from('estimates').update({signature_url:path,signer_name:name,signed_at:now,status:'accepted'})
      .eq('id',S.id).select('updated_at,signature_url,signer_name,signed_at,status');
    if(u.error){
      if(isNetErr(u.error)){ console.error('sgSave (rezultat incert)', u.error); closeM(); docStale('Semnarea poate fi înregistrată.'); return; }
      throw u.error;                                        // eroare clară ⇒ semnarea NU s-a înregistrat
    }
    const row=(u.data||[])[0];
    if(!row || !row.updated_at){                            // semnat pe server, dar starea canonică nu s-a putut citi
      console.error('sgSave: semnare reușită, citirea stării canonice a eșuat', u);
      closeM(); docStale('Semnarea a fost înregistrată.'); return;
    }
    S.est.signature_url=row.signature_url; S.est.signer_name=row.signer_name; S.est.signed_at=row.signed_at; S.est.status=row.status;
    S._updatedAt=row.updated_at;                            // tokenul de concurență optimistă, la zi
    closeM(); toast('✅ Semnătură salvată. Ofertă acceptată.'); render();
    historyReset();                                          // abia după sincronizarea canonică
  }catch(e){ if(btn) btn.disabled=false; $('sg-msg').textContent='Eroare: '+(e.message||e); }
}

/* ════ ISTORIC LOCAL — „↶ Anulează" / „↷ Refă" ════════════════════════════════
   Acoperă DOAR modificările locale nesalvate din editor. Nu atinge niciodată
   metadatele serverului (id/tenant_id/updated_at/semnătura) și nu face niciun
   apel la Supabase. După o salvare reușită (RPC 0117) istoricul repornește din
   starea canonică întoarsă de server ⇒ nu se poate anula peste ultima salvare. */

/* Whitelist explicit: doar câmpurile pe care editorul le trimite legitim către
   save_estimate + starea client de care depinde salvarea (markerul auto/manual
   al numărului). Semnătura (signature_url/signer_name/signed_at) NU intră. */
const HIST_DOC=['status','number','client_id','title','issue_date','valid_until','notes','disc_mode','disc_value','vat_mode','vat_value','materials_mode','skonto_off','skonto_pct','plan_url'];
const HIST_LINE=['name','qty','unit','unit_price','vat_rate','disc','group','kind','norm_code','description','photo_url','cat_id','cat_src','_catName','_catPrice','_catUnit','_catDesc','_catPhoto',
  'sub_id','sub_price_id','sub_price_at','sub_price_amount','sub_price_currency','sub_price_name','sub_price_unit'];
let HIST={ cur:null, past:[], future:[], applying:false, tmr:null, key:null };
function captureHistoryState(){
  const d={}; HIST_DOC.forEach(k=>{ d[k]=(S.est[k]===undefined?null:S.est[k]); });
  return JSON.stringify({ doc:d, autoNum:(S._autoNum===undefined?null:S._autoNum),
    lines:(S.lines||[]).map(l=>{ const o={}; HIST_LINE.forEach(k=>{ o[k]=(l[k]===undefined?null:l[k]); }); return o; }),
    groups:(S.groups||[]).map(g=>({id:g.id,name:g.name||'',vat:+g.vat||0,disc:+g.disc||0})) });
}
function applyHistoryState(snap){
  const st=JSON.parse(snap); HIST.applying=true;
  try{
    HIST_DOC.forEach(k=>{ S.est[k]=st.doc[k]; });          // doar cheile din whitelist
    if(st.autoNum!==null) S._autoNum=st.autoNum;
    S.lines=(st.lines||[]).map(l=>Object.assign({},l));
    S.groups=(st.groups||[]).map(g=>Object.assign({},g));
    render();                                              // randare + totaluri prin funcțiile existente
    saveDraftDz();                                          // schița locală rămâne sincronă (no-op dacă S.id)
  } finally { HIST.applying=false; }
}
function historyButtons(){ const u=$('btn-undo'), r=$('btn-redo'); if(u) u.disabled=!HIST.past.length; if(r) r.disabled=!HIST.future.length; }
function historyCommit(){
  if(HIST.applying) return;
  clearTimeout(HIST.tmr); HIST.tmr=null; HIST.key=null;
  const snap=captureHistoryState();
  if(HIST.cur===null){ HIST.cur=snap; historyButtons(); return; }
  if(snap===HIST.cur) return;                              // stări identice nu se salvează
  HIST.past.push(HIST.cur); if(HIST.past.length>HIST_MAX) HIST.past.shift();
  HIST.cur=snap; HIST.future.length=0; historyButtons();
}
function historyFlush(){ if(HIST.tmr) historyCommit(); }   // finalizează tastarea în așteptare
function historyTouch(el){                                 // tastare: un pas per control, nu per caracter
  if(HIST.applying) return;
  if(HIST.key && HIST.key!==el) historyCommit();           // alt control ⇒ pas logic nou
  HIST.key=el; clearTimeout(HIST.tmr); HIST.tmr=setTimeout(historyCommit,HIST_WAIT);
}
function historyUndo(){ historyFlush(); if(!HIST.past.length) return; HIST.future.push(HIST.cur); HIST.cur=HIST.past.pop(); applyHistoryState(HIST.cur); historyButtons(); }
function historyRedo(){ historyFlush(); if(!HIST.future.length) return; HIST.past.push(HIST.cur); HIST.cur=HIST.future.pop(); applyHistoryState(HIST.cur); historyButtons(); }
function historyReset(){ clearTimeout(HIST.tmr); HIST.tmr=null; HIST.key=null; HIST.past=[]; HIST.future=[]; HIST.cur=captureHistoryState(); historyButtons(); }
function histSkip(el){ return !!(el && el.closest && el.closest('#modal-mount')); } // în modale comite butonul lor de salvare
function historyInit(){
  document.addEventListener('input', e=>{ if(!histSkip(e.target)) historyTouch(e.target); });   // bubble: handlerul inline a mutat deja S
  document.addEventListener('change', e=>{ if(!histSkip(e.target)) historyCommit(); });
  document.addEventListener('blur', e=>{ if(!histSkip(e.target)) historyFlush(); }, true);      // blur nu bulează
  document.addEventListener('keydown', e=>{
    if(!(e.ctrlKey||e.metaKey) || e.altKey) return;
    if(histSkip(e.target)) return;                          // în modale rămâne undo-ul nativ al câmpului
    const k=(e.key||'').toLowerCase();
    if(k==='z' && !e.shiftKey){ if(!HIST.past.length && !HIST.tmr) return; e.preventDefault(); historyUndo(); }
    else if((k==='z' && e.shiftKey) || k==='y'){ if(!HIST.future.length) return; e.preventDefault(); historyRedo(); }
  });
  historyReset();
}
/* Acțiuni structurale (onclick / drag / modale / AI) — un pas logic fiecare.
   Câmpurile cu oninput/onchange NU se ambalează: sunt acoperite de listenerele de mai sus. */
['addLine','addLineG','delLine','newGroup','groupSelection','addSelToGroup','delGroup','catalogNew','pickCatalog','pickSubPrice','lineRemovePhoto','skontoToggle','rebuildLinesFromDOM','rebuildGroupsFromDOM','saveLineDetails','cfLinkLine','lcSave','attachPlan','aiOfferRun','aiNotes','saveNewClient'].forEach(function(n){
  const f=window[n]; if(typeof f!=='function') return;
  window[n]=function(){ historyFlush(); const r=f.apply(this,arguments); if(r&&typeof r.then==='function') r.then(historyCommit,historyCommit); else historyCommit(); return r; };
});
boot();
</script>
