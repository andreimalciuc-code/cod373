<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cod373 — Portal client</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#f4f6fb;--surface:#fff;--ink:#0f1c33;--muted:#6b7793;--line:#e5e9f2;--primary:#2f6bff;--accent:#ff8a3d;--green:#16b364;--green-soft:#e3f8ee;--amber-soft:#fdf2dd;--blue-soft:#e8f0ff}
  body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);font-size:15px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:680px;margin:0 auto;padding:1.5rem 1.1rem 4rem}
  .top{display:flex;align-items:center;gap:.6rem;padding:.4rem 0 1.4rem}
  .lg{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--primary),#5b8dff);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:.68rem}
  .nm{font-weight:800;font-size:1.15rem}.nm span{color:var(--accent)}
  .hero{background:linear-gradient(135deg,#0f1c33,#1a2b4a);color:#fff;border-radius:18px;padding:1.6rem;margin-bottom:1.2rem}
  .hero .lab{font-size:.8rem;color:#9fb0d4;text-transform:uppercase;letter-spacing:.05em}
  .hero h1{font-size:1.5rem;margin:.3rem 0 .2rem}
  .hero .addr{color:#cdd7 ;color:#aab8d6;font-size:.9rem}
  .hero .pwrap{margin-top:1.2rem}
  .hero .ptrack{height:12px;background:rgba(255,255,255,.15);border-radius:10px;overflow:hidden}
  .hero .pfill{height:100%;background:linear-gradient(90deg,var(--accent),#ffb27a);border-radius:10px;transition:width .6s}
  .hero .pmeta{display:flex;justify-content:space-between;margin-top:.5rem;font-size:.85rem;color:#cdd9f2}
  .pill{display:inline-block;padding:.2rem .7rem;border-radius:20px;font-size:.78rem;font-weight:600;background:rgba(255,255,255,.16);color:#fff}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1.2rem;margin-bottom:1rem}
  .card h3{font-size:1rem;margin-bottom:.9rem}
  .stage{display:flex;align-items:center;gap:.8rem;padding:.7rem 0;border-bottom:1px solid var(--line)}
  .stage:last-child{border-bottom:none}
  .dot{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.9rem;flex-shrink:0}
  .dot.done{background:var(--green-soft);color:var(--green)}.dot.active{background:var(--blue-soft);color:var(--primary)}.dot.plan{background:#eef0f5;color:var(--muted)}.dot.delayed{background:var(--amber-soft);color:#92400e}
  .stage .g{flex:1}.stage .t{font-weight:600}.stage .s{font-size:.8rem;color:var(--muted)}
  .stage .pc{font-weight:700;color:var(--primary)}
  .tlrow{display:grid;grid-template-columns:128px 1fr 42px;gap:.6rem;align-items:center;padding:.5rem 0;border-bottom:1px solid var(--line)}
  .tlrow:last-child{border-bottom:none}
  .tlname{font-weight:600;font-size:.85rem;line-height:1.25}.tlname small{display:block;color:var(--muted);font-weight:400;font-size:.71rem;margin-top:.1rem}
  .track{position:relative;height:20px;background:#f1f4fa;border-radius:6px}
  .bar{position:absolute;top:0;height:100%;border-radius:6px;min-width:5px;overflow:hidden}
  .bar.done{background:rgba(22,179,100,.3)}.bar.active{background:rgba(47,107,255,.3)}.bar.plan{background:rgba(148,163,184,.35)}.bar.delayed{background:rgba(239,68,68,.3)}
  .bar .prog{position:absolute;left:0;top:0;height:100%}
  .bar.done .prog{background:var(--green)}.bar.active .prog{background:var(--primary)}.bar.plan .prog{background:#94a3b8}.bar.delayed .prog{background:#ef4444}
  .ms{position:absolute;top:50%;width:13px;height:13px;transform:translate(-50%,-50%) rotate(45deg);background:var(--ink);border:2px solid #fff;border-radius:2px}
  .tlpc{font-weight:700;font-size:.8rem;text-align:right;color:var(--muted)}
  .lgnd{margin-top:.7rem;display:flex;gap:.9rem;flex-wrap:wrap;font-size:.72rem;color:var(--muted);align-items:center}
  .lgnd i{width:11px;height:11px;border-radius:3px;display:inline-block;margin-right:.25rem;vertical-align:middle}
  .kv{display:flex;justify-content:space-between;padding:.5rem 0;border-bottom:1px solid var(--line);font-size:.92rem}
  .kv:last-child{border-bottom:none}.kv .k{color:var(--muted)}
  .center{text-align:center;padding:4rem 1.5rem;color:var(--muted)}
  .center .ei{font-size:3rem;margin-bottom:1rem}
  .foot{text-align:center;color:var(--muted);font-size:.8rem;margin-top:1.5rem}
  .loading{text-align:center;padding:4rem;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="lg">C373</div><div class="nm">Cod<span>373</span> · Portal client</div></div>
  <div id="content"><div class="loading">Se încarcă…</div></div>
  <div class="foot">Pagină generată de Cod373 — vizualizare pentru client, fără cost.</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://vzatmfhkwiojqkowtftg.supabase.co';
const SUPABASE_KEY='sb_publishable_wNj9S8eta39n1Gkq_g-gfA_idl_pbPy';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
function esc(s){return(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function money(n){return n==null?'':Number(n).toLocaleString('ro-RO')+' MDL';}
const SL={planned:['Planificat'],active:['În execuție'],paused:['În pauză'],done:['Finalizat'],cancelled:['Anulat']};
const STG={plan:'plan',active:'active',done:'done',delayed:'delayed'};
function center(ic,msg){document.getElementById('content').innerHTML='<div class="center"><div class="ei">'+ic+'</div>'+esc(msg)+'</div>';}

(async function(){
  const token=new URLSearchParams(location.search).get('token');
  if(!token){ center('🔒','Link invalid. Cere firmei un link valid de acces.'); return; }
  const { data, error }=await sb.rpc('portal_data',{p_token:token});
  if(error){ center('⚠️','A apărut o eroare. Încearcă din nou mai târziu.'); return; }
  if(!data || data.error){
    const m={invalid:'Link invalid sau revocat.',expired:'Linkul a expirat.',nosite:'Proiectul nu mai este disponibil.'}[data&&data.error]||'Link indisponibil.';
    center('🔒',m); return;
  }
  const s=data.site, stages=data.stages||[];
  const fmtd=d=>{ if(!d) return ''; const p=String(d).slice(0,10).split('-'); return p.length===3?(p[2]+'.'+p[1]+'.'+p[0].slice(2)):d; };
  let stagesHtml='';
  if(stages.length){
    const dated=stages.filter(st=>st.start_date&&st.end_date);
    let body;
    if(dated.length){
      const min=Math.min(...dated.map(st=>+new Date(st.start_date)));
      const max=Math.max(...dated.map(st=>+new Date(st.end_date)));
      const span=Math.max(86400000,max-min);
      body='<div class="tl">'+stages.map(st=>{
        const cls=STG[st.status]||'plan'; let bar='';
        if(st.start_date&&st.end_date){
          const l=(+new Date(st.start_date)-min)/span*100;
          if(st.is_milestone){ bar='<span class="ms" style="left:'+l+'%" title="Jalon"></span>'; }
          else { const w=Math.max(2,((+new Date(st.end_date)-+new Date(st.start_date))/span)*100);
            bar='<div class="bar '+cls+'" style="left:'+l+'%;width:'+w+'%"><div class="prog" style="width:'+(st.progress||0)+'%"></div></div>'; }
        }
        return '<div class="tlrow"><div class="tlname">'+(st.is_milestone?'◆ ':'')+esc(st.name)
          +'<small>'+fmtd(st.start_date)+(st.is_milestone?'':(st.end_date?(' → '+fmtd(st.end_date)):''))+'</small></div>'
          +'<div class="track">'+bar+'</div>'
          +'<div class="tlpc">'+(st.is_milestone?'◆':((st.progress||0)+'%'))+'</div></div>';
      }).join('')+'</div>'
      +'<div class="lgnd"><span><i style="background:var(--green)"></i>Finalizat</span><span><i style="background:var(--primary)"></i>În lucru</span><span><i style="background:#94a3b8"></i>Planificat</span><span><i style="background:#ef4444"></i>Întârziat</span><span>◆ Jalon</span></div>';
    } else {
      body=stages.map(st=>{ const cls=STG[st.status]||'plan'; const ic=st.status==='done'?'✓':st.status==='active'?'●':st.status==='delayed'?'!':'○';
        return '<div class="stage"><div class="dot '+cls+'">'+ic+'</div><div class="g"><div class="t">'+esc(st.name)+'</div></div><div class="pc">'+(st.progress||0)+'%</div></div>'; }).join('');
    }
    stagesHtml='<div class="card"><h3>Graficul lucrărilor</h3>'+body+'</div>';
  }
  let costHtml='';
  if(data.show_costs && s.budget!=null){
    costHtml='<div class="card"><h3>Detalii financiare</h3><div class="kv"><span class="k">Buget contractat</span><b>'+money(s.budget)+'</b></div></div>';
  }
  document.getElementById('content').innerHTML=
    '<div class="hero"><div class="lab">Proiectul dumneavoastră</div><h1>'+esc(s.name)+'</h1>'
    +(s.address?'<div class="addr">📍 '+esc(s.address)+'</div>':'')
    +'<div class="pwrap"><div class="ptrack"><div class="pfill" style="width:'+(s.progress||0)+'%"></div></div>'
    +'<div class="pmeta"><span>Progres lucrări</span><span><b>'+(s.progress||0)+'%</b></span></div></div>'
    +'<div style="margin-top:1rem"><span class="pill">'+esc((SL[s.status]||['—'])[0])+'</span>'
    +(s.deadline?' <span class="pill">Termen: '+esc(s.deadline)+'</span>':'')+'</div></div>'
    +stagesHtml+costHtml
    +'<div class="card" style="background:var(--blue-soft);border:none"><b>Aveți întrebări?</b><div style="color:var(--muted);font-size:.9rem;margin-top:.3rem">Contactați echipa de proiect pentru orice detaliu legat de lucrare.</div></div>';
})();
</script>
<script src="i18n.js"></script>
</body>
</html>
