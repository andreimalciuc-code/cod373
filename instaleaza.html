<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Instalează Cod373 pe telefon</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f1c33">
<link rel="icon" href="icon-192.png">
<style>
  :root{--navy:#0f1c33;--blue:#2f6bff;--bg:#f4f6fb;--line:#e5e9f2;--muted:#6b7793}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--navy);line-height:1.5;padding-bottom:2rem}
  header{background:var(--navy);color:#fff;padding:1rem;display:flex;align-items:center;gap:.6rem}
  .logo{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#2f6bff,#7aa5ff);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.75rem}
  .orange{color:#ff8a3d}
  .wrap{max-width:560px;margin:0 auto;padding:1.2rem}
  h1{font-size:1.4rem;text-align:center;margin:.4rem 0 .2rem}
  .sub{text-align:center;color:var(--muted);margin-bottom:1.2rem}
  .qr{background:#fff;border:1px solid var(--line);border-radius:16px;padding:1.2rem;text-align:center;margin-bottom:1.2rem}
  .qr #qrbox{display:inline-block;margin:.3rem auto}
  .qr .u{font-size:.78rem;color:var(--muted);word-break:break-all;margin-top:.5rem}
  .btn{display:inline-block;background:var(--blue);color:#fff;padding:.7rem 1.3rem;border-radius:10px;font-weight:700;text-decoration:none;margin-top:.6rem}
  .tabs{display:flex;gap:.5rem;justify-content:center;margin-bottom:.8rem}
  .tabs button{flex:1;max-width:160px;padding:.6rem;border:1px solid var(--line);background:#fff;border-radius:10px;font-weight:700;cursor:pointer;font-size:.9rem}
  .tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .steps{background:#fff;border:1px solid var(--line);border-radius:16px;padding:1.1rem 1.2rem}
  .step{display:flex;gap:.7rem;padding:.55rem 0;border-bottom:1px solid var(--line);align-items:flex-start}
  .step:last-child{border-bottom:none}
  .n{flex-shrink:0;width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.85rem}
  .lang{margin-left:auto;display:flex;gap:.3rem}
  .lang button{background:rgba(255,255,255,.15);color:#fff;border:none;padding:.25rem .55rem;border-radius:7px;font-weight:700;cursor:pointer;font-size:.78rem}
  .lang button.on{background:#fff;color:var(--navy)}
  .note{font-size:.8rem;color:var(--muted);text-align:center;margin-top:1rem}
</style>
</head>
<body>
<header>
  <span class="logo">C373</span><b>Cod<span class="orange">373</span></b>
  <div class="lang"><button data-l="ro" class="on" onclick="setLang('ro')">RO</button><button data-l="ru" onclick="setLang('ru')">RU</button></div>
</header>

<div class="wrap">
  <h1 id="t-title">Instalează aplicația pe telefon</h1>
  <div class="sub" id="t-sub">Scanează codul cu camera telefonului sau urmează pașii de mai jos.</div>

  <div class="qr">
    <div id="qrbox"></div>
    <div class="u" id="qrurl"></div>
    <a class="btn" id="openbtn" href="#">📲 <span id="t-open">Deschide direct</span></a>
  </div>

  <div class="tabs">
    <button id="tab-android" class="on" onclick="setTab('android')">🤖 Android</button>
    <button id="tab-ios" onclick="setTab('ios')"> iPhone</button>
  </div>

  <div class="steps" id="steps"></div>

  <div class="note" id="t-note"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
var T = {
  ro: {
    title:"Instalează aplicația pe telefon",
    sub:"Scanează codul cu camera telefonului sau urmează pașii de mai jos.",
    open:"Deschide direct",
    note:"Aplicația funcționează și offline. Pe iPhone, instalarea se face doar din Safari.",
    android:[
      "Deschide această pagină în <b>Chrome</b>.",
      "Apasă meniul <b>⋮</b> (sus-dreapta) → <b>„Instalează aplicația”</b> (sau „Adaugă pe ecranul principal”).",
      "Confirmă <b>„Instalează”</b>. Gata — iconița Cod373 apare pe ecran."
    ],
    ios:[
      "Deschide această pagină în <b>Safari</b> (nu Chrome).",
      "Apasă butonul <b>Share</b> (pătratul cu săgeată ↑).",
      "Alege <b>„Adaugă pe ecranul principal”</b>.",
      "Apasă <b>„Adaugă”</b>. Gata — iconița Cod373 apare pe ecran."
    ]
  },
  ru: {
    title:"Установи приложение на телефон",
    sub:"Отсканируй код камерой телефона или следуй шагам ниже.",
    open:"Открыть напрямую",
    note:"Приложение работает и офлайн. На iPhone установка только через Safari.",
    android:[
      "Открой эту страницу в <b>Chrome</b>.",
      "Нажми меню <b>⋮</b> (вверху справа) → <b>«Установить приложение»</b> (или «Добавить на главный экран»).",
      "Подтверди <b>«Установить»</b>. Готово — значок Cod373 появится на экране."
    ],
    ios:[
      "Открой эту страницу в <b>Safari</b> (не Chrome).",
      "Нажми кнопку <b>Поделиться</b> (квадрат со стрелкой ↑).",
      "Выбери <b>«На экран „Домой”»</b>.",
      "Нажми <b>«Добавить»</b>. Готово — значок Cod373 появится на экране."
    ]
  }
};
var lang='ro', tab='android';
var fieldUrl = new URL('mobil.html', location.href).href;  // aplicația de teren
document.getElementById('qrurl').textContent = fieldUrl;
document.getElementById('openbtn').href = fieldUrl;
try{ new QRCode(document.getElementById('qrbox'), { text: fieldUrl, width: 200, height: 200, colorDark:'#0f1c33', colorLight:'#ffffff' }); }catch(e){ document.getElementById('qrbox').innerHTML='<a href="'+fieldUrl+'">'+fieldUrl+'</a>'; }

function render(){
  var d=T[lang];
  document.getElementById('t-title').textContent=d.title;
  document.getElementById('t-sub').textContent=d.sub;
  document.getElementById('t-open').textContent=d.open;
  document.getElementById('t-note').textContent=d.note;
  var arr=d[tab];
  document.getElementById('steps').innerHTML=arr.map(function(s,i){ return '<div class="step"><div class="n">'+(i+1)+'</div><div>'+s+'</div></div>'; }).join('');
  document.querySelectorAll('.lang button').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-l')===lang); });
  document.getElementById('tab-android').classList.toggle('on', tab==='android');
  document.getElementById('tab-ios').classList.toggle('on', tab==='ios');
}
function setLang(l){ lang=l; render(); }
function setTab(t){ tab=t; render(); }
// detectează platforma
var ua=navigator.userAgent||'';
if(/iPad|iPhone|iPod/.test(ua) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1)) tab='ios';
else if(/Android/.test(ua)) tab='android';
render();
</script>
</body>
</html>
